<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flying Pig Improv Tool v1</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: clip; }

/* ── BASE ────────────────────────────────── */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: #f0f0f0;
  color: #111;
  font-size: 14px;
  min-height: 100vh;
}

/* ── HEADER ──────────────────────────────── */
#app-header {
  background: #1a3a5c;
  color: white;
  padding: 10px 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#app-header h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding-bottom: 8px;
  line-height: 1.2;
}
#app-header h1 span { opacity: 0.7; font-weight: 400; font-size: 13px; }
@media (max-width: 540px) {
  #app-header h1 { font-size: 15px; }
  #app-header h1 span { display: none; }
}
.tab-nav { display: flex; gap: 0; }
.tab-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.65);
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  font-weight: 500;
  transition: all 0.15s;
}
.tab-btn:hover { color: white; }
.tab-btn.active { color: white; border-bottom-color: #5ba4e0; }
.feedback-btn {
  margin-left: auto;
  background: none;
  border: none;
  color: rgba(255,255,255,0.55);
  font-size: 12px;
  padding: 8px 12px 11px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.feedback-btn:hover { color: white; }

/* ── TABS ────────────────────────────────── */
.tab { display: none; }
.tab.active { display: block; }

/* ── BROWSE TAB ──────────────────────────── */
#tab-browse { padding: 12px; }
.search-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.search-row input {
  grid-column: 1 / -1;
  padding: 7px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 13px;
  background: white;
  width: 100%;
  box-sizing: border-box;
}
.search-row select {
  padding: 7px 4px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 12px;
  background: white;
  color: #333;
  width: 100%;
  box-sizing: border-box;
  min-width: 0;
}
@media (max-width: 600px) {
  .search-row { grid-template-columns: 1fr 1fr; }
}
.result-count {
  font-size: 11px;
  color: #888;
  margin-bottom: 8px;
}

/* ── ACTIVITY CARDS ─────────────────────── */
.activity-card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 5px;
  margin-bottom: 6px;
  overflow: hidden;
}
.activity-card.expanded { border-color: #1a3a5c; }
.activity-header {
  padding: 10px 12px;
  cursor: pointer;
  user-select: none;
}
.activity-header:hover { background: #f8f8f8; }
.activity-name-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.activity-name {
  font-weight: 600;
  font-size: 14px;
  color: #111;
  flex: 1;
}
.expand-icon { color: #999; font-size: 11px; flex-shrink: 0; }
.activity-meta-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 4px;
  flex-wrap: wrap;
}
.activity-category {
  font-size: 11px;
  color: #777;
}
.activity-short-desc {
  font-size: 12px;
  color: #555;
  margin-top: 5px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.activity-difficulty {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.diff-low     { background: #d4edda; color: #155724; }
.diff-mid-low { background: #e8f5c2; color: #3d6b1a; }
.diff-medium  { background: #fff3cd; color: #856404; }
.diff-mid-high{ background: #ffe5cc; color: #7d3800; }
.diff-high    { background: #f8d7da; color: #721c24; }

.badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  vertical-align: middle;
  display: inline-block;
}
.badge-beginner { background: #cce5ff; color: #004085; }
.badge-advanced { background: #e2d9f3; color: #4a1d96; }
.badge-show     { background: #ffd6a5; color: #7d3800; }

/* ── ACTIVITY EXPANDED ───────────────────── */
.activity-full {
  border-top: 1px solid #eee;
  padding: 12px;
  background: #fafafa;
}
.activity-meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 4px 12px;
  margin-bottom: 10px;
  font-size: 12px;
  color: #444;
}
.meta-skills, .meta-use, .meta-avoid {
  font-size: 12px;
  color: #444;
  margin-bottom: 6px;
  line-height: 1.4;
}
.meta-avoid { color: #7d3800; }
.full-markdown {
  font-size: 12px;
  line-height: 1.5;
  color: #333;
  margin-top: 10px;
  border-top: 1px solid #e0e0e0;
  padding-top: 10px;
  max-height: 400px;
  overflow-y: auto;
  overflow-x: auto;
}
.full-markdown h1, .full-markdown h2, .full-markdown h3 {
  font-size: 12px;
  font-weight: 700;
  color: #1a3a5c;
  margin: 8px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.full-markdown h1 { font-size: 13px; }
.full-markdown p { margin-bottom: 6px; }
.full-markdown ul { padding-left: 16px; margin-bottom: 6px; }
.full-markdown li { margin-bottom: 2px; }
.full-markdown strong { color: #222; }
.full-markdown hr { border: none; border-top: 1px solid #ddd; margin: 8px 0; }
.no-results { color: #888; font-size: 13px; padding: 20px; text-align: center; }

/* ── LINEUP TAB ──────────────────────────── */
#tab-lineup { padding: 12px; }
.mode-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.mode-btn {
  padding: 9px 16px;
  border: 2px solid #1a3a5c;
  background: white;
  color: #1a3a5c;
  font-size: 13px;
  font-weight: 600;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s;
}
.mode-btn:hover { background: #eef3f8; }
.mode-btn.active { background: #1a3a5c; color: white; }
.lineup-placeholder {
  text-align: center;
  color: #aaa;
  padding: 40px 20px;
  font-size: 13px;
}

.lineup-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  gap: 10px;
  flex-wrap: wrap;
}
.lineup-title-row { display: flex; align-items: baseline; gap: 10px; }
.lineup-title-row h2 { font-size: 16px; color: #1a3a5c; }
.lineup-duration { font-size: 12px; color: #888; }
.print-btn {
  padding: 7px 14px;
  background: #1a3a5c;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.print-btn:hover { background: #2a5080; }

.lineup-slot {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 5px;
  padding: 10px 12px;
  margin-bottom: 6px;
}
.slot-opening { border-left: 4px solid #5ba4e0; }
.slot-warmup  { border-left: 4px solid #6cc99a; }
.slot-circle  { border-left: 4px solid #6cc99a; }
.slot-capstone { border-left: 4px solid #f9a825; }
.slot-closer  { border-left: 4px solid #ef5350; }
.slot-shortform { border-left: 4px solid #7e57c2; }
.slot-longform  { border-left: 4px solid #26a69a; }
.slot-guessing  { border-left: 4px solid #ff7043; }
.slot-final     { border-left: 4px solid #ef5350; }
.slot-opener    { border-left: 4px solid #5ba4e0; }
.slot-formal-opening  { border-left: 4px solid #90a4ae; }
.slot-formal-closing  { border-left: 4px solid #90a4ae; }
.slot-early           { border-left: 4px solid #81c784; }
.slot-mid             { border-left: 4px solid #4db6ac; }
.slot-late            { border-left: 4px solid #7e57c2; }
.slot-skills          { border-left: 4px solid #26c6da; }
.slot-filler          { border-left: 4px solid #bdbdbd; }
.slot-conducted-song  { border-left: 4px solid #ffa726; }

.slot-number {
  font-size: 16px;
  font-weight: 700;
  color: #bbb;
  min-width: 24px;
  text-align: right;
  padding-top: 1px;
}
.slot-body { flex: 1; }
.slot-name { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 3px; }
.slot-name-link { cursor: pointer; text-decoration: underline; text-decoration-color: #bbb; text-underline-offset: 2px; }
.slot-name-link:hover { color: #1a3a5c; text-decoration-color: #1a3a5c; }
.slot-desc { font-size: 11px; color: #666; margin-bottom: 5px; line-height: 1.4; }
.slot-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.reason-tag {
  font-size: 10px;
  background: #eef0f2;
  color: #555;
  padding: 2px 6px;
  border-radius: 3px;
}
.slot-actions { flex-shrink: 0; padding-top: 2px; display: flex; flex-direction: row; gap: 8px; align-items: flex-start; }
.regen-btn {
  background: none;
  border: 1px solid #ccc;
  color: #555;
  padding: 9px 13px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.regen-btn:hover { background: #f0f0f0; border-color: #999; }
.pick-btn {
  background: none;
  border: 1px solid #ccc;
  color: #555;
  padding: 9px 13px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  min-width: 44px;
  min-height: 44px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pick-btn:hover { background: #eef3f8; border-color: #5ba4e0; color: #1a3a5c; }
.locked-icon { font-size: 12px; opacity: 0.4; }

/* ── ACTIVITY PICKER PANEL ───────────────── */
#activity-picker {
  position: fixed;
  background: white;
  border: 1px solid #ccc;
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  z-index: 1000;
  width: 240px;
  max-height: 280px;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
#activity-picker.open { display: flex; }
#picker-search {
  padding: 7px 10px;
  border: none;
  border-bottom: 1px solid #eee;
  font-size: 12px;
  outline: none;
  flex-shrink: 0;
}
#picker-list {
  overflow-y: auto;
  flex: 1;
}
.pick-item {
  padding: 10px 12px;
  font-size: 13px;
  cursor: pointer;
  color: #222;
  border-bottom: 1px solid #f5f5f5;
  min-height: 44px;
  display: flex;
  align-items: center;
}
.pick-item:hover { background: #eef3f8; color: #1a3a5c; }
.pick-item.current { font-weight: 600; background: #f0f4f8; }
#picker-empty { padding: 12px 10px; font-size: 12px; color: #aaa; text-align: center; }

/* ── PRINT VIEW (hidden on screen) ───────── */
#print-view { display: none; }

/* ── PRINT CSS ───────────────────────────── */
@media print {
  body, * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* Mobile fix (2026-08-10): body's screen rule `min-height: 100vh` was never reset for
     print. On phones `vh` resolves against the device screen, not the page box, so the
     body could end up taller than the sheet and emit a trailing blank page. Reset the
     box model explicitly and forbid a break after the panel grid. */
  html, body {
    min-height: 0 !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    background: white !important;
  }
  #app-header, #tab-browse, #tab-lineup { display: none !important; }
  #print-view {
    display: grid !important;
    grid-template-columns: 3.9in 3.9in;
    grid-template-rows: 3.25in 3.25in 3.25in;
    gap: 0;
    background: none;
    margin: 0;
    padding: 0;
  }
  .print-panel {
    width: 3.9in;
    height: 3.25in;
    overflow: hidden;
    border: 0.4pt solid #aaa;
    padding: 0.08in;
    font-family: Arial, Helvetica, sans-serif;
    position: relative;
    background: white;
  }
  /* All three sections span both columns */
  #pp1, #pp2, #pp3 {
    grid-column: 1 / 3;
    width: 7.8in;
    height: 3.25in;
    column-fill: auto;
    overflow: hidden;
  }
  /* Lineup and Skill Focus: 2 columns */
  #pp1, #pp2 {
    column-count: 2;
    column-gap: 0.2in;
  }
  /* Game Reference: 5 columns (widened from 4 on 2026-08-10 as the catalog grew) */
  #pp3 {
    column-count: 5;
    column-gap: 0.1in;
  }
  #pp4, #pp5, #pp6 { display: none !important; }
  .pp-title {
    font-size: 8pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #222;
    border-bottom: 1pt solid #333;
    padding-bottom: 2pt;
    margin-bottom: 3pt;
    line-height: 1.2;
    column-span: all;
  }
  .pp-subtitle {
    font-size: 7pt;
    color: #666;
    margin-bottom: 4pt;
    line-height: 1.2;
    column-span: all;
  }
  .pp-section-head {
    font-size: 6.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #444;
    border-bottom: 0.3pt solid #bbb;
    margin-top: 4pt;
    margin-bottom: 2pt;
  }
  .pp-divider {
    font-size: 6pt;
    color: #999;
    text-align: center;
    margin: 4pt 0 2pt;
    letter-spacing: 0.04em;
    break-before: avoid;
  }
  .pp-activity { margin-bottom: 3pt; break-inside: avoid; }
  .pp-activity-name { font-size: 8pt; font-weight: bold; color: #111; line-height: 1.2; }
  .pp-activity-desc { font-size: 7pt; color: #444; line-height: 1.25; padding-left: 9pt; }
  .pp-activity-tags { font-size: 6.5pt; color: #888; font-style: italic; line-height: 1.2; padding-left: 9pt; }
  .pp-look-row { margin-bottom: 3pt; break-inside: avoid; }
  .pp-look-game { font-size: 7.5pt; font-weight: bold; color: #222; line-height: 1.2; }
  .pp-look-cues { font-size: 7pt; color: #555; padding-left: 8pt; line-height: 1.25; }
  .pp-avoid { color: #8b4513; font-style: italic; }
  .pp-ref-cols { display: flex; gap: 0.1in; }
  .pp-ref-col { flex: 1; }
  .pp-ref-cat {
    font-size: 6.5pt;
    font-weight: bold;
    text-transform: uppercase;
    color: #333;
    border-bottom: 0.3pt solid #ccc;
    margin-top: 2pt;
    margin-bottom: 1pt;
  }
  .pp-ref-cat:first-child { margin-top: 0; }
  /* One game per line, always. Names too long for the narrower 5-column layout are
     truncated with an ellipsis rather than wrapping — wrapping silently ate entries
     off the end of the panel. */
  .pp-ref-game {
    font-size: 8pt;
    line-height: 1.15;
    color: #111;
    padding-left: 4pt;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Nothing may follow the panel grid onto a second sheet. */
  #print-view { break-after: avoid !important; page-break-after: avoid !important; }
  #print-view > *:last-child { break-after: avoid !important; page-break-after: avoid !important; }
  #show-setlist, #activity-modal { display: none !important; }
  @page { margin: 0.25in; size: 8.5in 11in portrait; }
}

/* ── ACTIVITY MODAL ─────────────────────── */
#activity-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 500;
  background: rgba(0,0,0,0.45);
  padding: 16px;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#activity-modal.open { display: flex; }
.modal-card {
  background: white;
  border-radius: 8px;
  width: 100%;
  max-width: 640px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
  position: relative;
}
.modal-header {
  padding: 16px 40px 10px 16px;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  background: white;
  z-index: 1;
}
.modal-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 4px; }
.modal-meta-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 20px;
  color: #888;
  cursor: pointer;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
}
.modal-close:hover { background: #f0f0f0; color: #333; }
.modal-body { padding: 14px 16px 20px; }
.modal-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 16px;
  font-size: 12px;
  color: #555;
  margin-bottom: 12px;
}
@media (max-width: 480px) {
  #activity-modal { padding: 0; align-items: flex-end; }
  .modal-card { border-radius: 12px 12px 0 0; max-height: 85vh; max-width: 100%; }
  .modal-meta-grid { grid-template-columns: 1fr; }
}

      "fullMarkdown": "**Skills**\nphysical commitment; energy; trajectory; receiving offers\n\n**Rules**\n- Players stand in a circle. One player mimes throwing a ninja star to any other player, accompanied by a strong martial arts sound.\n- The receiver catches the star in a way that matches how it was thrown \u2014 honoring its weight, speed, and trajectory.\n- The receiver then throws to any other player. The pattern continues.\n\n**Success Looks Like**\nEach throw and catch feels physically committed; the star maintains consistent weight and energy as it travels around the circle.\n\n**For Students**\n- Commit fully to the throw \u2014 weak or half-hearted choices break the game.\n- When you catch, honor what was thrown: match its weight, speed, and trajectory.\n- Martial arts sounds are welcome and encouraged \u2014 energy matters more than getting the sound exactly right.\n\n**For Teachers**\n- The sound is called a *kiai* (pronounced kee-eye) \u2014 a term from Japanese martial arts used to express energy and intent through vocalization.\n- A good kiai should come from the *chi* \u2014 deep in the belly \u2014 not from the throat.\n- The goal is physical projection and full commitment, not technique or accuracy.\n- Watch for: half-committed throws, receivers who ignore trajectory, or energy dropping as the star passes around.\n\n---",

      "fullMarkdown": "**Skills**\nobject work; sound/movement matching; trajectory\n\n**Rules**\n- Players stand in a circle. The object begins as a buzzing, softball-sized imaginary object.\n- A player throws the ball with a sound to any other player.\n- On the catch, the receiver repeats the sound the thrower made.\n- Then the receiver creates a new sound and throws to the next player.\n- Preserve the object's weight, size, and trajectory throughout.\n\n**Success Looks Like**\nThe object feels consistent and real as it travels around the circle; sounds are honored on the catch and invented freshly on the throw.\n\n**For Students**\n- Repeat the sound when you catch \u2014 don't skip it or change it immediately.\n- Honor the object's weight and size; don't let it drift into something different.\n- Track where the object is coming from and receive it at the right trajectory.\n\n**For Teachers**\n- It's useful to demonstrate object work by pulling the Sound Ball out of an imaginary cabinet before play begins.\n- Coach when the object returns to you \u2014 use those moments to reset object consistency.\n- Watch for: receivers skipping the catch sound, the object losing its physical properties, or trajectory being ignored.\n\n---",

      "fullMarkdown": "**Skills**\nfast tiny scenes; physical specificity; prompt acceptance\n\n**Rules**\n- Players stand in a circle. The group chants: \"Where have your fingers been, oh where have your fingers been, whoo, whoo.\"\n- One player gives the next a setting or prompt (e.g., \"in the kitchen,\" \"at Starbucks,\" \"on an airplane\").\n- The receiving player uses their index fingers as characters and acts out a short three-line scene.\n- After performing, that player gives a new prompt to the next player. Repeat around the circle.\n\n**Success Looks Like**\nFingers behave as committed characters; scenes are brief and clear; players accept prompts quickly and pass good ones.\n\n**For Students**\n- Let your fingers be the characters \u2014 commit to the puppet logic rather than apologizing for it.\n- Keep it short: a simple relationship or conflict is enough for three lines.\n- Speed matters more than polish. Start before you have a plan.\n- Pass a prompt that's easy and fun to play \u2014 specific location, not a mood or concept.\n\n**For Teachers**\n- Coaches mainly reinforce the rules and structure rather than heavily coaching scene content.\n- Watch for: fingers that just point vaguely instead of playing characters, scenes that run too long, or prompts that are too vague to play quickly.\n- Self-consciousness is the biggest blocker \u2014 acknowledge the silliness and model commitment.",

      "fullMarkdown": "**Skills**\narticulation; projection readiness; diction\n\n**Rules**\n- The instructor provides a phrase; there is no fixed Flying Pig list \u2014 phrases rotate.\n- The group repeats or works the phrase as directed.\n- The emphasis is clarity over speed: clean vowels, full consonants, and finished final sounds.\n\n**Success Looks Like**\nPlayers finish every sound \u2014 including final consonants \u2014 at a volume and clarity that would carry to the back of a room.\n\n**For Students**\n- Don't rush for speed until the phrase is clear \u2014 clarity first, then pace.\n- Finish your words: final consonants get swallowed most often.\n- Keep vowels open and intentional; don't let them flatten under pressure.\n\n**For Teachers**\n- The goal is stage-readiness, not just getting through the phrase \u2014 resist letting it become a speed race.\n- Watch for: volume dropping as difficulty increases, mumbled consonants, or swallowed endings.\n- Suggested phrases: \"Red leather, yellow leather, red leather, yellow leather.\" / \"Unique New York, unique New York, you know you need unique New York.\" / \"She sells seashells by the seashore.\" / \"Toy boat, toy boat, toy boat.\"\n\n---",

      "fullMarkdown": "**Skills**\nassociation; speed; listening; low filter\n\n**Rules**\n- Players stand in a circle. Player 1 says any word.\n- Each player immediately responds with the first word that comes to mind \u2014 no hesitation.\n- The goal is speed and honesty, not cleverness or originality.\n- In larger circles, multiple starting words can be active simultaneously.\n\n**Success Looks Like**\nThe circle flows fast and continuously; responses are honest rather than clever; players stop monitoring themselves and just play.\n\n**For Students**\n- Say the first word that comes to mind \u2014 the \"obvious\" association is usually the right one.\n- Don't pause to evaluate whether your response is interesting or funny.\n- Try not to repeat a word someone else has already used.\n- In A to C, your job is to step past the most predictable word into the next connected idea.\n- In No Nouns, watch for yourself defaulting to objects, names, or places.\n- Once comfortable, challenge yourself with a different methodology \u2014 rhyming, matching the first letter or sound, or starting with the last letter or sound of the previous word.\n\n**For Teachers**\n- The exercise is about lowering the filter, not expanding vocabulary \u2014 keep the emphasis on momentum.\n- Start multiple words simultaneously in large circles to increase load and force presence.\n- Encourage students to reflect on how they find their word \u2014 is the association based on sound, color, feeling, or something else?\n- Watch for: players trying to be funny, pausing too long, responding to a previous word rather than the most recent one, or the circle slowing into polite caution.\n\n---",

      "fullMarkdown": "**Skills**\nrhythm; focus; commitment; recovery\n\n**Rules**\n- Players stand in a circle. The group establishes a rhythmic chant underneath: \"Kum-chak-a, Kum-chak-a.\"\n- The active player holds up two fingers on each hand as the bunny. Fingers toward self: \"Bunny bunny.\" Fingers toward another player: \"Bunny bunny\" \u2014 passing the bunny to them.\n- The receiving player repeats: bunny toward self, then bunny toward someone else.\n- The players immediately to either side of the active bunny raise their hands and say \"Ticky tocky, ticky tocky.\"\n- Speed increases over time until it becomes controlled chaos.\n\n**Success Looks Like**\nThe chant stays strong; bunny passes are clear and directed; side players hit their cues; the group keeps its energy through mistakes.\n\n**For Students**\n- Make your bunny pass clear and directed \u2014 vague gestures lose the circle.\n- Stay in the chant even when you're not the active bunny; it holds everyone together.\n- Watch your neighbors \u2014 the \"Ticky tocky\" role arrives fast and without warning.\n\n**For Teachers**\n- Establish the chant before adding the bunny pass; the rhythm is the foundation.\n- Add \"Ticky tocky\" only after the basic pass is stable.\n- The goal is collective focus under playful pressure \u2014 perfection isn't the point, recovery is.",

      "fullMarkdown": "**Skills**\nrule tracking; side-player awareness; reaction speed\n\n**Rules**\n- One player starts in the center and points at circle players with one of the calls below. If the targeted player or a required side player fails, they swap into the center.\n- Rules are added gradually, not all at once.\n\n\"Bibbity Bibbity Bop\"\n- Target: Say \"Bop\" before the center finishes their last \"Bop.\"\n\n\"Bop\"\n- Target: Say nothing. Any response = fail.\n\n\"Washing Machine\"\n- Target: Washing machine sounds + hands moving back and forth (7 sec).\n- Sides: Say \"Chugga Chugga\" while moving hands toward the target.\n\n\"Elephant\"\n- Target: Elephant trunk with arms + trumpet sound (7 sec).\n- Sides: Form the elephant's ears with their hands.\n\n\"Red Baron\"\n- Target: Goggles with hands + crashing plane scream (7 sec).\n- Sides: Arms out straight as wings \u2014 both tilt the same direction.\n\n\"Charlie's Angels\"\n- Target: Mime gun upright, say \"Freeze\" sassily (7 sec).\n- Left side: Karate-chop pose.\n- Right side: Talking-into-radio pose.\n\n**Success Looks Like**\nThe circle stays alert; side players support without delay; mistakes produce quick swaps, not embarrassment; physical images are big and readable.\n\n**For Students**\n- You're always potentially active \u2014 stay ready even when you're not the target.\n- The side-player roles are as important as the targeted-player role.\n- Commit physically and vocally. Small, tentative responses break the energy.\n\n**For Teachers**\n- Add rules gradually \u2014 don't introduce all six calls at once.\n- The center player should vary targets and calls to keep the whole circle alert.\n- Watch for players who only track whether they're targeted and stop watching their neighbors \u2014 the adjacent obligations are the harder skill.",

      "fullMarkdown": "**Skills**\nrule tracking; directionality; blocking; recovery\n\n**Rules**\n- Players stand in a circle. One player is active at a time and uses a call to pass to someone else. Rules are added gradually.\n\n\"Zoom\" \u2014 Pass to any non-adjacent player. Cannot be used if you received a Zoom.\n\"Mafigliano\" \u2014 Pass to the player immediately to your left or right.\n\"Schwartz\" \u2014 Block an incoming pass. The passer must redirect. Schwartz does not make you active.\n\"Bork\" \u2014 Look left or right \u2014 pass goes one player past that neighbor (a skip).\n\"Twizzler\" \u2014 Look left or right \u2014 pass goes to the player behind you.\n\"Twizzler Bork\" \u2014 Look left or right \u2014 pass goes to the player on the far side of the player behind you.\n\"ZoomaZoomaZooma\" \u2014 Pass to a non-adjacent player, who must ZoomaZoomaZooma to another, who must do the same. Always a forced chain of three. A Schwartzed ZoomaZoomaZooma is not canceled; you must pick another target.\n\n**Success Looks Like**\nPasses are clear and fast; the circle tracks the active player; blocks are handled cleanly; later rules increase energy rather than collapsing the game.\n\n**For Students**\n- Stay engaged even when you're not active \u2014 Zoom and ZoomaZoomaZooma can arrive without warning.\n- Make eye contact, point decisively, speak loudly. Vague passes create confusion.\n- When you mess up, correct fast and keep going. Don't stop to explain.\n\n**For Teachers**\n- Start with Zoom and Mafigliano only. Add Schwartz next, then Bork and Twizzler, then ZoomaZoomaZooma last.\n- ZoomaZoomaZooma requires chain tracking \u2014 don't introduce it until the basic pass/block mechanics are solid.\n- The game works best when confusion is treated as part of the fun rather than a reason to stop.",

      "fullMarkdown": "**Skills**\nrhythm; rhyme; vocal commitment\n\n**Rules**\n- Players stand in a circle and slap their thighs to establish a beat.\n- The group sings the setup phrase twice: \"I like butts, um um um.\"\n- Players then take turns adding a rhyming \"I like butts that\u2026\" line to the same beat. Each line must rhyme with the previous player's ending.\n- Keep pace. Easy rhymes beat clever ones every time.\n- Example: \"I like butts that are big and hairy.\" / \"I like butts that are small and airy.\"\n\n**Success Looks Like**\nThe beat stays consistent; players commit and land their lines; near-rhymes delivered confidently are fine; nobody stops to judge.\n\n**For Students**\n- Listen for the final sound of the previous line \u2014 that's what you're rhyming with, not the whole sentence.\n- Simple and on-beat beats clever and late.\n- Near-rhymes are okay. Deliver them confidently and keep moving.\n\n**For Teachers**\n- Keep the thigh-slap beat audible \u2014 it's the lifeline for players who struggle with rhyming under pressure.\n- Don't let players pause to evaluate their own rhyme. Land it and move on.\n- If the group is struggling with rhyme in general, simpler drills before adding beat pressure will help more than repetition.",

      "fullMarkdown": "**Skills**\nanti-rhyme; rhythm; listening; surprise\n\n**Rules**\n- Players stand in a circle and take turns in order.\n- Player 1 delivers a two-line rap. The first line ends naturally; the second line is set up to rhyme \u2014 but they stop just before the final word.\n- The next player completes the line with a word that makes sense but does not rhyme.\n- That player then starts a new two-line rap for the next person. Repeat around the circle.\n- Example: \"I went to the store to buy some bread / I came home and ate a lettuce\u2026 leaf.\"\n\n**Success Looks Like**\nThe circle flows with minimal pauses; setups create clear rhyme expectations; anti-rhymes land as surprise without stopping the rhythm.\n\n**For Students**\n- Set up an obvious rhyme \u2014 the clearer the expectation, the better the break.\n- The anti-rhyme should still make grammatical sense; nonsense is fine, incoherence isn't.\n- Don't overthink the anti-rhyme. Quick and wrong beats slow and clever.\n\n**For Teachers**\n- Coach players to set up a clear, obvious rhyme \u2014 vague setups make the anti-rhyme land flat.\n- Keep the energy up; hesitation kills the rhythm more than a weak anti-rhyme does.\n- Watch for players who accidentally rhyme \u2014 celebrate it as a mistake and move on.",

      "fullMarkdown": "**Skills**\neye contact; timing; shared impulse\n\n**Rules**\n- Players stand in a circle. One player locks eyes with any other player.\n- The two players attempt to clap at exactly the same time.\n- The receiver then locks eyes with another player and passes the clap.\n- The clap may go to any player in the circle, including the one who just passed it.\n- The goal is a clean shared clap \u2014 connection matters more than speed.\n\n**Success Looks Like**\nClaps feel simultaneous and mutual \u2014 like two people arriving at the same moment together rather than one person signaling and the other reacting.\n\n**For Students**\n- Establish real eye contact before initiating \u2014 don't clap until you both know it's happening.\n- A clean slow clap is better than a rushed messy one.\n- Don't anticipate; wait for the shared moment to emerge.\n- Missed claps are useful feedback, not failures \u2014 recover and move on.\n\n**For Teachers**\n- Eye contact is the setup; the clap is the agreement \u2014 not the other way around.\n- This exercise reveals who is actually connecting versus who is performing the idea of connection.\n- Strong players make the receiving player feel seen and clear before initiating.\n- Watch for: players clapping before real contact is made, rushing the pass, or becoming self-conscious after a miss.\n\n---\n\n**Jesse's Framing (added 2026-08)**\nJesse has expanded her explanation of this warmup: it teaches \"awareness and non-verbal communication.\" The clap is only the visible artifact \u2014 what's actually being drilled is reading a partner's intent before anything is said.",

      "fullMarkdown": "**Skills**\nobservation; physical/vocal mimicry; exact transmission\n\n**Rules**\n- Players stand in a circle. One player turns to the next and offers a facial expression, movement, and sound.\n- The receiving player watches closely, then turns to the next player and repeats it as accurately as possible.\n- The offer passes around the circle, naturally evolving through honest repetition. Multiple passes may run simultaneously in larger groups.\n- Reflect the version you received \u2014 not the original, and not an improved version.\n\n**Success Looks Like**\nPlayers commit fully to face, body, and sound; the offer mutates gradually through honest copying rather than lazy simplification or random exaggeration.\n\n**For Students**\n- Copy the player who passed to you \u2014 not the one who started it.\n- Everything matters: face, head angle, posture, sound, rhythm. Most players only copy the obvious feature.\n- Commit even if it feels silly. Laughing or breaking is what flattens the offer.\n\n**For Teachers**\n- The exercise is about receiving and transmitting, not improving. Coach players to resist the urge to \"fix\" the offer back toward the original.\n- Watch for simplification \u2014 players often believe they're copying accurately when they've only captured the most obvious feature.\n- Strong execution preserves the full physical score: eye shape, mouth, head angle, shoulders, weight, rhythm, breath, pitch, volume.",

      "fullMarkdown": "**Skills**\nworking memory; pattern tracking; accuracy\n\n**Rules**\n- Players stand in a circle and count sequentially: 1 \u2192 2 \u2192 3 \u2192 4 \u2192 5 \u2192 4 \u2192 3 \u2192 2 \u2192 1, then repeat.\n- Each player says the next number in the sequence. The goal is speed, accuracy, and listening.\n- When a mistake is made, the group corrects it in place until the right number is supplied \u2014 other players may give visual cues to help.\n\n**Success Looks Like**\nThe circle keeps a steady pace, corrections are quick and supportive, and players track the descending half of the pattern as confidently as the ascending.\n\n**For Students**\n- The tricky part is the descending half \u2014 stay present after 5 and don't rush back to 1.\n- When you make a mistake, stay calm; the group will help you find the right number.\n- Pay attention for the substitutions. Stay present so you know your order when it arrives at you, and whether you need to make a substitution.\n\n**For Teachers**\n- Keep the emphasis on group rhythm and recovery \u2014 not embarrassment when someone stumbles.\n- Substitutions should be added one at a time and should include different body movements \u2014 for instance, one that involves your legs and one that involves your hands.\n- Watch for: players freezing after a mistake, helpers being too loud and disruptive, or the circle losing pace after the 5.\n\n---",

      "fullMarkdown": "**Skills**\none-word sentence construction; restraint; clean endings\n\n**Rules**\n- Players stand in a circle. Player 1 begins with \u201cD\u2019jever\u201d (short for \u201cDid you ever\u201d).\n- Player 2 adds a verb. Each following player adds one word at a time.\n- The sentence ends at its first reasonable completion point \u2014 the next player starts a new sentence with \u201cD\u2019jever.\u201d\n- Example: \u201cD\u2019jever\u201d \u2192 \u201ceat\u201d \u2192 \u201ca\u201d \u2192 \u201csandwich\u201d \u2192 \u201cwhile\u201d \u2192 \u201ccrying?\u201d\n\n**Success Looks Like**\nSentences complete cleanly at their first natural ending; players serve the sentence rather than forcing a clever turn; restarts are confident.\n\n**For Students**\n- Get specific. A specific word gives the next player something to build on; a vague one gives them nothing. \"Burritos\" beats \"food.\" \"Wept\" beats \"stuff.\" Specificity is a gift to the rest of the circle, not a chance to show off \u2014 and it still has to be one word that fits the sentence.\n- Listen for grammar and rhythm \u2014 your job is to serve the sentence, not surprise everyone.\n- End at the first reasonable completion; don\u2019t keep adding clauses to make it funnier.\n- Don\u2019t hesitate searching for a clever word \u2014 a simple word that fits is always right.\n\n**For Teachers**\n- Expect the jam to land on the verb. The second slot (the verb, right after \"D'jever\") is consistently the hardest for students \u2014 every word after it comes noticeably easier. If the circle keeps stalling, that's almost always where. Consider warming up the verb slot specifically before running full rounds.\n- Push for specificity over vagueness \u2014 \"food\" and \"stuff\" starve the next player; concrete nouns and verbs feed them.\n- Coach players to end at the first reasonable completion \u2014 this is the core discipline of the exercise.\n- A clear, simple question is better than a long, tortured one.\n- Watch for: sentences extended past their natural end, players trying to force a joke, or grammatically tangled constructions.",

      "fullMarkdown": "**Skills**\nassociation; convergence; eye contact; commitment\n\n**Rules**\n- Two players lock eyes and pump one hand in a karate-chop motion while counting down: \"3, 2, 1.\" On the count, each says a word simultaneously.\n- A new pair then locks eyes and tries to say the same word \u2014 connecting the two words the previous pair said.\n- If they match, success. If not, the next pair uses those two new words as their bridge. Continue until two players say the same word at the same time.\n- No repeating words that have already been said in the round.\n- Example: Pair 1 says \"dog\" / \"house\" \u2192 Pair 2 aims for something like \"kennel\" or \"yard\" \u2014 both words, not just one.\n\n**Success Looks Like**\nPlayers commit instantly and vocally; the group converges without debate; misses move quickly to the next pair rather than stalling.\n\n**For Students**\n- The goal is convergence, not originality \u2014 obvious is good.\n- Connect both previous words, not just the one you find more interesting.\n- Commit vocally and physically. Hesitation makes it harder for your partner to meet you.\n\n**For Teachers**\n- Passive players weaken this exercise \u2014 convergence requires choosing, not waiting for the obvious answer to appear.\n- Don't let players debate or explain a miss; move immediately to the next pair.\n- Eye contact is part of the exercise \u2014 it's about shared timing and mutual impulse, not just vocabulary.\n- Flying Pig plays this in rounds of three \u2014 the game continues until the group achieves three successful matches.",

      "fullMarkdown": "**Skills**\nfast association; confidence; supportive failure\n\n**Rules**\n- One player receives a prompt or category.\n- The player rapidly lists five examples.\n- The examples may be true, false, absurd, or only loosely connected.\n- Fast is more important than accurate.\n- After completing the list, that player creates a new prompt for the next player.\n- Players usually stand in a circle.\n- The next player is usually someone who has not gone yet.\n- In practice, players often pick someone across the circle, but the functional rule is to choose someone who has not gone.\n\n**Success Looks Like**\nFirst-instinct thinking; Confidence.\n\n**For Students**\n- Momentum matters more than truth.\n- The audience/group support should make the player feel like succeeding is inevitable.\n- The player should not apologize for weak answers.\n- The prompt-giver should not use the game to trap another player.\n\n**For Teachers**\n- The main failure mode is hesitation \u2014 coach players to keep moving even if the next answer is weak. Momentum matters more than quality.\n- Watch for players searching for the perfect answer or freezing near the end of the list. Redirect: any answer is better than a pause.\n- The audience/group support should make the player feel like succeeding is inevitable.",

      "fullMarkdown": "**Skills**\nname recall; group cohesion; physical offers\n\n**Rules**\nOne player states their name and performs a physical motion. The whole group repeats the name and mirrors the motion back. Continue around the circle until every player has introduced themselves. Optionally follow with a \"ripple\" pass: point to any player, the group names them and does their motion together.\n\n**Success Looks Like**\nEvery player's name can be recalled by the group without hesitation; motions are mirrored with commitment and warmth; the room feels connected and supportive rather than pressurized.\n\n**For Students**\n- Make the motion big enough to read and simple enough to repeat.\n- The goal is not dance skill; the goal is commitment and group memory.\n- The group should support imperfect recall rather than making mistakes feel costly.\n- The exercise works best when the room treats each motion as a gift.\n\n**For Teachers**\n- Watch for self-consciousness \u2014 it's the main blocker. Model commitment and normalize imperfection early.\n- Coach players whose actions are too small or too complex to repeat. The motion needs to be big enough to read and simple enough for the group to reproduce.\n- The goal is not dance skill; the goal is commitment and group memory.",

      "fullMarkdown": "**Skills**\nphysical listening; shared leadership; observation\n\n**Rules**\nTwo players face each other and begin moving simultaneously, creating the illusion that neither is leading. One player initiates subtly; leadership passes back and forth without announcement or visible handoff. The goal is seamless, undetectable shared movement \u2014 neither clearly leading, neither clearly following.\n\n**Success Looks Like**\nAn outside observer cannot identify who is leading; transitions between leaders are invisible; the pair moves as a single unit; the pace stays slow enough that true copying is possible.\n\n**For Students**\n- The illusion of no leader matters more than clever movement.\n- Move slowly enough that your partner can actually copy you.\n- Leadership should pass back and forth naturally, not through an announced handoff.\n\n\n**For Teachers**\n- One player obviously leads for too long.\n- The follower waits passively instead of contributing to shared motion.\n- Leadership changes are too abrupt.\n- The illusion of no leader matters more than clever movement.\n- Move slowly enough that your partner can actually copy you.",

      "fullMarkdown": "**Skills**\nyes-and; association; embodiment; group composition\n\n**Rules**\nPlayer 1 strikes a pose and announces what they are (\"I am a tree\"). Player 2 joins the image and names something related (\"I am a cat in the tree\"). Player 3 adds a third element connected to the existing image. Player 1 then says \"I'll take ___\" \u2014 choosing one of the two other players to stay. The two not chosen leave. The remaining player becomes the new anchor and names themselves again, and the cycle repeats.\n\n**Success Looks Like**\nEach new image has a clear spatial and conceptual relationship; players join the image quickly without over-thinking; the anchor player's choice creates surprising but logical new directions; energy stays high and physical.\n\n**For Students**\n- Modify the immediately previous object.\n- Join the game rather than staying safely outside the circle.\n- Embody the offer physically.\n- Abstract concepts are allowed and often praised when they are clear and playable.\n\n**For Teachers**\n- If players are modifying the wrong object, stop and restate the rule: always add to the immediately previous object, not an earlier one.\n- Coach players who stay too literal \u2014 the best associations are surprising but logical, not the first obvious thing.\n- Watch for weak physical choices. The offers need to be readable from across the room; push for size and commitment.\n- Encourage reluctant players to step in \u2014 staying safely outside the circle is its own failure mode.",

      "fullMarkdown": "**Skills**\nfast initiation; relationship; emotional readability; continuation\n\n**Rules**\nTwo players are given a relationship or starting point. They have one minute to establish and play a full scene with clear who/what/where and emotional stakes. The coach may call time, redirect, or reset mid-scene. The focus is speed of initiation \u2014 get to something playable as fast as possible.\n\n**Success Looks Like**\nWithin the first 15\u201320 seconds the relationship is clear and the emotion is readable; by the midpoint the scene has stakes; the players are reacting to each other rather than performing at the audience.\n\n**For Teachers**\n- Watch for scenes that take too long to establish relationship \u2014 coach players to land who they are to each other in the first exchange.\n- Push back on scenes built around setting or premise with no emotional stakes. Where are the feelings?\n- Coaching here closely resembles 3-Line Scene coaching. Common targets include emotional clarity, relationship specificity, and avoiding question-answer patterns.",

      "fullMarkdown": "**Skills**\nfast character; POV; vocal/physical commitment\n\n**Rules**\nOne player describes a character aloud to the group: name, a brief physical description, and an occupation or role. A designated player must immediately deliver exactly one line of dialogue as that character, revealing their point of view. No extended scene is played \u2014 just one strong, committed line. Then repeat with a new character description.\n\n**Success Looks Like**\nThe one line instantly communicates the character's voice, worldview, and personality; the combination of name, physicality, and role collapses into a single readable impulse; an observer could cast that character in a full scene based on that line alone.\n\n**For Students**\n- Player 4 should make one strong character offer, not perform a whole scene.\n- The line should reveal the character\u2019s point of view quickly.\n- The best offers combine the name, description, and role into one readable character impulse.\n- Physical and vocal commitment help the character read instantly.\n\n**For Teachers**\n- Player 4 turns the moment into a full scene instead of delivering one line.\n- Player 4 gives a generic line that does not reflect the name, description, or job.\n- The one-line character has no clear voice, body, or point of view.\n- Player 4 should make one strong character offer, not perform a whole scene.\n- The line should reveal the character\u2019s point of view quickly.",

      "fullMarkdown": "**Skills**\ngrammar; listening; shared story; momentum\n\n**Rules**\n- Players stand in a circle.\n- The teacher prompts the group with a starter phrase.\n- The most common starter is:\n  - \u201cOnce upon a time\u2026\u201d\n\n**Success Looks Like**\n- The story moves quickly.\n- Each word makes grammatical sense.\n- Players support the sentence rather than fighting for control.\n- Connector words appear when needed.\n- The story reaches a clear natural ending.\n- The teacher can call \u201cThe End\u201d cleanly because the group has landed the story together.\n\n**For Students**\n- Speed matters, but the word still needs to make sense.\n- The story does not need to be brilliant; it needs to keep moving.\n- Connector words are often the most important support words.\n- A simple word that preserves grammar is usually better than a clever word that breaks the sentence.\n\n**For Teachers**\n- The main failure mode is hesitation \u2014 coach players to say something, anything, without waiting for the perfect word.\n- Watch for players trying to control the story. The job is to follow, not to steer.\n- Coach players who skip necessary connector words (articles, prepositions). The sentence still needs to be grammatical.\n- Speed matters, but the word still needs to make sense.",

      "fullMarkdown": "**Also Known As**\nStory Spine (Kenn Adams' narrative template \u2014 \u201cOnce upon a time... Every day... Until one day... Because of that... Until finally... Ever since then...\u201d). Flying Pig runs the same beat structure under this name.\n\n**Skills**\ncausality; narrative structure; consequence\n\n**Rules**\n- Players stand in a circle.\n- The teacher leads the structure by supplying story prompts.\n- Players complete each prompt with one sentence.\n\n**Success Looks Like**\n- Each sentence follows clearly from the previous sentence.\n- The story develops through cause and effect.\n- Players do not contradict earlier information.\n- The repeated \u201cBecause of that\u2026\u201d beats build momentum rather than randomness.\n- The final \u201cever since then\u201d and moral feel earned by the story.\n\n**For Students**\n- \u201cBecause of that\u2026\u201d means the next sentence should be a consequence.\n- The player should ask: \u201cWhat happened because of the sentence immediately before mine?\u201d\n- The story does not need to be clever; it needs cause and effect.\n- Each sentence should preserve what came before.\n\n**For Teachers**\n- Breaking causality.\n- Responding to an earlier story beat instead of the immediately previous one.\n- Modifying a beat that was not directly previous to the player\u2019s turn.\n- \u201cBecause of that\u2026\u201d means the next sentence should be a consequence.\n- The player should ask: \u201cWhat happened because of the sentence immediately before mine?\u201d",

      "fullMarkdown": "**Skills**\nsentence completion; restraint; group timing\n\n**Rules**\n- Players stand in a circle.\n- The group builds a cowboy-style saying one word at a time.\n- No fixed starter phrase is used \u2014 the saying begins from the first player's word.\n- The saying begins from the first player\u2019s word.\n\n**Success Looks Like**\n- The sentence is grammatical.\n- The saying feels cowboy-flavored enough to fit the exercise.\n- The group recognizes the first natural ending.\n- \u201cYEE HAW\u201d lands cleanly.\n- The sentence does not get dragged past completion.\n\n**For Students**\n- Grammar matters.\n- The group should listen for when the sentence has become complete.\n- \u201cYEE HAW\u201d should be called at the first clean ending, not after the sentence has been overextended.\n- Like D\u2019Jever, the exercise trains players to recognize completion and stop.\n\n**For Teachers**\n- Coach players who break grammar \u2014 the sentence needs to be a real sentence, even if the content is absurd.\n- Watch for players who keep adding words after the sentence is already complete. Coach them to hear the natural ending and stop there.\n- The group should listen actively for when the sentence has closed \u2014 that's the skill being trained.",

      "fullMarkdown": "**Skills**\nobject permanence; silent specificity; environment\n\n**Rules**\n- The teacher gives the class a simple physical prompt.\n- Examples include:\n  - getting yourself a glass of water,\n  - looking through an old photo album,\n  - arriving home from work.\n- The entire class performs the action silently.\n- Students repeat the action sequence multiple times.\n- The teacher walks around the room and gives individual critiques.\n- The exercise focuses on precision, physical clarity, and consistency rather than dialogue or scene invention.\n\n**Success Looks Like**\nDevelop believable object work; Build physical specificity.\n\n**For Students**\n- Treat imaginary objects as physically real.\n- Decide where the object is and keep it there.\n- Maintain consistent size, weight, and distance.\n- Slow down enough for the audience to read the action.\n\n**For Teachers**\n- Watch for objects that change size, height, or location mid-exercise. Stop and reset: decide where the object is and keep it there.\n- Coach players who rush through actions without detail \u2014 slow down and find the physical reality of the object.\n- Push back on vague hand-waving. Specific physical interaction means knowing exactly where your hands are and what they're touching.",

      "fullMarkdown": "**Skills**\nalive silence; listening; emotional reaction; patience\n\n**Rules**\n- Two players perform a scene.\n- Players must leave at least five seconds between lines of dialogue.\n- During the silence, players should remain active through:\n  - eye contact,\n  - physical behavior,\n  - emotional reaction,\n  - object work,\n  - status shifts,\n  - listening,\n  - letting the previous line affect them.\n- The scene continues normally, but the pace of spoken dialogue is deliberately slowed.\n- The delay applies between lines, not merely between speeches.\n\n**Success Looks Like**\nSlow players down; Increase listening.\n\n**For Students**\n- The silence must stay alive.\n- The goal is not merely to count to five; the goal is to let the previous offer affect the character.\n- During the delay, players should do something playable:\n  - react emotionally,\n- This game trains what \"slow down\" actually means: not slower thinking, but non-verbal life between lines \u2014 space work, object work, physical reaction before speech.\n**For Teachers**\n- Watch for players who forget the delay and respond immediately \u2014 stop and reset the rule.\n- Coach players who become visibly anxious during the silence. The pause is part of the scene, not a gap to survive.\n- Push players to treat the silence as playable time, not dead air. Something is happening in that 5 seconds.\n- The silence must stay alive.",

      "fullMarkdown": "**Skills**\nstory compression; time pressure; ensemble coordination\n\n**Rules**\n- Host gets a fairy tale or well-known story from the audience. At least one player must know it. Players get a brief organizing period \u2014 keep it quick.\n- Players perform the same story repeatedly, each version compressed into a shorter time limit. The host times each round and calls time.\n- Each version should compress the established interpretation \u2014 not introduce new beats. The 1-second version is always the finale.\n- Time limits: 60 sec \u2192 30 sec \u2192 15 sec \u2192 7 sec \u2192 3.5 sec \u2192 1 sec\n\n**Success Looks Like**\nThe same recognizable story landmarks survive every compression; physical shorthand gets bigger as time shrinks; the 1-second finale lands as a button.\n\n**For Students**\n- Agree on the essential beats before you start \u2014 you'll be compressing those, not inventing new ones.\n- Physical storytelling becomes more important as words disappear. Make it big and readable.\n- The story under pressure should feel like the same story, just faster \u2014 not a different scene.\n\n**For Teachers**\n- Keep the planning period short \u2014 long prep kills the energy before the game begins.\n- The host should bring energy around each time cut and manage the audience while players organize between rounds.\n- Watch for players dropping the main arc in later rounds. The comedy comes from recognizable compression, not random chaos.",

      "introScript": "Our next game is a guessing game, so we need [Player 1] to step outside.\n\n[Player 1 leaves.]\n\n[In character as Boss, to coworkers:] Now that they're gone \u2014 may I please have a reason someone might be late for work? (audience get)\n\n[fake name] is late again. They told me it was (get) \u2014 but there's no way (get) would make you this late.\n\n[Coworker 1 \u2014 Player 2:] Yeah, you don't have the whole story. You see, after (get), they (add a new escalating reason).\n\n[Boss:] Wow. Is that all?\n\n[Coworker 2 \u2014 Player 3:] Not quite. After (Coworker 1's addition), they (add another escalating reason).\n\n[Boss:] Well, when they get in here, their story better match yours \u2014 or all of you are fired.\n\nBefore we bring them back \u2014 if [Player 1]'s guess is close, give them snaps (demonstrate). If they get it exactly right, give them a clap.\n\nLet's bring [Player 1] back in.\n\nThis is Why Were You Late.",
      "fullMarkdown": "**Skills**\nguessing; charades support; narrative matching; boss/host steering\n\n**Flying Pig Name**\nThis game is called *Excuses* at Flying Pig. It may appear elsewhere as *Why Were You Late?* or *Late for Work*.\n\n**Setup**\n- Three players: a Boss, two Co-workers, and one Late Person (the guesser).\n- The guesser leaves the room.\n\n**Rules**\n1. The Boss solicits a mundane get from the audience \u2014 something ordinary and unremarkable. Example: *\"Cat vomited on carpet.\"*\n2. The Boss tells the two Co-workers the mundane get, then \u2014 staying in character \u2014 solicits one outrageous excuse story from each Co-worker. These are big, specific, creative narratives. Examples:\n   - *\"A troll dropped through the sunroof, and he had to do battle with the troll, and kick him out of the moving car.\"*\n   - *\"A whole truckload of Barbies spilled on the interstate, and the co-worker was too much of a gentleman to run over a woman, so he ran over the one and only Ken doll instead, and the Ken doll stuck into his tire and gave him a flat.\"*\n3. The Boss frames the stakes: *\"That seems ridiculous. His story had better match yours, or you're all fired.\"*\n4. The Late Person returns and begins guessing \u2014 the Co-workers charade their stories while the Late Person works to reconstruct them.\n\n**Success Looks Like**\nThe Late Person narrates an increasingly specific version of the Co-workers' wild stories; the Boss steers without solving; the Co-workers' charades are physical and readable; the excuse story that emerges is recognizably close to what was set up.\n\n**For Students**\n- Co-workers: work as a team when charading \u2014 you are jointly responsible for conveying all of the excuse stories, not just your own.\n- The Late Person: guess actively. Start with category (person? place? action?) and narrow from there.\n- Boss: your job is to keep the scene alive and hint without giving it away.\n\n**For Teachers**\n- The Boss role is the most critical \u2014 they manage the guesser, Co-workers, and audience simultaneously.\n- The mundane get from the audience contrasts with the wild co-worker stories; that contrast is where the comedy lives.\n- Watch for Co-workers who give uncharadeable stories \u2014 coach toward visual, physical, breakable-into-parts narratives.\n\n---",

      "introScript": "Our next game is for all [number] players. [Player 1] and [Player 2] are going to start a scene, and any time they want, another player can shout freeze and take their place.\n\nTo get us started, may I please have [Letter Get x 2]? [Confirm letters.] [Player 1] and [Player 2], make those letters with your bodies.\n\nThis is Freeze Tag.",
      "fullMarkdown": "**Skills**\nphysical initiation; justification; edits\n\n**Rules**\n- The host asks the audience for two letters. The first two players make those letters with their bodies as a starting position.\n- Two players begin a scene. Offstage players watch for interesting physical positions.\n- An offstage player calls \"Freeze!\" \u2014 both onstage performers stop immediately.\n- Flying Pig version: two offstage players enter. Each tags the player they want to replace \u2014 the tag is what gives that player permission to leave. Both original performers exit.\n- Each new player takes the exact frozen position of the player they tagged, justifies it, and starts a completely new, unrelated scene. Repeat.\n\n**Success Looks Like**\nNew scenes start immediately and distinctly; frozen positions are honored and justified; physical choices are bold enough to inspire real premises.\n\n**For Students**\n- Call \"Freeze\" when the stage picture gives you an idea \u2014 not just to get onstage.\n- Take the position first; let it tell you the scene, relationship, or environment.\n- Create interesting physical pictures while you're onstage so others have something to work with.\n\n**For Teachers**\n- The game lives or dies on physicality. Talking-head scenes starve it.\n- Coach players to call \"Freeze\" with a plan, not out of impatience or obligation.\n- Watch for new players who ignore the frozen position \u2014 the physical picture is the whole point of the edit.",

      "introScript": "Our next game involves all [number] players.\n\nI'm going to point at a player and they're going to tell a story. When I switch who I'm pointing at, that player has to continue the story from exactly where the previous player left off.\n\nAnd if they don't continue it perfectly \u2014 you're going to yell die. Let's practice. Everyone say die!\n\n[Audience yells die.]\n\nTo get us started, may I please have (audience get \u2014 a creature or character).\n\n[Confirm get.]\n\nAnd may I please have (audience get \u2014 an emotion, name, or adjective; shape it so it will combine naturally with the first get into a title without telegraphing the link).\n\n[Confirm get.]\n\nThe (get two) (get one) \u2014 Chapter One.",
      "fullMarkdown": "**Skills**\ninstant continuation; narrative pressure; playful failure\n\n**Rules**\nStorytellers stand in a line. The director points to one \u2014 that player immediately continues a shared story.\n\nThe director points to another player at any moment; that player must continue from the exact word where the story was handed off.\n\nIf a player hesitates, stutters, or fails to continue instantly, the audience yells \"DIE!\" \u2014 the player gets a death suggestion from the audience, performs it, and becomes a corpse onstage.\n\nThe last remaining storyteller delivers the moral of the story. The audience votes whether they live or die.\n\n**Success Looks Like**\nThe story flows seamlessly across players; deaths are quick and funny; the director creates real pressure; the final moral feels like a button.\n\n**For Students**\nContinue immediately \u2014 don't repeat the previous player's last words to buy time.\n\nDon't plan ahead. Listen. Trust the first continuation that appears.\n\nThe story doesn't need to be brilliant; it needs to keep moving.\n\nAfter elimination, commit to your death and then stay still \u2014 don't steal focus as a corpse.\n\n**For Teachers**\nDirectors: point clearly and switch often enough to create pressure. Hunt kills as the field narrows.\n\nCommon failure: players repeat the previous player's final words as a stall \u2014 call it immediately.\n\nWatch for players who restart the word or sentence instead of continuing mid-syllable. Coach them to pick up exactly where the previous player left off.",

      "fullMarkdown": "**Skills**\nscene memory; context switching; relationship tracking\n\n**Rules**\n- Once each side has a suggestion, the game begins.\n- Only the side facing the audience is active.\n- The active pair performs the scene associated with that side.\n- At any time, the host may rotate the square.\n- Common rotation calls include:\n  - \u201cOne to the left.\u201d\n  - \u201cOne to the right.\u201d\n  - \u201cTwo to the left.\u201d\n  - \u201cTwo to the right.\u201d\n- When the square rotates, the newly front-facing side resumes its own scene.\n- Each side preserves its own relationship, premise, and emotional history.\n- Scenes often return after a time jump rather than resuming from the exact previous second.\n\n**Success Looks Like**\n- The audience can distinguish all four worlds.\n- Relationships remain clear when revisited.\n- Time jumps advance the relationship or situation.\n- Players immediately know which scene they are in after a rotation.\n- The host\u2019s rotations create momentum and contrast.\n- The game feels like four living scenes rather than four repeated premises.\n\n---\n\n**For Students**\n- Each side needs a distinct relationship and emotional engine.\n- When a scene returns, it should continue or advance, not reset.\n- Time jumps can help the scene evolve.\n- The audience should be able to immediately recognize which scene has returned.\n- Emotional stakes and relationship clarity matter more than the rotation mechanic.\n- Strong players re-enter the scene with confidence, as if no time has passed for the performers even if time has passed in the world.\n\n**For Teachers**\n- Watch for players who lose track of which relationship belongs to which side \u2014 stop and clarify before continuing.\n- Coach players who bleed information from one scene into another. Each side is its own world.\n- Watch for players who return to a scene and replay the same emotional beat. Each visit should escalate or reveal something new.\n- Push for scenes that are distinct from each other in tone, energy, and relationship.\n- Host rotations should be unpredictable enough to create surprise once the game is underway, but not so chaotic that scenes can't establish themselves early.",

      "fullMarkdown": "**Skills**\none-word group speaking; confidence; hosting; audience questions\n\n**Rules**\nThree players form a single expert. The host begins by asking the expert their name \u2014 the three answer one word at a time.\n\nThe host asks one or two warm-up questions to establish the rhythm, then opens the floor to audience questions.\n\nThe expert answers every question one word at a time, with total authority, regardless of whether the answer makes sense.\n\nExample audience question: \"People are talking about orbital data centers \u2014 but given they're limited to radiative heat, how do you recommend they mitigate excess thermal energy?\"\n\n**Success Looks Like**\nThe expert sounds like one confident mind; the audience enjoys watching authority applied to impossible questions; the host keeps the rhythm and picks strong questions.\n\n**For Students**\nConfidence matters more than correctness. Commit to the answer \u2014 the expert always knows.\n\nDon't try to be individually funny. Support the shared sentence. Listen for where it's going.\n\nTreat impossible questions as answerable. The gap between authority and nonsense is the comedy.\n\n**For Teachers**\nThe host's first questions establish permission \u2014 they show the audience what kind of questions make the game work.\n\nStrong audience questions are technical, specialized, philosophical, or otherwise unanswerable by any real person.\n\nCommon failure: experts lack confidence and the answer becomes slow and timid. Redirect to authority over accuracy.",

      "fullMarkdown": "**Skills**\nescalation; contrast; concise advice jokes\n\n**Rules**\n- Host gets a domain of knowledge from the audience (e.g., dating, medicine, parenting).\n- The host assigns the three roles \u2014 Good, Bad, Worse \u2014 by audience applause vote. The host asks a playful question for each role, and the audience votes by applause for which player fits best.\n  - Example for Good: \"By applause, who would you trust to cook a tasty soup?\"\n  - Example for Worse: \"By applause, who would look the cutest holding a puppy?\"\n- Players keep their fixed roles for the entire game.\n- The host asks a question in the domain. Good gives reasonable advice. Bad gives bad advice. Worse tops Bad with something more disastrous or absurd.\n- Repeat through multiple questions. Roles do not rotate. Host ends the game before the pattern wears out.\n\n**Success Looks Like**\nThe audience immediately hears the progression; Worse reliably tops Bad; answers are short and clear; the contrast between roles is obvious.\n\n**For Students**\n- Good establishes the baseline \u2014 play it straight so the contrast lands.\n- Bad should clearly violate good judgment. Worse should top Bad, not just repeat it.\n- Short answers work better. Don't explain the joke \u2014 land it and stop.\n\n**For Teachers**\n- The most common failure: Bad isn't bad enough, so Worse has nowhere to go. Coach players to commit to their tier.\n- The host's questions should make escalation easy \u2014 specific, situational prompts beat vague ones.\n- Watch for Good playing for jokes \u2014 it undermines the contrast the whole game depends on.",

      "introScript": "Our next game is a guessing game, which means [Player 1] has to leave the room.\n\n[Player 1 leaves.]\n\nAll right, now that they're gone, I need your help setting up the game.\n\nMay I please have (audience get \u2014 assign to Player 2).\n\nFor [Player 3], may I please have (audience get \u2014 assign to Player 3).\n\nAnd for [Player 4], may I please have (audience get \u2014 assign to Player 4).\n\nLet's bring our contestant back in.\n\nContestant, can I have your name please?\n\n[Player 1 gives a fake name.]\n\nWe have three lovely potential dates for you tonight.\n\nThis is the Dating Game.\n\n[Note: This is an audience-feedback guessing game. Before bringing the guesser back in, teach the audience: snaps for close, clap for exactly right.]",
      "fullMarkdown": "**Skills**\ncharacter hinting; guessing; host control\n\n**Rules**\nThe guesser leaves. The audience gives three different identity suggestions \u2014 each contestant gets one (identities vary by type: animal, profession, character trait, fear, historical figure, etc.).\n\nThe guesser returns and asks each contestant ~3\u20134 dating-show-style questions. Contestants answer in character, hinting without giving away the answer.\n\nGuessing happens at the end \u2014 one contestant at a time. If the guesser is close but not exact, the contestant or host gives a hint.\n\nSample identity set: \"Has not slept in three days\" \u00b7 \"Forest nymph\" \u00b7 \"Chemical engineer\"\n\nStrong questions: \"Where would you take me on our first date?\" \u00b7 \"What gift would you bring my parents?\" \u00b7 \"What would ruin our honeymoon?\"\n\n**Success Looks Like**\nEach contestant is distinct and playable; answers are funny while still functioning as hints; the final guesses feel earned; hints close gaps without dragging.\n\n**For Students**\nBe helpful but not obvious. Answer through worldview, metaphor, and emotional reaction \u2014 not just facts about your identity.\n\nDon't hide so much that the game stalls, but don't give it away in the first answer either.\n\nLet the identity shape everything: voice, posture, word choice, what you find romantic or scary.\n\n**For Teachers**\nChoose or shape identities so each contestant has a distinct clue path \u2014 three similar identities make the game flat.\n\nCommon failure: contestants treat the identity as trivia instead of a playable character. Redirect to behavior and worldview.\n\nThe final guessing should be supported, not punitive. Hints from contestants or the host keep the ending from dragging.",

      "fullMarkdown": "**Skills**\nguessing; supportive hinting; interview frame\n\n**Rules**\n- The guesser leaves the room. Host gets three hidden audience suggestions: a job, the place where it takes place, and an odd uniform.\n- Three players sit as interviewers who know the hidden answers. Guesser returns as the job applicant.\n- Interviewers ask questions that contain clues about the hidden components \u2014 staying in the interview frame throughout.\n- Guesser guesses out loud. Audience snaps = close; claps = correct component.\n- Example: Nap Coordinator \u00b7 Prison \u00b7 Space Suit.\n\n**Success Looks Like**\nThe guesser keeps guessing out loud; interviewers give clues across all three components; the interview frame stays intact; the final guesses feel earned.\n\n**For Students**\n- Guesser: keep talking. The single most common way this game dies is the applicant going quiet while they think. Silence gives the interviewers nothing to react to and strands the scene. Think out loud, guess wrong on purpose, ask the interviewers questions back \u2014 anything is better than a pause.\n- Interviewers: you are running an interview, not a hint desk. The most common failure is drifting into openly feeding clues and forgetting the scene entirely. If a line wouldn't plausibly be said in a real job interview, don't say it.\n- Guesser: stay in character as the applicant and keep guessing \u2014 wrong guesses narrow the search and help the audience root for you.\n- Interviewers: hide clues inside real-sounding interview questions. Job duties, uniform requirements, workplace hazards all work.\n- Spread clues across all three components \u2014 don't pile everything onto the job and leave the location a mystery.\n\n**For Teachers**\n- Two failure modes dominate, both observed in a recent Flying Pig class where this game was surprisingly hard for the room:\n  1. Interviewers abandon the interview frame and just start handing out hints. The scene evaporates and it becomes a bare puzzle.\n  2. The interviewee stops talking. Once the applicant goes silent the game has no engine \u2014 nothing for interviewers to hook onto and nothing for the audience to follow.\n- For failure 1: reset the frame out loud (\"you're still interviewing them\") rather than coaching clue quality.\n- For failure 2: coach the applicant to narrate their thinking. A wrong guess said out loud is always better than a correct guess thought silently.\n- Interviewers who give clues too subtle or too direct both kill the game \u2014 coach them to find the playable middle.\n- Host can rescue a stall by nudging the applicant to focus on one component at a time.\n- The scene frame is what makes this more than a puzzle \u2014 if it collapses into pure clue delivery, the game loses its shape.",

      "introScript": "Our next game is called Oh Waiter. It's for all [number] players.\n\nTo get us started, may I please have (audience get).\n\n[Confirm get.]\n\n[Game starts.]",
      "fullMarkdown": "**Skills**\npuns; fast stepping forward; concise jokes\n\n**Rules**\nOne player sits in a chair as the restaurant patron. The rest stand in a line.\n\nThe audience provides a suggestion. The seated player says: \"Oh Waiter! There is a [suggestion] in my soup.\"\n\nA player steps forward from the line and delivers a joke or pun based on the suggestion.\n\nThat player takes the seat; the previous patron returns to the line. Repeat.\n\nExample:\n- Patron: \"Oh Waiter! There is a piano in my soup.\"\n- Waiter steps forward: \"Sorry about that \u2014 it must have been a key ingredient.\"\n\n**Success Looks Like**\nPlayers step forward quickly without waiting for the perfect pun; the game keeps a fast, even rhythm; the audience rewards speed and commitment over cleverness.\n\n**For Students**\nA bad pun delivered with confidence beats a great pun delivered late. Step forward on \"good enough.\"\n\nDon't undercut yourself after the joke \u2014 deliver it and move.\n\nAssociation paths when you're stuck: sound-alike words, category, famous phrase, object function, literal visual image.\n\n**For Teachers**\nThe game breaks down when players hang back. Hesitation is the failure mode, not weak puns.\n\nIf a small number of players are carrying the game, name it and redistribute.\n\nStrong support players \u2014 ones who step forward to protect tempo \u2014 are the backbone of this game even if they're not the best pun-makers.",

      "fullMarkdown": "**Skills**\nphysical awareness; justification; ensemble adjustment\n\n**Rules**\nThree players perform a scene. At all times: one player must be sitting, one standing, one laying down.\n\nWhen any player changes position, the others must adjust immediately to restore the required distribution.\n\nPosition changes should be justified within the scene \u2014 not treated as arbitrary mechanics.\n\n**Success Looks Like**\nPosition changes feel motivated by the scene \u2014 emotion, status, environment \u2014 not just rule-keeping; the constraint increases energy rather than replacing scene work.\n\n**For Students**\nMake every position change a gift to the scene \u2014 collapse from grief, stand to assert status, lie down to surrender or hide.\n\nKeep positions visually clear for the audience. Ambiguous postures create confusion.\n\nDon't freeze to avoid disrupting the pattern. Moving is the game.\n\n**For Teachers**\nCommon failure: players watch the rule so tightly they stop listening emotionally and the scene goes flat.\n\nIf one player is driving all movement while others passively react, redirect ownership to the whole ensemble.\n\nPush players to use position changes to affect relationship and stakes \u2014 not just to comply with the rule.",

      "fullMarkdown": "**Skills**\njustification; audience line integration; scene continuity\n\n**Rules**\n- Two to three players perform a scene.\n- Before the game begins, audience members write lines of dialogue on slips of paper.\n- The slips are placed in a box, hat, bucket, or similar container.\n- During the scene, players periodically draw a line from the box.\n- The drawn line must be read aloud and incorporated into the scene.\n- Players should justify the line as if it naturally belongs in the scene.\n- The scene should still be a good scene, not just a sequence of random line readings.\n- Players continue until the scene is edited, reaches a button, or the host ends the game.\n\n**For Students**\n- The scene must matter before the line matters.\n- Players should build a clear who/what/where early so the random lines have something to disrupt.\n- Justify the line through:\n  - emotional reaction,\n  - relationship history,\n  - status,\n  - confession,\n  - misunderstanding,\n  - metaphor,\n  - memory,\n  - threat,\n  - secret,\n  - or sudden revelation.\n- Do not apologize for a strange line.\n- Read the line clearly, then immediately make it true.\n- The best use of a line often changes the relationship, not just the topic.\n- Players should not over-explain every line; a strong emotional commitment can justify more than logic.\n- Use the line as fuel, then return to scene work.\n\n**For Teachers**\n- Coach players who treat drawn lines as interruptions \u2014 the line is an offer to justify, not an obstacle to route around.\n- Watch for scenes that become only about the written lines. The scene should have its own life; the lines feed it.\n- Push players to draw lines at a reasonable pace \u2014 too infrequent and the mechanic disappears; too frequent and the scene can't develop.\n- Call out players who laugh at or comment on a line instead of justifying it. Commit and make it true.\n- Coach players to read lines with a clear emotional point of view \u2014 delivery matters as much as content.\n- Watch for players who force a literal interpretation when a looser emotional or metaphorical justification would work better.",
