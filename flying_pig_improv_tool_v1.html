      "fullMarkdown": "**Skills**\ngroup mind; active listening; presence; restraint\n\n**Setup**\nThe group stands in a circle, then all turn to face outward so no one can see anyone else.\n\n**Rules**\n- Players count upward together, one number per speaker, in no fixed order \u2014 any player may say any number.\n- If two players speak at the same time, the count resets to 1 and the group tries again.\n- There is no signal, no turn order, and no coordination other than listening.\n\n**Success Looks Like**\nThe group sustains a long count without collision. High counts require the ensemble to develop a shared sense of timing and an instinct for when to hold back versus step forward.\n\n**For Students**\n- Restraint is as important as initiative. Knowing when *not* to speak is the skill.\n- Don\u2019t try to \u201cplan\u201d when you\u2019ll speak \u2014 stay present and let the number arrive naturally.\n- A long count feels different from a short one. Notice what changes internally when the group is in sync.\n\n**For Teachers**\n- This exercise reveals individual tendencies clearly: some players count frequently, others rarely. Neither extreme is ideal \u2014 the goal is shared initiative.\n- It also tests willingness to protect the group. Players who hold back too much are leaving the work to others; players who jump in too fast are prioritizing themselves.\n- Multiple rounds in a session are normal. The group often improves significantly across rounds, and the jump from a low count to a breakthrough count (e.g., reaching 39) can be a meaningful shared experience.\n- No facilitation is needed during the exercise itself \u2014 debrief afterward if useful.\n\n---",

      "fullMarkdown": "**Skills**\naudience connection; suggestion interpretation; offer framing\n\n**The Flying Pig Wording**\nAt Flying Pig, a suggestion is always solicited with: **\"May I please have (a / something) ...\"**\n\nThis phrasing is a house convention. Variations like \"Can I have...\", \"Give me...\", or \"Tell me...\" are incorrect and will be corrected in class.\n\n**Good Examples**\n- \"May I please have something that fits into a box this big.\" *(mime the size)*\n- \"May I please have a word with multiple meanings.\"\n- \"May I please have a non-geographical location, like a bathroom or a studio.\"\n\n**Bad Examples**\n- \"Give me something small.\"\n- \"Can I have a word with multiple meanings.\"\n- \"Tell me a location that isn't geographical, like a bathroom or a studio.\"\n\n**Constraint and Creativity**\nHow specific you make the ask shapes what you get back.\n\n- A *constrained* ask (\"May I please have a job that starts with the letter P\") is more likely to produce common, predictable answers \u2014 Plumber, Painter, Pilot.\n- An *open* ask (\"May I please have a type of job\") is more likely to produce unexpected answers \u2014 Paleontologist, Puppeteer, Patent Attorney.\n\nUse constraint deliberately: if the game needs a mundane, workable suggestion, constrain more. If the game benefits from a surprising or unusual one, constrain less.\n\n**Interpreting the Get (A to C)**\nDon't use the suggestion literally. Take it from A to C.\n\nIf the suggestion is *Diamonds*, don't do a scene about diamonds. Instead, go to something the suggestion *invokes* \u2014 jewelry broadly, smuggling, mining, wealth, pressure, engagement, DeBeers marketing. The suggestion is a launching point, not a script note.\n\nThis is especially important in longform, where using the get too literally produces a narrow or on-the-nose scene. Shortform games may use the get more directly depending on format.\n\n*(A-to-C framing attributed to Sharla.)*\n\n**For Students**\n- Memorize the \"May I please have\" phrasing \u2014 it is a house convention, not a suggestion.\n- When asking for something specific, less constraint usually produces more interesting material.\n- When you receive the suggestion, your first instinct (A) is often what everyone else would think of. Go one step further (C).\n\n**For Teachers**\n- Correct \"Can I have\" and \"Give me\" immediately and consistently \u2014 the phrasing carries the relationship with the audience.\n- The A-to-C principle is especially worth reinforcing before longform sets, where lazy gets produce flat openers.\n\n---",

      "fullMarkdown": "**Skills**\naudience connection; host presence; show structure\n\n**Structure**\n\n**1. Thank the audience**\n> \"Thank you for coming to Flying Pig Improv.\"\n\n**2. Explain what improv is**\n> \"The show you see tonight will be completely unique \u2014 there will never be another one like it \u2014 because we do improv. That means we don't work with scripts; we make everything up on the spot. We do shortform games, which you might be familiar with from *Who's Line Is It Anyway?*, and we also do longform, which is basically unscripted theatre.\"\n\n**3. Safety**\n> \"The main door to the theatre is the one you came in. If for some reason that exit is blocked, there is a second exit from the back of the greenroom \u2014 but that door leads directly out onto Douglas, so be careful if you have to exit that way.\"\n\n**4. Train the audience**\n> \"We don't have microphones, so if you're having trouble hearing us, just hold up two fingers in a V and we will speak louder.\"\n\n> \"We're going to ask you to help us from time to time. To give you a sense of how that goes \u2014 can anyone tell me what they had for breakfast this morning?\"\n\n*(If a guessing game is in the show:)*\n> \"We also have a guessing game tonight. If the player guesses close, please snap your fingers. If they guess right, give them some claps.\"\n\n**5. Summon the troupe**\n> \"We are ready to go. The last thing we need to do is summon our troupe \u2014 and I need your help with that. On the count of three, please yell '[troupe name], get in here!' One. Two. Three.\"\n\n**6. Troupe introduction**\nTroupe enters and introduces themselves by first name, stage left to stage right.\n\n**7. Transition to first scene.**\n\n**For Hosts**\n- The audience training section is functional, not decorative \u2014 it establishes participation norms before the first game begins.\n- The breakfast question is a low-stakes warm-up that shows the audience what giving a suggestion feels like and confirms they're willing to participate.\n- The guessing game instructions are conditional \u2014 include them only if that format is in the show.\n- The troupe summon is a ritual moment; commit to it fully and hold the energy through the intro.\n- Keep the opener moving \u2014 it should feel welcoming but not stall before the first scene.\n\n---",

      "fullMarkdown": "**Skills**\naudience connection; host presence; show structure\n\n**Structure**\n\n**1. Thank the audience**\n> \"Thank you so much for coming to see us. If you enjoyed it, please leave us a review.\"\n\n**2. Invite to upcoming Flying Pig events**\n\n*Shows:*\n> \"We do a new show every Friday and Saturday night. Every show is unique, so come and see them.\"\n\n*Sketch Comedy:*\n> \"At the end of the month, we have a sketch comedy group that performs here after our show.\"\n\n*Classes:*\n> \"If this looks like something you'd like to try, we run classes.\"\n- Drop-in Shortform class: every Saturday at 11 AM\n- Silver Improv (55+): every Tuesday at 11 AM\n- Advanced class (short and longform): Thursday evenings\n\n**3. Troupe farewell**\nTroupe introduces themselves by first name, stage left to stage right, then exits.\n\n**For Hosts**\n- The review ask is brief but worth delivering clearly \u2014 it's one of the most valuable things an audience member can do for the theatre.\n- The class pitch is a genuine invitation, not just housekeeping. Deliver it like you mean it.\n- Class times are current as of documentation but may change \u2014 verify before each show.\n- The troupe introduction mirrors the opener; it bookends the show and gives the audience a final moment with each performer by name.\n\n---",

      "fullMarkdown": "**Context**\nThis is not a game or exercise \u2014 it is background on where improv comes from. Jesse references this history in class.\n\n**Jesse's Version (as told in class)**\n\"I'll bet you think these feel a bit like children's games. Well, actually they were initially invented by a woman named Viola Spolin, who created them to help neurodivergent children and ESL children communicate better. To this day her kids are running Spolin workshops.\"\n\n**The Historical Record**\nViola Spolin (1906\u20131994) was born in Chicago to Russian Jewish immigrants. In the late 1930s and early 1940s, she worked as a drama supervisor for the WPA's Recreational Project, developing games for use with immigrant and inner-city children in settlement houses. Her key insight: lectures about theater technique were useless with children or adults who had limited English, but when those techniques became the focus of a *game*, students could absorb them organically. She was influenced by Neva Boyd, whose work at Chicago's Group Work School explored using traditional game structures to break down cultural and ethnic barriers.\n\nHer games were designed to reach across divisions of culture and language \u2014 the \"ESL children\" framing Jesse uses is essentially accurate, though \"ESL\" is modern terminology for what Spolin was observing in the 1930s.\n\nThe \"neurodivergent children\" framing does not appear explicitly in the historical record, though the exercises were demonstrably useful in therapeutic contexts for children with learning differences. (See Troy's commentary.)\n\nIn 1955, Spolin taught her games to actors working with her son, **Paul Sills**, at the University of Chicago. Sills used them with the **Compass Players** \u2014 the first improvisational theater in America \u2014 whose cast included Mike Nichols, Elaine May, and Alan Alda. Sills went on to co-found **The Second City** in Chicago in 1959.\n\nIn 1963, Spolin published *Improvisation for the Theater*, which compiled her theater games. It remains the foundational text of the form.\n\n**\"Her kids are running Spolin workshops\"**\nJesse's reference to \"her kids\" points to Paul Sills (1927\u20132008), who was her son and the primary carrier of her work into the American improv tradition. Sills died in 2008. The Spolin estate and website (violaspolin.org) continue to maintain and promote her work and theater games.\n\n**Why It Matters**\nThe games used at Flying Pig \u2014 including warmups, exercises, and shortform formats \u2014 are part of a continuous lineage from Spolin's settlement house work. They were never designed primarily as entertainment; they were tools for human connection across barriers. That origin is still visible in how they function.\n\n---",

      "fullMarkdown": "**Also Known As**\nEmotional Squares\n\n**Skills**\nemotional range; physical embodiment; justification of emotional shifts; use of space; heightening; scene commitment\n\n**Rules**\n- Divide the playing area into 4 quadrants (tape, chairs, or an imagined cross \u2014 doesn't need to be visible to the audience).\n- Assign one emotion to each quadrant \u2014 preset (Mad/Sad/Glad/Afraid is the standard starter set) or pulled from the class/audience.\n- Players start a scene with a normal premise (real relationship, location, situation).\n- Whichever quadrant a player is standing in, they play that quadrant's emotion.\n- Players may move between quadrants at will; multiple players can share a quadrant.\n- The move into a new quadrant should be visible and full-bodied \u2014 no swapping emotions while standing still.\n- Every emotional shift needs an in-scene justification (a line, a discovery, a partner's reaction) \u2014 it can't just be \"I crossed a line so now I'm sad.\"\n- The scene still needs to hold together as a scene; the quadrant swaps serve it, they aren't the whole point.\n\n**Success Looks Like**\n- Emotions read from the back of the room in every quadrant, not just the biggest one.\n- You can tell a player crossed a line before they finish their next sentence \u2014 the body moves first.\n- Each shift has a reason attached, even a thin one, rather than reading as random.\n- Who/what/where survives the emotional swings.\n- Players actually use all four quadrants instead of camping in one or two.\n\n**For Students**\n- Treat the quadrant line like Jesse's \"plant\": move while the emotion is changing, then hold still once you've landed in the new one.\n- If you don't know the reason yet, invent it as you cross \u2014 the physical shift can lead and the justification can catch up a line later.\n- Physicalize before you talk. The audience should see it in your body first.\n- Force yourself to cross at least 3\u20134 times in a scene \u2014 standing in one quadrant the whole time defeats the game.\n\n**For Teachers**\n- Most common failure: voice and face change but the feet don't move and the hands stay still \u2014 flag this immediately.\n- Second most common failure: the swap has no justification and reads as arbitrary \u2014 coach players to plant a reason within a line or two, even retroactively.\n- Warm-up version: play music, everyone walks the room freely; freeze/stop-music cue means act out whichever quadrant you're standing in; rotate the four emotions every few rounds.\n- Once solid, swap emotions for other categories (professions, decades, weather) to generalize the same space-triggers-transformation skill beyond emotion work.\n- Untested at Flying Pig as of 2026-07-06 \u2014 run it and update confidenceReviewStatus/needsReview once observed.",

      "fullMarkdown": "**Skills**\nassociative listening; offstage attention; cold scene initiation; topic mining; ensemble handoff\n\n**Concept**\nBuilt on the habit of following links on Wikipedia \u2014 you open one article, something in it catches your eye, you click through, and twenty minutes later you're somewhere completely unrelated with no memory of how you got there. The show is that drift, staged.\n\n**Rules**\n- The first scene comes from an audience get.\n- Two or more players begin a scene as normal.\n- Any player who is off-stage may ring a bell at any time and say \"I'd like to hear more about ___,\" naming something the current scene evoked.\n- The trigger is associative, not literal. It does not have to be a word that was actually said \u2014 anything the scene brings to mind is fair. A scene about college that mentions kids being away might produce \"I'd like to hear more about empty nest syndrome.\"\n- The current scene ends. A new scene begins on the named topic.\n- The new scene is taken by whichever players have an inspiration for it \u2014 typically players who were not in the scene that just ended.\n- **The chain only goes forward.** Once you click through, the previous scene is gone. There is no back button and no return to an earlier thread.\n- The host time-boxes the piece and calls the end.\n\n**Success Looks Like**\nThe chain keeps moving and each new topic feels like a plausible click from the last \u2014 surprising but traceable. Scenes are abandoned while still enjoyable rather than played to exhaustion. Every player is visibly listening from off-stage. The audience can feel the drift accumulating: by the eighth click, the distance from the opening suggestion is the joke.\n\n**For Students**\n- Off-stage is an active role here. Your job while not in a scene is to listen for the click.\n- Ring early. The instinct is to let a good scene keep running, but a chain of eight brisk scenes beats three long ones.\n- Don't hunt for a clever tangent \u2014 the obvious association is usually the funniest, because the audience makes the same leap a half-second before you say it.\n- When you take a new scene, start it cold and specific. You get no setup from the previous scene; establish who and where fast.\n- Let your scene go when the bell rings. Being cut mid-momentum is the format working correctly, not a rejection.\n\n**For Teachers**\n- The main failure mode is chain stall \u2014 nobody rings, scenes run long, and the form collapses into a montage. Coach off-stage players to ring sooner than feels polite.\n- Second failure mode: overly clever or forced tangents that the audience can't trace. If the room can't see the link, the click didn't land.\n- Watch for players holding onto scenes they're enjoying. Willingness to be interrupted is the trainable skill.\n- Observed once at ~8 clicks in 15\u201320 minutes \u2014 useful as a rough target pace.",

      "fullMarkdown": "**Also Known As**\nStory String; Beads on a String. This is a standard, widely documented game \u2014 but Flying Pig runs a compressed 3-player variant with an added ear-plugging mechanic (see House Variant below).\n\n**Skills**\nnarrative bridging; causality; retroactive justification; story structure; listening\n\n**Rules (Flying Pig variant)**\n- Three players take the stage: one at stage left, one in the middle, one at stage right.\n- The stage-left player says the FIRST line of a story. Players 2 and 3 plug their ears and do not hear it.\n- The stage-right player says the LAST line of the story. Player 2 plugs their ears and does not hear it.\n- Now the sequence is played in order: player 1 gives the first line, player 2 invents a line from somewhere in the middle, player 3 gives the last line.\n- On each following pass, a player who has already spoken moves to a position on stage where no line has been said yet, and delivers a line appropriate to that gap in the story.\n- Players take turns doing this, each ending up with 2\u20133 lines, until every gap is filled and the story is complete.\n- There is no fixed line count \u2014 it runs until the group feels the story is resolved. One observed performance ran 7\u20138 lines total.\n\n**House Variant Note**\nThe ear-plugging is specific to Flying Pig. The standard published version simply instructs the second player to make their closing line unrelated to the opening; Flying Pig enforces it with actual hidden information. The standard version also uses 7\u20138 players contributing one line each rather than 3 players taking multiple turns.\n\n**Success Looks Like**\nThe first and last lines start absurdly far apart, and each added line makes the gap between them smaller and more plausible. By the end the story reads as if it were always intended. The middle lines do real work rather than stalling. Positions on stage clearly map to positions in the story, so the audience can follow the shape.\n\n**For Students**\n- Your line has to serve two masters: what comes before it and what comes after. Bridge, don't digress.\n- Resist filling the gaps left to right. Jumping to a distant empty position makes the game harder but the story better.\n- The bigger the gap you're bridging, the bolder the line should be. A timid line in a wide gap wastes the turn.\n- You are allowed to retroactively justify anything. A line that seemed nonsensical becomes the setup once someone bridges to it.\n\n**For Teachers**\n- The core discipline is non-linear filling. Watch for players quietly defaulting to left-to-right order \u2014 it drains the difficulty and the payoff.\n- Coach the middle player to go strange early. If line 3 lands close to either end, the bridge work collapses into a straight story.\n- Make sure the ear-plugging is honest. If the closing line is influenced by the opening, the whole premise of the game is gone.\n- Common failure: players treat their line as a joke rather than a load-bearing story beat. The laugh should come from the bridge, not the line alone.",

      "fullMarkdown": "**Skills**\nrhythm; partner attunement; simultaneous choice; physical commitment; letting go of strategy\n\n**Name**\n\"Ksss\" is a sound rather than a word \u2014 roughly the hiss of a cymbal on a drum kit.\n\n**The Four Positions**\n1. Upper arms straight out from the torso, elbows pivoted 90\u00b0, forearms pointing straight DOWN.\n2. Upper arms straight out from the torso, elbows pivoted 90\u00b0, forearms pointing straight UP.\n3. Left arm straight out to the left; right arm across the body so the right hand reaches as far LEFT as possible.\n4. Right arm straight out to the right; left arm across the body so the left hand reaches as far RIGHT as possible.\n\n(Positions 3 and 4 both point the whole body's line one direction \u2014 they are mirror images of each other, which is what makes accidental matching feel dramatic.)\n\n**Rules**\n- Players pair up. Many pairs play at the same time, independently.\n- Partners establish a beat together by tapping their thighs.\n- On the beat, each player independently hits one of the four positions \u2014 chosen freely, not signalled.\n- If the two players chose different positions: back to tapping thighs, then another free choice. Repeat.\n- If the two players chose the SAME position: instead of the next position, they give each other a high ten and make the sound \"Ksss.\"\n- Play then continues \u2014 back to the beat and free choices. A match does not end the game.\n- The host periodically calls a rotation to new partners.\n\n**Success Looks Like**\nThe room finds a collective rhythm even though every pair is independent. Matches produce genuine delight rather than polite acknowledgment. Players commit fully to each position instead of half-raising their arms while they decide. Nobody is visibly trying to read or steer their partner.\n\n**For Students**\n- Choose freely and commit. The game dies if you hedge, watching your partner to try to match on purpose.\n- Matches are luck, not skill \u2014 that's the point. You cannot get good at causing them.\n- Full extension on the positions. Half-hearted arms make matches ambiguous and kill the payoff.\n- Stay on the beat. Losing the rhythm to think is the most common way a pair falls apart.\n\n**For Teachers**\n- Budget real time for explanation \u2014 this is much easier to demonstrate than to describe. Observed at roughly 2 minutes of explanation for 5 minutes of play.\n- Demonstrate the four positions physically with a partner before starting; verbal description alone reliably confuses a room.\n- Watch for players peeking and steering toward a match. Coach genuine simultaneity.\n- Rotate partners a few times \u2014 the game refreshes with a new rhythm partner.\n- Closest relative among Flying Pig activities is Mirroring, but the skill is inverted: Mirroring trains deliberate synchrony, Ksss trains committing to an independent choice and enjoying accidental synchrony.",

      "fullMarkdown": "**Context**\nThis is not a game or exercise \u2014 it is a definition. \"Gift\" is used throughout this catalog (3-Line Scenes opens with one; Gets Emotional lists \"accepting gifts\" as a core skill; Pass the Muppet, Sit/Stand/Lay, Slideshow, Name Game and The Dating Game all lean on the idea) and Flying Pig uses it constantly in class without formally defining it.\n\n**Jesse's Definition**\nA gift is an inspiration for a scene. Jesse explicitly encouraged students NOT to take the word literally.\n\n**What That Rules Out**\nThe common beginner misreading is to hear \"gift\" as a physical object being handed over \u2014 and then to mime handing your partner a present at the top of a scene. That is not what the term means. A gift is anything you hand your partner to work with: an emotion, a relationship, a status, an accusation, a piece of history, a name, a want. It is material, not merchandise.\n\n**Why It Matters**\nMost of the exercises in this catalog that fail, fail because a player gave their partner nothing to act on. Framing offers as gifts puts the emphasis where it belongs: on what your partner can now do because of what you said. A strong gift makes the other player's next choice easier. A weak one leaves them to invent everything themselves.\n\n---",

// DATA
// ═══════════════════════════════════════════
const ACTIVITIES = DATASET.activities;
const CATEGORY_ORDER = [
    'Rituals',
    'Warmups',
    'Exercises',
    'Short Form',
    'Long Form',
    'Closers'
];
const DIFF_SORT = ['Low','Mid-Low','Mid','Mid-High','High'];
function catRank(a) {
    const r = CATEGORY_ORDER.indexOf(a.category);
    return r === -1 ? 999 : r;
}
function diffRank(a) {
    const r = DIFF_SORT.indexOf(a.metadata.difficulty);
    return r === -1 ? 999 : r;
}

function getById(id) { return ACTIVITIES.find(a => a.id === id); }

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// STATE
// ═══════════════════════════════════════════
const state = {
    tab: 'browse',
    lineup: null,
    expandedId: null,
    search: '',
    filterCategory: '',
    filterSuitability: '',
    filterDifficulty: '',
};

// ═══════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════
function showTab(tab) {
    state.tab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
}

// ═══════════════════════════════════════════
// BROWSE
// ═══════════════════════════════════════════
const DIFF_GROUPS = {
    low: ['Low','Mid-Low'],
    medium: ['Mid'],
    high: ['Mid-High','High'],
};

function filterActivities() {
    state.search = document.getElementById('search').value.toLowerCase();
    state.filterCategory = document.getElementById('filter-category').value;
    state.filterSuitability = document.getElementById('filter-suitability').value;
    state.filterDifficulty = document.getElementById('filter-difficulty').value;
    renderActivityList();
}

function getFiltered() {
    return ACTIVITIES.filter(a => {
        const m = a.metadata;
        if (state.search) {
            const hay = [a.name, a.category, (a.coreSkills||[]).join(' '), (a.tags||[]).join(' '), a.formatRole||''].join(' ').toLowerCase();
            if (!hay.includes(state.search)) return false;
        }
        if (state.filterCategory && a.category !== state.filterCategory) return false;
        if (state.filterSuitability) {
            if (state.filterSuitability === 'beginner' && !['Early','Mid','Late','Capstone','Closer'].includes(m.beginnerClassSuitability||'')) return false;
            if (state.filterSuitability === 'advanced' && !['Warmup','Exercise','Shortform','Longform','Closer'].includes(m.advancedClassSuitability||'')) return false;
            if (state.filterSuitability === 'show' && !['Strong','Yes'].some(v => (m.showSuitability||'').includes(v))) return false;
        }
        if (state.filterDifficulty) {
            const grp = DIFF_GROUPS[state.filterDifficulty] || [];
            if (!grp.includes(m.difficulty||'')) return false;
        }
        return true;
    }).sort((a,b) => {
        const rd = catRank(a) - catRank(b);
        if (rd !== 0) return rd;
        const dd = diffRank(a) - diffRank(b);
        return dd !== 0 ? dd : a.name.localeCompare(b.name);
    });
}

function renderActivityList() {
    const acts = getFiltered();
    const container = document.getElementById('activity-list');
    document.getElementById('result-count').textContent = acts.length + ' of ' + ACTIVITIES.length + ' activities';
    if (!acts.length) {
        container.innerHTML = '<p class="no-results">No activities match your filters.</p>';
        return;
    }
    container.innerHTML = acts.map(renderCard).join('');
}

function normDiff(d) {
    if (d === 'Low') return 'low';
    if (d === 'Mid-Low') return 'mid-low';
    if (d === 'Mid-High') return 'mid-high';
    if (d === 'High') return 'high';
    return 'medium';
}

function renderCard(a) {
    const m = a.metadata;
    const isExp = state.expandedId === a.id;
    const badges = [];
    const BEG_VALID = ['Warmup','Early','Mid','Late','Capstone','Closer'];
    const ADV_VALID = ['Warmup','Exercise','Shortform','Longform','Closer'];
    const bsuit = m.beginnerClassSuitability||'';
    if (BEG_VALID.includes(bsuit))
        badges.push(`<span class="badge badge-beginner">Beg: ${bsuit}</span>`);
    const asuit = m.advancedClassSuitability||'';
    if (ADV_VALID.includes(asuit))
        badges.push(`<span class="badge badge-advanced">Adv: ${asuit}</span>`);
    if (['Strong','Yes'].some(v => (m.showSuitability||'').includes(v)))
        badges.push('<span class="badge badge-show">Show</span>');

    const inner = isExp ? `
    <div class="activity-full">
        <div class="activity-meta-grid">
            <div><strong>Format Role:</strong> ${a.formatRole||'—'}</div>
            <div><strong>Difficulty:</strong> ${m.difficulty||'—'}</div>
            <div><strong>Energy:</strong> ${m.energyLevel||'—'}</div>
            <div><strong>Players:</strong> ${m.playerCount||'—'}</div>
            <div><strong>Runtime:</strong> ${m.estimatedRuntime||'—'}</div>
            ${['No','No / Optional','No documented prop requirement'].includes(m.requiresProps||'') ? '' : `<div><strong>Props:</strong> ${m.requiresProps}</div>`}
        </div>
        ${a.coreSkills && a.coreSkills.length ? '<p class="meta-skills"><strong>Core Skills:</strong> ' + a.coreSkills.join('; ') + '</p>' : ''}
        ${m.bestUse ? '<p class="meta-use"><strong>Best Use:</strong> ' + m.bestUse + '</p>' : ''}
        ${m.avoidWhen && !m.avoidWhen.startsWith('Needs Review only') ? '<p class="meta-avoid"><strong>Avoid When:</strong> ' + m.avoidWhen + '</p>' : ''}
        ${a.introScript ? `<div class="intro-script-block"><div class="intro-script-label">Intro Script</div><div class="intro-script-text">${a.introScript.replace(/\n/g,'<br>')}</div></div>` : ''}
        <div class="full-markdown">${renderMD(a.fullMarkdown)}</div>
    </div>` : '';

    return `<div class="activity-card${isExp?' expanded':''}" id="card-${a.id}">
        <div class="activity-header" onclick="toggleCard('${a.id}')">
            <div class="activity-name-row">
                <span class="activity-name">${a.name}</span>
                <span class="expand-icon">${isExp?'▲':'▼'}</span>
            </div>
            <div class="activity-meta-row">
                <span class="activity-category">${a.category}</span>
                <span class="activity-difficulty diff-${normDiff(m.difficulty)}">${m.difficulty||''}</span>
                <span style="display:inline-flex;gap:4px;align-items:center;">${badges.join('')}</span>
            </div>
            ${!isExp && a.shortDescription ? `<div class="activity-short-desc">${a.shortDescription}</div>` : ''}
        </div>${inner}</div>`;
}

function toggleCard(id) {
    state.expandedId = state.expandedId === id ? null : id;
    renderActivityList();
    if (state.expandedId) {
        setTimeout(() => {
            const el = document.getElementById('card-' + id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
    }
}

function renderMD(text) {
    if (!text) return '';
    let html = text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,'<em>$1</em>');
    const lines = html.split('\n');
    const out = [];
    let inUL = false;
    for (const line of lines) {
        if (/^### /.test(line)) {
            if (inUL) { out.push('</ul>'); inUL = false; }
            out.push('<h3>' + line.slice(4) + '</h3>');
        } else if (/^## /.test(line)) {
            if (inUL) { out.push('</ul>'); inUL = false; }
            out.push('<h2>' + line.slice(3) + '</h2>');
        } else if (/^# /.test(line)) {
            if (inUL) { out.push('</ul>'); inUL = false; }
            out.push('<h1>' + line.slice(2) + '</h1>');
        } else if (/^- /.test(line)) {
            if (!inUL) { out.push('<ul>'); inUL = true; }
            out.push('<li>' + line.slice(2) + '</li>');
        } else if (/^---$/.test(line.trim())) {
            if (inUL) { out.push('</ul>'); inUL = false; }
            out.push('<hr>');
        } else if (line.trim() === '') {
            if (inUL) { out.push('</ul>'); inUL = false; }
        } else {
            if (inUL) { out.push('</ul>'); inUL = false; }
            out.push('<p>' + line + '</p>');
        }
    }
    if (inUL) out.push('</ul>');
    return out.join('\n');
}

// ═══════════════════════════════════════════
// RECOMMENDATION ENGINE
// ═══════════════════════════════════════════
const DIFF_ORDER = {
    'Low':1,'Mid-Low':2,'Mid':3,'Mid-High':4,'High':5
};

const BEGINNER_EXCLUDE = new Set([
    'jesses-opening-meditation','zip-zap-zop',
    '3-line-scenes','i-am-a-tree','five-things','name-game',
    'one-minute-scenes','5-second-delay'
]);

const ADVANCED_LF = ['montage','town-hall','repeater','la-ronde','french-braid','slacker','two-chairs','scramble'];
const SHOW_GG    = RULES.globalActivityOverrides.guessingGames;
const SHOW_LF    = ['montage','town-hall','french-braid','slacker','repeater','two-chairs','scramble'];
const SHOW_FG    = ['oh-waiter','worlds-worst']; // legacy ref — use SHOW_FILLER in genShow

function mkSlot(activity, slotType, locked, reasonTags, extra) {
    return Object.assign({ activity, slotType, locked, reasonTags }, extra||{});
}

// Hard exclusions from the rules file. Previously the beginner generator read only
// metadata.beginnerClassSuitability and never consulted this list, so documented
// exclusions (e.g. One Minute Scenes) were silently unenforced. Belt-and-braces now:
// the metadata is correct AND this list is honored.
const BEG_EXCLUDE = new Set(
    (RULES.globalActivityOverrides && RULES.globalActivityOverrides.beginnerAlwaysExclude) || []
);

function isBeginnerElig(a) {
    if (BEG_EXCLUDE.has(a.id)) return false;
    const s = a.metadata.beginnerClassSuitability||'';
    return ['Early','Mid','Late','Capstone','Closer'].includes(s);
}
function isAdvancedElig(a) {
    const s = a.metadata.advancedClassSuitability||'';
    return ['Warmup','Exercise','Shortform','Longform','Closer'].includes(s);
}
function isShowElig(a) {
    const s = a.metadata.showSuitability||'';
    return s === 'Strong' || s === 'Yes';
}
function isHard(d) { return d==='Hard'||d==='High'||d==='Moderate to Hard'; }

function autoTags(a, mode) {
    const m = a.metadata;
    const tags = [];
    const suit = mode==='beginner' ? m.beginnerClassSuitability :
                 mode==='advanced' ? m.advancedClassSuitability : m.showSuitability;
    if ((suit||'').includes('Strong')) tags.push(mode + ' · strong');
    else tags.push(mode + '-eligible');
    if (a.formatRole) tags.push(a.formatRole.toLowerCase().replace(' / ','/'));
    (a.coreSkills||[]).slice(0,2).forEach(s=>tags.push(s));
    if ((m.difficulty||'').toLowerCase().includes('low')||(m.difficulty||'').toLowerCase().includes('easy')) tags.push('no props');
    return tags.slice(0,5);
}

// ── BEGINNER ──────────────────────────────
function genBeginner() {
    const slots = [];
    const used = new Set();

    // Fixed openers
    slots.push(mkSlot(getById('jesses-opening-meditation'),'opening',true,
        ['fixed class opening','Flying Pig ritual','presence','risk readiness']));
    slots.push(mkSlot(getById('zip-zap-zop'),'warmup',true,
        ['fixed class warmup','circle game','focus','eye contact']));
    used.add('jesses-opening-meditation'); used.add('zip-zap-zop');

    // Pick N activities from a given tier, randomized
    function pickTier(tier, count) {
        const pool = ACTIVITIES.filter(a =>
            !used.has(a.id) && !BEG_EXCLUDE.has(a.id) &&
            (a.metadata.beginnerClassSuitability||'') === tier
        );
        shuffle(pool);
        return pool.slice(0, count);
    }

    // Typical class: ~2 per tier, range 1-3, cap total at 6
    let earlyCount = 1 + Math.floor(Math.random()*3);
    let midCount   = 1 + Math.floor(Math.random()*3);
    let lateCount  = 1 + Math.floor(Math.random()*3);
    // Cap at 6: reduce Late first, then Mid — never below 1
    const over = earlyCount + midCount + lateCount - 6;
    if (over > 0) {
        lateCount  = Math.max(1, lateCount  - over);
        const over2 = earlyCount + midCount + lateCount - 6;
        if (over2 > 0) midCount = Math.max(1, midCount - over2);
    }
    // Floor at 6: pad Late up to 3, then pad Mid with any remainder
    const under = 6 - (earlyCount + midCount + lateCount);
    if (under > 0) {
        const latePad = Math.min(under, 3 - lateCount);
        lateCount += latePad;
        const midPad = under - latePad;
        if (midPad > 0) midCount += midPad;
    }

    pickTier('Early', earlyCount).forEach(a => {
        slots.push(mkSlot(a,'early',false,autoTags(a,'beginner')));
        used.add(a.id);
    });
    pickTier('Mid', midCount).forEach(a => {
        slots.push(mkSlot(a,'mid',false,autoTags(a,'beginner')));
        used.add(a.id);
    });
    pickTier('Late', lateCount).forEach(a => {
        slots.push(mkSlot(a,'late',false,autoTags(a,'beginner')));
        used.add(a.id);
    });

    // Capstone: 3-Line Scenes or I Am a Tree
    const capPool = ACTIVITIES.filter(a => (a.metadata.beginnerClassSuitability||'')==='Capstone');
    shuffle(capPool);
    if (capPool[0]) {
        slots.push(mkSlot(capPool[0],'capstone',false,['capstone exercise','scene work','beginner: capstone']));
        used.add(capPool[0].id);
    }

    // Closer: Five Things or Name Game
    const closerPool = ACTIVITIES.filter(a => (a.metadata.beginnerClassSuitability||'')==='Closer');
    shuffle(closerPool);
    if (closerPool[0]) {
        slots.push(mkSlot(closerPool[0],'closer',false,['class closer','high energy','group support']));
    }

    return {mode:'beginner',label:'Beginner Class',duration:'~90 min',slots};
}

// ── ADVANCED ──────────────────────────────
function genAdvanced() {
    const slots = [];
    const used = new Set();
    const ADV_SKIP = new Set(['jesses-opening-meditation','zip-zap-zop','five-things','name-game']);

    slots.push(mkSlot(getById('jesses-opening-meditation'),'opening',true,
        ['fixed class opening','Flying Pig ritual','presence','risk readiness']));
    slots.push(mkSlot(getById('zip-zap-zop'),'warmup',true,
        ['fixed warmup','variant-ready','focus','speed']));
    used.add('jesses-opening-meditation'); used.add('zip-zap-zop');

    function pickAdv(tier, count) {
        const pool = ACTIVITIES.filter(a =>
            !used.has(a.id) && !ADV_SKIP.has(a.id) &&
            (a.metadata.advancedClassSuitability||'') === tier
        );
        shuffle(pool);
        return pool.slice(0, count);
    }

    // Warmup: 1-2 additional exercises after Zip Zap Zop
    pickAdv('Warmup', 1+Math.floor(Math.random()*2)).forEach(a => {
        slots.push(mkSlot(a,'warmup',false,autoTags(a,'advanced'))); used.add(a.id);
    });

    // Skills + Shortform: max 6 combined; Skills 1-3, Shortform 2-4
    const skillsCount = 1 + Math.floor(Math.random()*3);   // 1-3
    const shortformMax = Math.min(2 + Math.floor(Math.random()*3), 6 - skillsCount); // 2-4, cap at 6 total
    pickAdv('Exercise', skillsCount).forEach(a => {
        slots.push(mkSlot(a,'skills',false,autoTags(a,'advanced'))); used.add(a.id);
    });
    pickAdv('Shortform', shortformMax).forEach(a => {
        slots.push(mkSlot(a,'shortform',false,autoTags(a,'advanced'))); used.add(a.id);
    });

    // Longform: 1 required long-form structure
    const lfOpts = ADVANCED_LF.filter(id=>!used.has(id));
    shuffle(lfOpts);
    if (lfOpts[0]) {
        slots.push(mkSlot(getById(lfOpts[0]),'longform',false,
            ['required long-form','ensemble tracking','late-show structure']));
    }

    slots.push(mkSlot(getById('five-things'),'closer',true,
        ['required closer','high energy','group support']));

    return {mode:'advanced',label:'Advanced Class',duration:'~2.5 hours',slots};
}

// ── SHOW ──────────────────────────────────
const SHOW_FILLER = ['oh-waiter','worlds-worst'];

function genShow() {
    const slots = [];
    const used = new Set();

    // Pick longform — determines whether Town Hall opens
    const lfOpts = [...SHOW_LF]; shuffle(lfOpts);
    const lfId = lfOpts[0]; used.add(lfId);
    const lfAct = getById(lfId);
    const townHallOpens = lfId === 'town-hall';

    // Town Hall goes before Formal Opening
    if (townHallOpens) {
        slots.push(mkSlot(lfAct,'longform',false,
            ['opens show','town hall','long-form','ensemble']));
    }

    // Formal Opening (always fixed)
    slots.push(mkSlot(null,'formal-opening',true,
        ['formal opening','host framing'],
        {displayName:'Formal Opening / Host Framing',
         displayDesc:'Host introduces troupe, frames the show, gets audience suggestion(s).'}));

    // Build shortform pool (excludes guessing games, longforms, filler)
    const COMPLEX_FIRST = new Set(['lines-from-a-box','pillars','spelling-bee','home-shopping-network-hsn']);
    const sfPool = ACTIVITIES.filter(a => {
        if (used.has(a.id)) return false;
        if (!isShowElig(a)) return false;
        if (SHOW_GG.includes(a.id) || SHOW_LF.includes(a.id) || SHOW_FILLER.includes(a.id)) return false;
        return a.category === 'Short Form';
    });
    shuffle(sfPool);

    // Pick opener — avoid complex-setup games first; sfPool already shuffled
    const opCands = sfPool.filter(a => !COMPLEX_FIRST.has(a.id));
    const opener = opCands[0] || sfPool[0];
    if (opener) { slots.push(mkSlot(opener,'shortform',false,autoTags(opener,'show'))); used.add(opener.id); }

    // 1-2 more shortform games before guessing
    const beforeGG = sfPool.filter(a => !used.has(a.id)).slice(0, 1+Math.floor(Math.random()*2));
    beforeGG.forEach(a => { slots.push(mkSlot(a,'shortform',false,autoTags(a,'show'))); used.add(a.id); });

    // Guessing game (required)
    const ggOpts = SHOW_GG.filter(id => !used.has(id)); shuffle(ggOpts);
    if (ggOpts[0]) {
        const ggAct = getById(ggOpts[0]); used.add(ggOpts[0]);
        slots.push(mkSlot(ggAct,'guessing',false,['required guessing game','audience-readable','host structure']));
    }

    // 1-2 shortform games after guessing (only in non-Town Hall shows)
    if (!townHallOpens) {
        const afterGG = sfPool.filter(a => !used.has(a.id)).slice(0, 1+Math.floor(Math.random()*2));
        afterGG.forEach(a => { slots.push(mkSlot(a,'shortform',false,autoTags(a,'show'))); used.add(a.id); });

        // Longform (last game)
        slots.push(mkSlot(lfAct,'longform',false,['required long-form','last game','ensemble tracking']));
    }

    // Filler (always planned; cut on the night if running long)
    const fillerOpts = SHOW_FILLER.filter(id => !used.has(id)); shuffle(fillerOpts);
    if (fillerOpts[0]) {
        slots.push(mkSlot(getById(fillerOpts[0]),'filler',false,
            ['filler','cut if running long'],
            {optional:true}));
    }

    // Conducted Song (~1 in 4 shows)
    if (Math.random() < 0.25) {
        const cs = getById('conducted-song-show-closing-conducted-song');
        if (cs) slots.push(mkSlot(cs,'conducted-song',false,
            ['optional closer','~1 in 4 shows'],
            {optional:true}));
    }

    // Formal Closing (always fixed)
    slots.push(mkSlot(null,'formal-closing',true,
        ['formal closing','announcements'],
        {displayName:'Formal Closing / Announcements',
         displayDesc:'Host thanks the audience, announces upcoming shows and classes.'}));

    return {mode:'show',label:'Show',duration:'~75 min',slots};
}

// ═══════════════════════════════════════════
// REGENERATE SLOT
// ═══════════════════════════════════════════
function regenSlot(idx) {
    if (!state.lineup) return;
    const slot = state.lineup.slots[idx];
    if (!slot||slot.locked) return;
    const mode = state.lineup.mode;
    const used = new Set(state.lineup.slots
        .filter((s,i)=>i!==idx&&s.activity).map(s=>s.activity.id));
    const st = slot.slotType;
    let newAct=null, newTags=[];

    if (st==='capstone') {
        const opts=['3-line-scenes','i-am-a-tree'].filter(id=>!used.has(id));
        if (opts.length) { newAct=getById(opts[Math.floor(Math.random()*opts.length)]); newTags=['capstone','scene work','beginner-eligible']; }
    } else if (st==='closer'&&mode==='beginner') {
        const opts=['five-things','name-game'].filter(id=>!used.has(id));
        if (opts.length) { newAct=getById(opts[Math.floor(Math.random()*opts.length)]); newTags=['class closer','high energy','group support']; }
    } else if (st==='guessing') {
        const opts=SHOW_GG.filter(id=>!used.has(id)); shuffle(opts);
        if (opts.length) { newAct=getById(opts[0]); newTags=['required guessing game','audience-readable','host structure']; }
    } else if (st==='longform') {
        const pool=(mode==='show'?SHOW_LF:ADVANCED_LF).filter(id=>!used.has(id)); shuffle(pool);
        if (pool.length) { newAct=getById(pool[0]); newTags=['required long-form','ensemble tracking']; }
    } else if (st==='filler') {
        const opts=SHOW_FILLER.filter(id=>!used.has(id)); shuffle(opts);
        if (opts.length) { newAct=getById(opts[0]); newTags=['filler','cut if running long']; }
    } else if (st==='early'||st==='mid'||st==='late'||st==='circle') {
        const tierMap = {'early':'Early','mid':'Mid','late':'Late','circle':null};
        const tier = tierMap[st];
        const p=ACTIVITIES.filter(a=>{
            if(used.has(a.id)||BEG_EXCLUDE.has(a.id))return false;
            const s=a.metadata.beginnerClassSuitability||'';
            return tier ? s===tier : ['Early','Mid','Late'].includes(s);
        }); shuffle(p);
        if(p.length){newAct=p[0];newTags=autoTags(p[0],'beginner');}
    } else if (st==='warmup') {
        const ADV_SK=new Set(['jesses-opening-meditation','zip-zap-zop','five-things']);
        const p=ACTIVITIES.filter(a=>{
            if(used.has(a.id)||ADV_SK.has(a.id))return false;
            return (a.metadata.advancedClassSuitability||'')==='Warmup';
        }); shuffle(p);
        if(p.length){newAct=p[0];newTags=autoTags(p[0],'advanced');}
    } else if (st==='skills') {
        const p=ACTIVITIES.filter(a=>{
            if(used.has(a.id))return false;
            return (a.metadata.advancedClassSuitability||'')==='Exercise';
        }); shuffle(p);
        if(p.length){newAct=p[0];newTags=autoTags(p[0],'advanced');}
    } else if (st==='shortform'||st==='opener') {
        const isS=mode==='show';
        const p=ACTIVITIES.filter(a=>{
            if(used.has(a.id))return false;
            if(isS) return isShowElig(a)&&a.category==='Short Form'&&!SHOW_GG.includes(a.id)&&!SHOW_LF.includes(a.id)&&!SHOW_FG.includes(a.id);
            return (a.metadata.advancedClassSuitability||'')==='Shortform';
        }); shuffle(p);
        if(p.length){newAct=p[0];newTags=autoTags(p[0],isS?'show':'advanced');}
    }

    if (newAct) {
        state.lineup.slots[idx] = mkSlot(newAct, st, false, newTags);
        renderLineup();
        buildPrint();
    }
}

// ═══════════════════════════════════════════
// ACTIVITY PICKER
// ═══════════════════════════════════════════
let _pickerIdx = -1;
let _pickerPool = [];

function getPickerPool(idx) {
    if (!state.lineup) return [];
    const slot = state.lineup.slots[idx];
    if (!slot || slot.locked) return [];
    const mode = state.lineup.mode;
    const st = slot.slotType;
    const used = new Set(state.lineup.slots
        .filter((s,i) => i !== idx && s.activity).map(s => s.activity.id));

    let pool = [];

    if (st === 'capstone') {
        pool = ['3-line-scenes','i-am-a-tree'].map(getById).filter(Boolean);
    } else if (st === 'closer' && mode === 'beginner') {
        pool = ['five-things','name-game'].map(getById).filter(Boolean);
    } else if (st === 'guessing') {
        pool = SHOW_GG.map(getById).filter(Boolean);
    } else if (st === 'longform') {
        pool = (mode === 'show' ? SHOW_LF : ADVANCED_LF).map(getById).filter(Boolean);
    } else if (st === 'filler') {
        pool = SHOW_FILLER.map(getById).filter(Boolean);
    } else if (st === 'formal-opening' || st === 'formal-closing' || st === 'conducted-song') {
        return []; // not replaceable
    } else if (st === 'early' || st === 'mid' || st === 'late' || st === 'circle') {
        const tierMap = {'early':'Early','mid':'Mid','late':'Late','circle':null};
        const tier = tierMap[st];
        pool = ACTIVITIES.filter(a => {
            const s = a.metadata.beginnerClassSuitability||'';
            return tier ? s === tier : ['Early','Mid','Late'].includes(s);
        });
    } else if (st === 'warmup') {
        const skip = new Set(['jesses-opening-meditation','zip-zap-zop','five-things']);
        pool = ACTIVITIES.filter(a => {
            if (skip.has(a.id)) return false;
            return (a.metadata.advancedClassSuitability||'') === 'Warmup';
        });
    } else if (st === 'skills') {
        pool = ACTIVITIES.filter(a => (a.metadata.advancedClassSuitability||'') === 'Exercise');
    } else if (st === 'shortform' || st === 'opener') {
        const isS = mode === 'show';
        pool = ACTIVITIES.filter(a => {
            if (isS) return isShowElig(a) && a.category === 'Short Form'
                && !SHOW_GG.includes(a.id) && !SHOW_LF.includes(a.id) && !SHOW_FILLER.includes(a.id);
            return (a.metadata.advancedClassSuitability||'') === 'Shortform';
        });
    } else {
        // Fallback: all eligible for current mode
        pool = ACTIVITIES.filter(a => mode==='beginner' ? isBeginnerElig(a) :
            mode==='advanced' ? isAdvancedElig(a) : isShowElig(a));
    }

    // Sort by name, mark current
    pool.sort((a,b) => a.name.localeCompare(b.name));
    return pool;
}

function showPicker(idx, event) {
    event.stopPropagation();
    const picker = document.getElementById('activity-picker');

    // Toggle off if same slot
    if (_pickerIdx === idx && picker.classList.contains('open')) {
        closePicker(); return;
    }

    _pickerIdx = idx;
    _pickerPool = getPickerPool(idx);
    document.getElementById('picker-search').value = '';
    renderPickerList('');

    // Position: bottom sheet on mobile, near-button on desktop
    const btn = event.currentTarget;
    const rect = btn.getBoundingClientRect();
    if (window.innerWidth <= 640) {
        // Mobile: anchor to bottom of screen as a sheet
        picker.style.top = 'auto';
        picker.style.bottom = '8px';
        picker.style.left = '8px';
        picker.style.width = (window.innerWidth - 16) + 'px';
        picker.style.maxHeight = '52vh';
    } else {
        // Desktop: drop down (or flip up) near the button
        picker.style.bottom = 'auto';
        picker.style.width = '240px';
        picker.style.maxHeight = '280px';
        let top = rect.bottom + 4;
        if (top + 280 > window.innerHeight) top = rect.top - 284;
        picker.style.top = Math.max(4, top) + 'px';
        let left = rect.left;
        if (left + 240 > window.innerWidth - 8) left = window.innerWidth - 248;
        picker.style.left = Math.max(4, left) + 'px';
    }
    picker.classList.add('open');

    setTimeout(() => document.getElementById('picker-search').focus(), 50);
}

function renderPickerList(query) {
    const list = document.getElementById('picker-list');
    const current = state.lineup && state.lineup.slots[_pickerIdx] && state.lineup.slots[_pickerIdx].activity;
    const currentId = current ? current.id : null;
    const q = query.toLowerCase();
    const filtered = _pickerPool.filter(a =>
        !q || a.name.toLowerCase().includes(q) ||
        (a.coreSkills||[]).join(' ').toLowerCase().includes(q)
    );
    if (!filtered.length) {
        list.innerHTML = '<div id="picker-empty">No matches</div>';
        return;
    }
    list.innerHTML = filtered.map(a =>
        `<div class="pick-item${a.id===currentId?' current':''}" onclick="pickActivity(${_pickerIdx},'${a.id}')">${a.name}</div>`
    ).join('');
}

function pickActivity(idx, id) {
    const a = getById(id);
    if (!a || !state.lineup) return;
    const slot = state.lineup.slots[idx];
    if (!slot) return;
    state.lineup.slots[idx] = mkSlot(a, slot.slotType, false,
        autoTags(a, state.lineup.mode));
    closePicker();
    renderLineup();
    buildPrint();
}

function closePicker() {
    _pickerIdx = -1;
    document.getElementById('activity-picker').classList.remove('open');
}

// Close picker on outside click
document.addEventListener('click', e => {
    const picker = document.getElementById('activity-picker');
    if (picker && picker.classList.contains('open') && !picker.contains(e.target)) {
        closePicker();
    }
});

// GENERATE + RENDER LINEUP (SCREEN)
// ═══════════════════════════════════════════
function generateLineup(mode) {
    if (mode==='beginner') state.lineup=genBeginner();
    else if (mode==='advanced') state.lineup=genAdvanced();
    else state.lineup=genShow();

    ['beginner','advanced','show'].forEach(m=>{
        document.getElementById('btn-'+m).classList.toggle('active',m===mode);
    });
    renderLineup();
    buildPrint();
}

function slotLabel(st, mode) {
    const sfLabel = mode==='show' ? 'Short Form' : 'Short Form / Technical Reps';
    return {opening:'Opening',warmup:'Warmup',circle:'Circle Games / Exercises',
        skills:'Exercises',capstone:'Capstone',closer:'Closer',shortform:sfLabel,
        longform:'Long Form',guessing:'Guessing Game',final:'Show Closer',
        opener:'Show Opener','formal-opening':'Opening'}[st]||st;
}

function renderLineup() {
    if (!state.lineup) return;
    const {label,duration,slots} = state.lineup;
    let num=0; let lastSection='';
    const html = slots.map((s,i)=>{
        const a=s.activity;
        if (a||s.displayName) num++;
        const name = a?a.name:s.displayName;
        const desc = a?(a.metadata.bestUse||''):(s.displayDesc||'');
        const tags = s.reasonTags||[];
        const sec = slotLabel(s.slotType, state.lineup.mode);
        let sectionHdr = '';
        if (sec!==lastSection) { sectionHdr=`<div style="font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px;">${sec}</div>`; lastSection=sec; }
        return sectionHdr+`<div class="lineup-slot slot-${s.slotType}">
            <div class="slot-number">${num}</div>
            <div class="slot-body">
                ${a ? `<div class="slot-name slot-name-link" onclick="openActivityModal('${a.id}')">${name}</div>` : `<div class="slot-name">${name}</div>`}
                ${desc?`<div class="slot-desc">${desc}</div>`:''}
                <div class="slot-tags">${tags.map(t=>`<span class="reason-tag">${t}</span>`).join('')}</div>
            </div>
            <div class="slot-actions">${!s.locked?`<button class="regen-btn" onclick="regenSlot(${i})" title="Random swap">↺</button><button class="pick-btn" onclick="showPicker(${i},event)" title="Pick a game">Pick ▾</button>`:'<span class="locked-icon">🔒</span>'}</div>
        </div>`;
    }).join('');

    document.getElementById('lineup-display').innerHTML = `
    <div class="lineup-header">
        <div class="lineup-title-row"><h2>${label}</h2><span class="lineup-duration">${duration}</span></div>
        ${(state.lineup && (state.lineup.mode==='show' || state.lineup.mode==='custom-show')) ? '<button class="print-btn" onclick="printSetList()">🎭 Print Set List</button>' : '<button class="print-btn" onclick="printLineup()">🖨 Print Lineup</button>'}
    </div>
    <div class="lineup-slots">${html}</div>`;
}

// ═══════════════════════════════════════════
// PRINT PANELS
// ═══════════════════════════════════════════
const MED_BEATS = [
    'Breath from belly · eyes closed · grounding cord to earth · feel your energy',
    'Body scan — toes → legs → torso → shoulders → head → fingertips',
    'Agreements: Take a risk · Release judgment of others · Release judgment of self',
    '3 rounds: inhale → hands high → exhale with audible sigh · open eyes'
];

// Game Reference lists — derived dynamically from ACTIVITIES dataset
// refName: shorten names for the narrow 5-column print layout so the primary name
// survives intact instead of being ellipsis-chopped mid-phrase. Two passes:
//   1. drop alias tails      "Home Shopping Network / HSN"        -> "Home Shopping Network"
//   2. drop a trailing gloss "LOW (Location, Occupation, Weapon)" -> "LOW"
// CSS ellipsis handles whatever is still too long. Affects the printed reference only.
const refName = n => n.split(' / ')[0].replace(/\s*\([^)]*\)\s*$/, '').trim();
const _bycat = cat => ACTIVITIES.filter(a=>a.category===cat).map(a=>refName(a.name)).sort();
const REF5 = {
    'Warmups': ACTIVITIES.filter(a=>a.category==='Warmups'&&a.id!=='jesses-opening-meditation').map(a=>refName(a.name)).sort(),
    'Closers': _bycat('Closers'),
    'Scene & Character': _bycat('Exercises')
};
const REF_GUESSING = SHOW_GG.map(id=>{ const a=ACTIVITIES.find(x=>x.id===id); return a?refName(a.name):null; }).filter(Boolean);
const REF_SF = ACTIVITIES.filter(a=>a.category==='Short Form'&&!SHOW_GG.includes(a.id)).map(a=>refName(a.name)).sort();
const REF_LF = _bycat('Long Form');

function buildPrint() {
    if (!state.lineup) return;
    const {label,duration,slots} = state.lineup;
    const today = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

    // Number all slots
    let n=0;
    slots.forEach(s=>{ if(s.activity||s.displayName) s._n=++n; else s._n=0; });

    const allSlots = slots.filter(s=>s._n);

    function actHtml(s) {
        const a=s.activity;
        const name=a?a.name:s.displayName;
        const isMed = a&&a.id==='jesses-opening-meditation';
        const isZZZ = a&&a.id==='zip-zap-zop';
        let h=`<div class="pp-activity"><div class="pp-activity-name">${s._n}. ${name}</div>`;
        if (isMed) {
            MED_BEATS.forEach(b=>h+=`<div class="pp-activity-desc">${b}</div>`);
            h+=`<div class="pp-activity-tags">presence · risk readiness · class container · 5–10 min</div>`;
        } else if (isZZZ) {
            h+=`<div class="pp-activity-desc">Standard → move quickly to reverse or phonetic variant</div>`;
            h+=`<div class="pp-activity-tags">focus · eye contact · speed · variant-ready · 3–10 min</div>`;
        } else {
            const m=a?a.metadata:{};
            const desc=a?(m.bestUse||''):(s.displayDesc||'');
            if(desc) h+=`<div class="pp-activity-desc">${desc}</div>`;
            const tags=(s.reasonTags||[]).slice(0,4);
            if(tags.length) h+=`<div class="pp-activity-tags">${tags.join(' · ')}</div>`;
        }
        h+=`</div>`;
        return h;
    }

    // PANEL 1: all lineup slots flow naturally across two CSS columns
    const mode = state.lineup.mode;
    const sfLabel = mode==='show' ? 'Short Form' : 'Short Form / Technical Reps';
    const SEC_MAP={opening:'Opening',warmup:'Warmup',circle:'Circle Games',
        skills:'Exercises',shortform:sfLabel,longform:'Long Form',
        capstone:'Capstone',closer:'Closer',
        guessing:'Guessing Game',opener:'Short Form',final:'Show Closer',
        'formal-opening':'Opening'};
    let p1=`<div class="pp-title">${label} · ${today}</div>`;
    p1+=`<div class="pp-subtitle">Flying Pig Improv · ${duration}</div>`;
    let lastSec='';
    allSlots.forEach(s=>{
        const sec=SEC_MAP[s.slotType]||s.slotType;
        if(sec!==lastSec){
            if(lastSec) p1+=`<div class="pp-divider">— ${sec} —</div>`;
            lastSec=sec;
        }
        p1+=actHtml(s);
    });

    // SECTION 2: Skill Focus — all activities flow across 2 CSS columns
    const allActs = allSlots.filter(s=>s.activity);
    let p2=`<div class="pp-title">Skill Focus</div>`;
    allActs.forEach(s=>{
        const a=s.activity;
        const skills=(a.coreSkills||[]).join(' · ');
        const bu=a.metadata.bestUse||'';
        const av=a.metadata.avoidWhen||'';
        const generic=av.startsWith('Needs Review only');
        p2+=`<div class="pp-look-row"><div class="pp-look-game">${s._n}. ${a.name}</div>`;
        p2+=`<div class="pp-look-cues">${skills}`;
        const showBU = bu && bu!=='Warmup group focus, energy, and technical readiness'
            && bu!=='Skill-building reps before heavier scene or show work'
            && bu!=='Practice/show piece when matching skills are the lesson or format need'
            && bu!=='Positive class exit / group support';
        if(showBU) p2+=` · ${bu}`;
        if(!generic&&av) p2+=`<span class="pp-avoid"> · Avoid: ${av}</span>`;
        p2+=`</div></div>`;
    });

    // SECTION 3: Game Reference — flat list flows across 5 CSS columns
    let p3=`<div class="pp-title">Game Reference</div>`;
    // Warmups + Closers + Scene & Character
    Object.entries(REF5).forEach(([cat,games])=>{
        p3+=`<div class="pp-ref-cat">${cat}</div>`;
        games.forEach(g=>p3+=`<div class="pp-ref-game">${g}</div>`);
    });
    // Short Form (guessing games excluded)
    p3+=`<div class="pp-ref-cat">Short Form</div>`;
    REF_SF.forEach(g=>p3+=`<div class="pp-ref-game">${g}</div>`);
    // Guessing Games
    p3+=`<div class="pp-ref-cat">Guessing Games</div>`;
    REF_GUESSING.forEach(g=>p3+=`<div class="pp-ref-game">${g}</div>`);
    // Long Form
    p3+=`<div class="pp-ref-cat">Long Form</div>`;
    REF_LF.forEach(g=>p3+=`<div class="pp-ref-game">${g}</div>`);

    document.getElementById('pp1').innerHTML = p1;
    document.getElementById('pp2').innerHTML = p2;
    document.getElementById('pp3').innerHTML = p3;
    ['pp4','pp5','pp6'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=''; });
}

function openActivityModal(id) {
    const a = getById(id);
    if (!a) return;
    const m = a.metadata;
    const modal = document.getElementById('activity-modal');

    // Title
    document.getElementById('modal-title').textContent = a.name;

    // Meta row: category + difficulty badge + suitability badges
    const badges = [];
    function suitLabel(val) {
        const valid = ['Warmup','Early','Mid','Late','Capstone','Closer','Exercise','Shortform','Longform'];
        if (!val || !valid.includes(val.trim())) return '';
        return val.trim();
    }
    const begLabel = suitLabel(m.beginnerClassSuitability||'');
    if (begLabel) badges.push(`<span class="badge badge-beginner">Beg: ${begLabel}</span>`);
    const advLabel = suitLabel(m.advancedClassSuitability||'');
    if (advLabel) badges.push(`<span class="badge badge-advanced">Adv: ${advLabel}</span>`);
    if (['Strong','Yes'].some(v => (m.showSuitability||'').includes(v)))
        badges.push('<span class="badge badge-show">Show</span>');
    document.getElementById('modal-meta-row').innerHTML =
        `<span class="activity-category">${a.category}</span>` +
        `<span class="activity-difficulty diff-${normDiff(m.difficulty)}">${m.difficulty||''}</span>` +
        badges.join('');

    // Body
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-meta-grid">
            <div><strong>Format Role:</strong> ${a.formatRole||'—'}</div>
            <div><strong>Difficulty:</strong> ${m.difficulty||'—'}</div>
            <div><strong>Energy:</strong> ${m.energyLevel||'—'}</div>
            <div><strong>Players:</strong> ${m.playerCount||'—'}</div>
            <div><strong>Runtime:</strong> ${m.estimatedRuntime||'—'}</div>
            ${['No','No / Optional','No documented prop requirement'].includes(m.requiresProps||'') ? '' : `<div><strong>Props:</strong> ${m.requiresProps}</div>`}
        </div>
        ${a.coreSkills && a.coreSkills.length ? '<p class="meta-skills"><strong>Core Skills:</strong> ' + a.coreSkills.join('; ') + '</p>' : ''}
        ${m.bestUse ? '<p class="meta-use" style="margin-top:8px;"><strong>Best Use:</strong> ' + m.bestUse + '</p>' : ''}

        <div class="full-markdown" style="margin-top:14px;">${renderMD(a.fullMarkdown)}</div>
    `;

    modal.classList.add('open');
    document.addEventListener('keydown', _modalKeyHandler);
}

function closeModal() {
    document.getElementById('activity-modal').classList.remove('open');
    document.removeEventListener('keydown', _modalKeyHandler);
}

function _modalKeyHandler(e) {

}

function sendFeedback() {

    const filters = [];
    if (state.filterCategory) filters.push('Category: ' + state.filterCategory);

// CUSTOM SHOW
// ═══════════════════════════════════════════
function startCustomShow() {
    ['beginner','advanced','show'].forEach(m => {
        document.getElementById('btn-'+m).classList.remove('active');
    });
    document.getElementById('btn-custom-show').classList.add('active');
    state.lineup = null;
    renderCustomShow();
}

function renderCustomShow() {
    const showElig = ACTIVITIES.filter(a => {
        const s = a.metadata.showSuitability || '';
        return s === 'Strong' || s === 'Yes';
    });

    // Group by category
    const groups = {};
    showElig.forEach(a => {
        const cat = a.category || 'Other';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(a);
    });

    const customList = window._customList || [];
    const customIds = new Set(customList.map(a => a.id));

    // Build available panel
    let availHtml = '<input class="custom-search" id="custom-search" placeholder="Filter activities…" oninput="filterCustomAvail()" />';
    const SECTION_ORDER = ['Show Craft', 'Short Form', 'Long Form', 'Closers'];
    const sortedCats = SECTION_ORDER.filter(c => groups[c]).concat(Object.keys(groups).filter(c => !SECTION_ORDER.includes(c)).sort());
    sortedCats.forEach(cat => {
        const items = groups[cat];
        availHtml += `<div class="custom-section-label">${cat}</div>`;
        items.forEach(a => {
            const already = customIds.has(a.id);
            availHtml += `<div class="custom-avail-item" data-name="${a.name.toLowerCase()}" data-cat="${cat.toLowerCase()}">
                <span>${a.name}</span>
                <button class="custom-add-btn" onclick="addToCustom('${a.id}')" ${already ? 'disabled style="opacity:.4"' : ''}>
                    ${already ? '✓' : '+ Add'}
                </button>
            </div>`;
        });
    });

    // Build lineup panel
    let lineupHtml = '';
    if (customList.length === 0) {
        lineupHtml = '<div class="custom-empty">No activities added yet.</div>';
    } else {
        customList.forEach((a, i) => {
            lineupHtml += `<div class="custom-slot">
                <div class="custom-slot-num">${i+1}</div>
                <div class="custom-slot-name">${a.name}</div>
                <div class="custom-slot-btns">
                    <button class="custom-move-btn" onclick="moveCustomSlot(${i},-1)" ${i===0?'disabled':''}>▲</button>
                    <button class="custom-move-btn" onclick="moveCustomSlot(${i},1)" ${i===customList.length-1?'disabled':''}>▼</button>
                    <button class="custom-remove-btn" onclick="removeFromCustom(${i})">✕</button>
                </div>
            </div>`;
        });
    }

    document.getElementById('lineup-display').innerHTML = `
        <div style="margin-bottom:10px">
            ${customList.length > 0 ? '<button class="print-btn" onclick="printSetList()">🎭 Print Set List</button>' : ''}
        </div>
        <div class="custom-show-wrap">
            <div class="custom-available">
                <div class="custom-section-label" style="margin-top:0">Available Show Activities</div>
                ${availHtml}
            </div>
            <div class="custom-lineup-col">
                <div class="custom-lineup-header">
                    <div class="custom-section-label" style="margin:0">Your Lineup (${customList.length})</div>
                    ${customList.length > 0 ? '<button class="custom-clear-btn" onclick="clearCustomShow()">Clear all</button>' : ''}
                </div>
                ${lineupHtml}
            </div>
        </div>`;
}

function addToCustom(id) {
    if (!window._customList) window._customList = [];
    const a = ACTIVITIES.find(x => x.id === id);
    if (a && !window._customList.find(x => x.id === id)) {
        window._customList.push(a);
    }
    renderCustomShow();
}

function removeFromCustom(idx) {
    if (!window._customList) return;
    window._customList.splice(idx, 1);
    renderCustomShow();
}

function moveCustomSlot(idx, dir) {
    if (!window._customList) return;
    const list = window._customList;
    const target = idx + dir;
    if (target < 0 || target >= list.length) return;
    [list[idx], list[target]] = [list[target], list[idx]];
    renderCustomShow();
}

function clearCustomShow() {
    window._customList = [];
    renderCustomShow();
}

function filterCustomAvail() {
    const q = document.getElementById('custom-search').value.toLowerCase();
    document.querySelectorAll('.custom-avail-item').forEach(el => {
        const name = el.dataset.name || '';
        const cat = el.dataset.cat || '';
        el.style.display = (!q || name.includes(q) || cat.includes(q)) ? '' : 'none';
    });
    // Hide section labels when all items in that section are hidden
    document.querySelectorAll('.custom-section-label').forEach(lbl => {
        const next = lbl.nextElementSibling;
        if (!next) return;
        // collect all siblings until next label
        let sibling = lbl.nextElementSibling;
        let anyVisible = false;
        while (sibling && !sibling.classList.contains('custom-section-label') && !sibling.classList.contains('custom-search')) {
            if (sibling.style.display !== 'none') anyVisible = true;
            sibling = sibling.nextElementSibling;
        }
        lbl.style.display = anyVisible ? '' : 'none';
    });
}


function extractRules(md) {
    if (!md) return [];
    const match = md.match(/\*\*Rules\*\*\n([\s\S]*?)(?=\n\*\*|---\s*$|$)/);
    if (!match) return [];
    return match[1].trim().split('\n')
        .map(l => l.replace(/^[-*]\s*/, '').trim())
        .filter(l => l.length > 0);
}

function printSetList() {
    const slots = state.lineup ? state.lineup.slots :
                  (window._customList || []).map(a => ({activity: a}));
    const activities = slots.map(s => s.activity).filter(Boolean);
    if (!activities.length) { alert('No activities in lineup.'); return; }

    const today = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

    let html = `<div class="sl-header"><h1>Flying Pig Improv — Show Set List</h1><div class="sl-date">${today}</div></div>`;

    activities.forEach((a, idx) => {
        const rules = extractRules(a.fullMarkdown);
        const intro = a.introScript || '';
        const roles = a.roles || Array.from({length: parseInt(a.metadata.minimumPlayers)||2}, (_,i) => `Player ${i+1}`);

        const rulesHtml = rules.length
            ? `<div class="sl-section-label">Rules</div><ul class="sl-rules">${rules.map(r=>`<li>${r}</li>`).join('')}</ul>`
            : '';

        const introHtml = intro
            ? `<div class="sl-section-label">Intro Script</div><div class="sl-intro">${
                intro.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .split(/\n\n+/)
                    .map(para => `<p>${para.replace(/\n/g,'<br>')}</p>`)
                    .join('')
              }</div>`
            : '';

        const rolesHtml = `<div class="sl-section-label">Players</div><div class="sl-roles">${
            roles.map(r => `<div class="sl-role"><span class="sl-role-label">${r}:</span><span style="flex:1">&nbsp;</span></div>`).join('')
        }</div>`;

        html += `<div class="sl-game">
            <div class="sl-game-name">${idx+1}. ${a.name}</div>
            ${rulesHtml}${introHtml}${rolesHtml}
        </div>`;
    });

    document.getElementById('show-setlist').innerHTML = html;
    document.body.classList.add('printing-setlist');
    bindSetlistPrintCleanup();
    setTimeout(() => window.print(), 150);
}

/* Mobile fix (2026-08-10): the old code called window.print() and removed
   `printing-setlist` on the very next line. On desktop window.print() blocks until the
   dialog closes, so the class survived long enough to style the printout. On iOS Safari
   and Chrome for Android window.print() returns immediately and the preview renders
   asynchronously, so the class was already gone by the time the page was snapshotted --
   the set-list rules never matched, #show-setlist stayed hidden, and the base @media
   print block rendered the six-panel CLASS lineup instead. Hence "Print Set List gave me
   something that looked like a class lineup," mobile only.

   Cleanup is now event-driven. Leaving the class on is harmless (its rules live only
   inside @media print, so it has no on-screen effect), so failing to fire costs nothing
   visible -- but printLineup() also clears it defensively so a lingering class can never
   hijack a later class-lineup print. */
let _setlistCleanupBound = false;
function endSetlistPrint() {
    document.body.classList.remove('printing-setlist');
}
function bindSetlistPrintCleanup() {
    if (_setlistCleanupBound) return;
    _setlistCleanupBound = true;
    window.addEventListener('afterprint', endSetlistPrint);
    if (window.matchMedia) {
        const mq = window.matchMedia('print');
        const onChange = (m) => { if (!m.matches) endSetlistPrint(); };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
    }
    // Last resort for mobile browsers that fire neither of the above: the page loses
    // focus while the share/print sheet is up and regains it on return.
    window.addEventListener('focus', () => setTimeout(endSetlistPrint, 600));
}

// Class/advanced lineup printing. Always clears the set-list class first so the two
// print paths can never be confused with each other.
function printLineup() {
    endSetlistPrint();
    setTimeout(() => window.print(), 50);
}
