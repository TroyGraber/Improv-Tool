      "fullMarkdown": "**Skills**\nguessing; charades; producer pacing; salesmanship\n\n**Rules**\n- Five players participate.\n- One player acts as the producer or game introducer.\n- Two players are the home shopping hosts.\n- Two players are interns who will silently assist the hosts.\n- The producer introduces the game and sends the two host players out of the room.\n- The producer then gets audience suggestions for three products.\n- Each product has:\n  - an item,\n  - a unique ability or characteristic,\n  - a celebrity endorser.\n- The host players are called back into the room.\n- The producer tells the hosts that the teleprompters are down, but the two interns will help them with their lines.\n- The show then goes live with a countdown: \u201c3\u20262\u20261.\u201d\n- The interns play charades to help the hosts guess what they are selling.\n- The producer calls \u201cCamera 1\u201d or \u201cCamera 2\u201d to determine which intern is actively giving charades clues.\n- The producer may switch cameras to change clue-givers, create rhythm, or rescue a stalled clue path.\n- The hosts attempt to identify each item, its unique ability or characteristic, and its celebrity endorser.\n- The audience snaps when the hosts are close.\n- The audience claps when the hosts correctly guess something.\n- If the hosts are stuck, the producer may \u201cgo to commercial\u201d and give the hosts a verbal tip.\n- The game continues until the hosts identify the required information or the producer ends the game.\n\n**For Students**\n- Silence is failure; wrong guesses are part of the game.\n- Hosts should guess constantly and broadly:\n  - category,\n  - size,\n  - material,\n  - function,\n  - setting,\n  - emotion,\n  - celebrity type,\n  - famous roles,\n  - rhyming or sound-alike clues.\n- Interns should change tactics when a clue does not work.\n- Charades should be large, specific, and repeated only when it is clearly helping.\n- Hosts should remain cheerful, promotional, and committed to the broadcast even while confused.\n- The home shopping frame gives the hosts permission to over-sell partial guesses.\n- Audience snaps and claps are part of the information system; players should listen to them.\n- The producer should use camera switches actively, not passively.\n- Camera switches should help manage rhythm, reset unclear charades, and distribute support between the interns.\n- Commercial breaks should be used as rescue tools, not as the main guessing mechanism.\n- The producer should give tips that narrow the search without solving the answer for the hosts.\n- The best versions keep the energy of a real sales pitch while the hosts slowly discover the truth.\n- Interns should separate the clue targets: item, characteristic, and celebrity endorser.\n- The producer should choose audience suggestions that are specific and playable, but not impossible.\n- The producer needs judgment, not just confidence.\n- A strong producer watches four things at once:\n  - whether the hosts are still guessing,\n  - whether the interns\u2019 charades are readable,\n  - whether the audience is still engaged,\n  - whether the current clue path needs a camera switch or commercial break.\n- Weak producers either under-intervene and let the game stall, or over-intervene and rob the hosts of the discovery.\n- The best producer keeps the game moving while preserving the illusion that the hosts are figuring it out live.\n\n**For Teachers**\n- Coach hosts to stay in character \u2014 they are guessing, but they should still try to be hosts.\n- Coach hosts who stop guessing and wait for perfect clues \u2014 being wrong is fine; silence kills the game.\n- Watch for interns who repeat the same unclear charade. Coach them to change tactics: try a different body part of the product, a different user, a different action.\n- Coach interns to act out all three elements: the item, the unique characteristic, and the celebrity endorser.\n- Encourage hosts to guess broadly first \u2014 category before specifics.\n- Coach the producer to switch cameras before an intern's clue path fully stalls, not after.\n- Coach the producer to call commercial at the right time \u2014 too late and the audience has already felt it drag.\n- Watch for the scene frame collapsing. Remind players they are broadcast professionals \u2014 keep the show-within-a-show alive.",

      "fullMarkdown": "**Skills**\nalphabet tracking; constrained scene work; recovery\n\n**Rules**\n- Two players perform a scene. The audience gives a suggestion used to pick the starting letter.\n- Each time a player speaks, their first word must start with the next letter of the alphabet. A player may use multiple sentences in a single turn \u2014 only the first word of that turn must carry the letter. Players cycle through the full alphabet back to the starting letter.\n- The scene should still be coherent \u2014 the alphabet is the constraint, not the content.\n\n**Success Looks Like**\nPlayers stay in the scene while tracking the alphabet; lines start cleanly and quickly; difficult letters (Q, X, Z) land without killing the momentum.\n\n**For Students**\n- Establish who, what, and where early \u2014 the scene needs something to ride on as the constraint tightens.\n- A simple, clear line fast beats a clever line slow. Names, commands, and exclamations are fair game.\n- Hard letters have go-to openers: \"Quick\u2026\", \"Xavier\u2026\", \"You\u2026\", \"Zero chance\u2026\" \u2014 have them ready.\n\n**For Teachers**\n- Players who struggle here are usually splitting their attention between the alphabet and the scene \u2014 the goal is to reduce the cognitive load of the alphabet so they can stay present.\n- Watch for scenes that flatten to just letter-hunting. Coach players to advance the relationship, not just survive the constraint.\n- Missed letters: recover and keep moving unless the format requires correction.",

      "fullMarkdown": "**Skills**\npaired speaking; sales pitch; hosting; rhythm\n\n**Rules**\n- Five players participate.\n- One player is the shopper.\n- Four players are divided into two pairs.\n- Each pair represents a rival company.\n- The shopper asks the audience for a product or thing they are shopping for.\n- The shopper then asks each duet pair for its company name.\n- The shopper asks each duet what makes its product special.\n- The shopper asks each duet two to three follow-up questions.\n- The duets may occasionally cross-talk or respond to each other.\n- One duet pair speaks every other word.\n- The other duet pair speaks at the same time.\n- The finale is usually the shopper asking each duet for its jingle.\n- After hearing the pitches and jingles, the shopper picks a winner.\n\n**For Students**\n- The shopper should make the structure easy for the duets.\n- Good shopper questions are specific enough to create usable answers:\n  - \u201cWhat makes your version safer?\u201d\n  - \u201cWhy is your product better for families?\u201d\n  - \u201cWhat happens if I use it incorrectly?\u201d\n  - \u201cWho should never buy this?\u201d\n  - \u201cWhat celebrity uses your product?\u201d\n- The every-other-word pair should favor simple sentence construction.\n- The simultaneous-speaking pair should choose bold obvious answers rather than subtle ones.\n- In simultaneous speech, matching energy and direction matters more than exact wording.\n- A strong partner in the simultaneous duet can help by physically and vocally committing early, giving the other player something to join.\n- Duets should build product identity early so the jingle has something to summarize.\n- The shopper should heighten the rivalry without making the duets fight for airtime chaotically.\n- The winning choice should feel like a button or payoff, not just an administrative ending.\n\n**For Teachers**\n- In the simultaneous-speaking duet, coach for balance: one passive or one aggressive partner breaks the coordination. Both players need to commit equally.\n- Coach the shopper to ask focused questions and balance time between the two companies.\n- Push companies to differentiate themselves \u2014 similar pitches make the shopper's choice meaningless.\n- Remind duets they are selling something, not just demonstrating the mechanic.\n- Coach for cross-talk \u2014 the pairs are competing.\n- Coach the shopper to actively manage pacing; a passive shopper lets the game stall.",

      "fullMarkdown": "**Skills**\nrhetorical confidence; objection; justification; tangent control\n\n**Rules**\n- One player serves as the judge.\n- The other players stand in a line.\n- The judge introduces the game and asks the audience for a topic.\n- One player steps forward and begins making a case on the topic.\n- At any point, another player in the line may step forward and say, \u201cObjection!\u201d\n- The objecting player then objects to something the current speaker just said.\n- The objection may be directly related to the topic or may be a tangent inspired by a word, phrase, implication, or detail.\n- The judge rules on the objection by saying either:\n  - \u201cSustained,\u201d or\n  - \u201cOverruled.\u201d\n- If the objection is overruled, the current speaker continues.\n- If the objection is sustained, the objecting player takes over and must continue arguing the point made in the objection.\n- The new speaker continues until another player objects.\n- The game continues through a series of arguments, objections, rulings, and takeovers until the judge ends the game.\n\n**For Students**\n- The speaker should make bold claims quickly.\n- The objector should object to something specific, even if the objection is ridiculous.\n- A good objection creates a new playable argument, not just a correction.\n- The judge should rule fast.\n- \u201cSustained\u201d should usually be used when the objection creates better momentum.\n- \u201cOverruled\u201d should be used when the objection is unclear, weak, or would derail a stronger current run.\n- The game rewards confidence more than legal accuracy.\n- Tangents are useful when they are committed to as if they matter.\n- Players should maintain debate energy: formal, passionate, overly certain, and rhetorically inflated.\n- The best arguments sound structured even when the logic is absurd.\n- Players who are good at setup/punchline construction may thrive if they use that skill to create playable objections rather than simply dropping jokes.\n- The ideal move is not just \u201csay a funny objection\u201d; it is \u201ccreate a funny objection that forces the next argument into a stronger absurd position.\u201d\n\n**For Teachers**\n- Coach players to object early and often.\n- Objections should have a playable angle.\n- Push objections toward the theatrical and absurd \u2014 too logical and the game loses its energy.\n- The judge should rule quickly, sustain objections with playable directions, and overrule ones that don't.\n- Tangents can be good playable arguments.\n- Remind players that a weak objection is still a playable offer \u2014 self-consciousness is the bigger failure.",

      "fullMarkdown": "**Skills**\none-word team speaking; character under constraint; host escalation\n\n**Rules**\nOne host runs the spelling bee; two teams of three compete. The host establishes a setting (e.g., fourth grade, senior center, prison).\n\nTeams introduce themselves one word at a time.\n\nThe clap always comes FIRST, then the word. When asked to spell a word, the team: claps \u2192 says the word \u2192 spells one letter at a time \u2192 claps \u2192 says the word again.\n\nThe same clap-then-word pattern also closes every host follow-up. After finishing a sentence, a definition, or an etymology/origin answer, the team claps and says the word again before the host moves on.\n\nThe host follows up with questions: \"Use it in a sentence,\" \"Define it,\" \"Give me the etymology,\" etc.\n\nWords escalate: simple real words \u2192 harder real words \u2192 invented or absurd words.\n\nExample:\n- Host: \"Your word is 'banana.'\"\n- Team: \"[clap] Banana. B-A-N-A-N-A. [clap] Banana.\"\n- Host: \"Use it in a sentence.\"\n- Team (one word at a time): \"I / once / ate / a / banana / on / the / moon.\" \u2192 \"[clap] Banana.\"\n\nIn beginner class, the coach typically serves as host, freeing students to focus on team speaking and character.\n\n**Success Looks Like**\nTeams go fast and stay in character; correct spelling matters less than confident shared commitment; invented words are defined with total authority.\n\n**For Students**\nClap first, then say the word \u2014 not the other way round. This is the single easiest thing to get backwards, and it's easy to forget mid-game even if you know it.\n\nThe clap-and-word also closes out every follow-up answer (sentence, definition, origin), not just the spelling itself.\n\nSpeed and character over spelling accuracy. Commit to wrong answers confidently.\n\nYour team introduction establishes a shared identity \u2014 make it playable, not generic.\n\nTreat invented words as real. Define them with authority and let the definition reveal character.\n\n**For Teachers**\nHosts: escalate word difficulty gradually. Early words let the audience learn the pattern; later words create pressure and absurdity.\n\nFollow-up questions should heighten character or world \u2014 not just be administrative checkboxes.\n\nCommon failure: players prioritize correctness over rhythm and the game loses energy. Redirect to confidence and speed.",

      "fullMarkdown": "**Skills**\none-word speaking; genre frame; pacing\n\n**Rules**\n- Two players perform as newscasters.\n- The players deliver breaking news stories one word at a time.\n- The stories are usually absurd, heightened, or ridiculous.\n- The players maintain the tone and posture of serious newscasters while building the story together.\n- The game may move through multiple breaking news stories.\n- The players must decide when a story has reached a natural endpoint and when to advance to the next story.\n- The game ends when the news sequence reaches a strong final button or when the host/players call the end.\n- The game may also appear as an improvised insert inside a long-form set, when players briefly shift into a breaking-news frame to comment on, heighten, or transition from the ongoing long-form material.\n\n**For Students**\n- The newscaster genre matters.\n- Players should use posture, vocal tone, urgency, seriousness, and broadcast rhythm to sell the frame.\n- The comedy often comes from treating absurd events as legitimate breaking news.\n- A good story should have a clear enough structure that the audience can follow it:\n  - event,\n  - who is affected,\n  - where it happened,\n  - why it matters,\n  - absurd escalation,\n  - button.\n- Players should learn to feel when a story has peaked.\n- Moving to the next story is a pacing skill, not an escape hatch.\n- Strong transitions can sound like real news pivots:\n  - \u201cIn other news\u2026\u201d,\n  - \u201cWe now go to\u2026\u201d,\n  - \u201cAuthorities are reporting\u2026\u201d,\n  - \u201cThis just in\u2026\u201d.\n- The ending should feel deliberate, not like the players ran out of steam.\n- The best versions combine fast one-word-at-a-time rhythm with believable newscaster authority.\n- As a long-form insert, Breaking News should be used sparingly.\n- The player initiating it needs strong judgment; otherwise it can feel like a random genre interruption.\n- It works best when it clarifies, heightens, or reframes something already present in the long-form.\n- The insert should still preserve the newscaster tone: serious delivery, clean pacing, and a clear button.\n\n**For Teachers**\n- Remind players they are newscasters \u2014 keep the framing alive.\n- Coach for deliberate broadcast pace.\n- Coach players to recognize when a story has peaked and move on to a new story.\n- Push players to prioritize a clear news-story shape.\n- For younger players who lack newscaster reference points, model the formal, urgent broadcast delivery before the game starts.",

      "fullMarkdown": "**Skills**\naudience care; justification; volunteer support\n\n**Rules**\nTwo audience members come onstage \u2014 one assigned to each player.\n\nThe two players perform a normal scene. At any point a player may pause mid-sentence and tap their assigned volunteer.\n\nThe volunteer supplies a word or short phrase. The player immediately incorporates it and continues the scene.\n\nThis is a performer-struggle game, not a volunteer-struggle game. The audience member supplies the offer; the improviser carries the responsibility for making it work.\n\nExample:\n- Player: \"I'm sorry I was late, I had to clean my\u2026\" [taps volunteer]\n- Volunteer: \"Cat.\"\n- Player: \"My cat. He was so dirty. Too much catnip.\"\n\n**Success Looks Like**\nThe volunteer feels safe, funny, and included; inserted words affect the relationship or stakes, not just decorate sentences; the scene stays a real scene.\n\n**For Students**\nSet up a clear blank before you tap: \"I brought you a\u2026\" / \"We can't go back to\u2026\" \u2014 not after you've already finished the sentence.\n\nThe volunteer's answer is always right. Your job is to make them look clever, not show how hard the offer was.\n\nUse the inserted word to affect the relationship, not just fill space.\n\n**For Teachers**\nCommon mistakes: tapping too early (no blank set up), tapping too late (sentence already finished), or using the pillar so often the scene can't develop.\n\nIf the volunteer gives a basic or obvious answer, the player still owns the justification \u2014 make it work anyway.\n\nThe best versions make the audience volunteer feel like they were funny. That's the performer's responsibility, not luck.",

      "fullMarkdown": "**Skills**\ncharacter inheritance; observation; big physical choices\n\n**Rules**\n- Three chairs are placed on stage.\n- Six players participate.\n- The audience gives a location where people would gather.\n- Three players begin seated in the chairs.\n- Each seated player creates a very large physical and character choice.\n- The three offstage players watch closely.\n- When the offstage players see a button, they ring a bell.\n- The seated players exit.\n- The three offstage players replace them in the chairs.\n- Each incoming player plays the exact same character associated with the chair they take over.\n- The characters remain tied to the chairs throughout the game.\n- The game continues through multiple rounds.\n- The game often continues until players eventually return to their original chairs/characters.\n\n**For Students**\n- Big does not mean random.\n- The best characters are physically large, vocally clear, and easy for another player to reproduce.\n- Players should make choices that are:\n  - obvious enough to copy,\n  - specific enough to preserve,\n  - and playable enough to sustain.\n- Offstage players should watch the whole body, not just the voice.\n- Incoming players should honor the existing character before adding new heightening.\n- A strong replacement performance says: \u201cI understood the offer, and now I am carrying it forward.\u201d\n- The bell should land on a button, not merely on confusion or impatience.\n- Repetition is part of the game; the audience enjoys seeing the same character filtered through different performers.\n- The location should continue to matter. It gives the characters something to do besides display quirks.\n- The game works best when the inherited characters have clear wants, emotions, and relationships, not just physical abnormalities.\n\n**For Teachers**\n- Push for character choices big enough to inherit.\n- Coach incoming players to copy the full body, not just the voice or catchphrase. Watch for surface-level impressions.\n- Watch for character drift over multiple rotations.\n- Coach players to heighten the existing character, not change it.\n- Coach offstage players to edit on a button.\n- Remind players that specific is better than weird.\n- Watch for the location disappearing after the opening.\n- In early practice, establish the inheritance mechanic.",

      "fullMarkdown": "**Skills**\ngibberish; translation; host support; emotional intent\n\n**Rules**\n- Four players participate.\n- Two players are the hosts introducing a foreign film.\n- Two players are the actors inside the film.\n- The hosts ask the audience for a suggestion.\n- The hosts use the suggestion to create the title of the foreign film.\n- The premise is that the film is in an obscure language, but the subtitles are not working.\n- The actors perform a scene speaking gibberish.\n- After each gibberish line, the actor pauses.\n- One of the hosts translates the line into English.\n- The actors continue the scene based on the emotional and physical meaning being created by the translations.\n- The game continues until the scene reaches a strong ending or the host/editor ends it.\n\n**For Students**\n- Gibberish still needs intention.\n- Strong gibberish uses rhythm, volume, pauses, emotional tone, repeated sounds, gesture, eye contact, and physical relationship.\n- The host should translate the whole offer, not just the sound.\n- Good translations come from what the actor gives: fear becomes confession, pride becomes boast, desperation becomes plea, anger becomes accusation, tenderness becomes vulnerability.\n- Hosts should translate quickly enough to preserve rhythm.\n- The best translations give the actors a next playable move.\n- If an actor gives too little gibberish, the host may still translate from body language, facial expression, or silence.\n- The hosts should make the actors look intentional, not expose that they are struggling.\n- Leave space between offers: don't talk over your translator. The beat between gibberish and translation is where the game lives.\n**For Teachers**\n- Actors should deliver enough gibberish to give the hosts something to translate.\n- Actors should commit vocally and physically.\n- Remind actors to pause after each line and let the hosts translate.\n- Coach hosts to follow the actor\u2019s physical and emotional offers.\n- Call out translations that contradict the actor\u2019s obvious emotional tone.\n- Watch for the scene losing an ongoing narrative.\n- Coach actors to incorporate the host\u2019s translation into their next line or behavior.",

      "introScript": "For our next game, [Player 1] is going to be sharing a slideshow from vacation with [Player 2], and as they do, the other players are going to demonstrate what they're looking at.\n\nTo get us started, may I please have (audience get \u2014 a place you might go on vacation).\n\n[Confirm get.]\n\nThis is Slideshow.",
      "fullMarkdown": "**Skills**\ntableau; narration; visual offers; justification\n\n**Rules**\nOne player (Presenter) shows vacation photos to another player (Listener). Two or three others create the photos and videos.\n\nThe Presenter narrates each image; the Listener reacts, asks questions, and provides stakes.\n\nPhoto players freeze strongly for photos; move clearly for videos.\n\nThe Presenter may pause, rewind, slow-motion, or freeze-frame a video as needed.\n\nPhoto/Video players: Make bold, readable images quickly. Use levels, distance, facial expression. Give the Presenter something interesting to justify.\n\nPresenter: Frame the vacation story. Treat every pose as intentional. Build escalation across photos \u2014 location, disaster, relationship turn, consequence.\n\nListener: React as someone being shown the album. Ask questions. Notice odd details. Provide emotional stakes through surprise, suspicion, or concern.\n\n**Success Looks Like**\nEach photo adds something new \u2014 images are readable from the back of the room; the vacation story escalates; the Presenter treats every pose as a gift.\n\n**For Students**\nPhoto players: make your image readable before the Presenter speaks. Don't wait for instruction \u2014 commit to a bold pose.\n\nPresenter: if a pose is confusing, define it confidently. The physical offer is always right.\n\nListener: you're not a prop. Your reactions create stakes and give the Presenter somewhere to go.\n\n**For Teachers**\nCommon failure: vague or unreadable images \u2014 push players to use levels, distance, and eye-line.\n\nThe vacation story should escalate, not just list unrelated pictures. Coach Presenters to build consequences across photos.\n\nIf a video becomes chaotic, the Presenter has tools: pause, rewind, slow-motion, freeze-frame. Teach them to use these.",

      "fullMarkdown": "**Skills**\ngibberish; continuity; language switching\n\n**Rules**\n- Two players perform a scene.\n- A third player stands offstage or to the side with a bell.\n- The scene begins in gibberish.\n- Whenever the bell rings, the players immediately switch languages.\n- If they were speaking gibberish, they switch to English.\n- If they were speaking English, they switch back to gibberish.\n- The bell may ring during a sentence, forcing the player to continue the same thought in the new language.\n- The scene continues until it reaches a strong ending or the host/editor ends it.\n\n**For Students**\n- The strongest version preserves the sentence across the switch.\n- If the bell rings mid-sentence, continue the same thought in the new language.\n- Gibberish should still have syntax, rhythm, emotional tone, and intention.\n- The audience does not need to understand every gibberish word; they need to understand the emotional and relational direction.\n- Good gibberish has shape. It should sound like a real language even though it is not one.\n- Strong physical choices make the gibberish much easier for the audience to follow.\n\n**For Teachers**\n- Coach hosts to initiate a switch regularly.\n- Push gibberish to carry real emotional and physical intention.\n- Remind players to play the scene, not wait for the switch.",

      "fullMarkdown": "**Skills**\nalternate offers; flexibility; meaningful substitutions\n\n**Rules**\nTwo players perform a scene. A third player is the caller.\n\nAt any point the caller issues a call \u2014 the player who just spoke or acted must immediately replace that offer with a new one. The new choice becomes the scene's reality. The caller may call multiple times in a row.\n\nCaller options: \"New Choice\" (replace the last offer with something meaningfully different) \u00b7 \"New Accent\" \u00b7 \"New Reaction\" \u00b7 \"New Genre: [genre]\" \u00b7 and other scene-modifying calls. Replacements must be meaningfully different \u2014 a new meaning or quality, not a synonym.\n\nExample:\n- Original: \"I brought you flowers.\"\n- Weak: \"I brought you roses.\" (same meaning)\n- Strong: \"I brought you divorce papers.\"\n- Stronger: \"I brought you the raccoon that ruined our wedding.\"\n\n**Success Looks Like**\nEach new choice creates a meaningfully different reality; the caller pushes frequently enough that the game stays alive; players commit instantly without explaining the rejected offer.\n\n**For Students**\nDon't give a new word \u2014 give a new world. The replacement should change intention, relationship, or stakes.\n\nTreat the newest choice as true immediately. Don't explain or resist the call.\n\nThe audience loves watching you abandon safety and discover something better.\nOn a genre call, the genre changes but the scene doesn't. If you were talking about cars and the genre shifts to Western, you're still talking about cars \u2014 swerving to a new topic (suddenly discussing drinks) breaks the game.\n- Leave a beat between lines so the caller has room to call \u2014 talking over each other buries the calls that make the game work.\n**For Teachers**\nUnder-calling is the most common failure \u2014 if the caller isn't calling often, the game disappears into a normal scene.\n\nIf the replacement is a synonym, call again immediately. Don't let weak substitutions slide.\n\nCoach callers to push toward bigger emotion, clearer stakes, more specific objects, or stranger relationships \u2014 not just different words.",

      "fullMarkdown": "**Skills**\ncue listening; justified entrances/exits\n\n**Rules**\n- Each player is assigned a common word from the audience. Players begin a scene.\n- Whenever a player's assigned word is spoken, they must change stage status: enter if offstage, exit if onstage.\n- All entrances and exits must be justified within the reality of the scene. Multiple triggers can fire at once.\n- Watch out: accidentally saying your own trigger word counts.\n\n**Success Looks Like**\nPlayers catch every cue; entrances and exits feel motivated, not mechanical; the scene still has relationship, stakes, and location underneath the constraint.\n\n**For Students**\n- Don't just walk on or off \u2014 make the movement part of the story. A forced exit can be fear, urgency, embarrassment, or betrayal.\n- Stay in the scene even while tracking your word. The constraint is not the whole job.\n- A forced entrance should bring energy, information, or pressure \u2014 not just presence.\n\n**For Teachers**\n- Choose words that are common enough to appear naturally but not so common the scene becomes unplayable.\n- Watch for scenes that devolve into players just saying each other's trigger words \u2014 coach them to serve the scene, not the mechanic.\n- Watch for scenes with no relationship underneath them. Players still have to do a scene, even with the rules.\n- Players should justify their entrances and exits.",

      "fullMarkdown": "**Skills**\nword-count constraint; economy; sentence control\n\n**Rules**\nThree players (sometimes four) perform a scene. The audience assigns each player a number between 1 and 7.\n\nEvery line each player speaks must contain exactly their assigned number of words. Contractions count as one word.\n\nIncorrect word counts are buzzed. Players are expected to count.\n\nThe scene continues until it reaches a strong ending or the host ends it.\n\nExample:\n- Player A (1): \"Dad.\"\n- Player B (4): \"You missed dinner again.\"\n- Player C (7): \"I was trapped inside the old carnival.\"\n\n**Success Looks Like**\nPlayers manage the technical constraint without losing the scene \u2014 relationship, stakes, and location stay alive; word counts feel deliberate rather than stumbled into.\n\n**For Students**\nThe word count is the constraint, not the scene \u2014 keep playing the relationship.\n\nFewer words demands stronger words. Load each one with intention.\n\nMore words doesn't mean padding \u2014 use them to add specificity.\n\nIf you miscounted, recover and keep moving. Don't break the scene to correct yourself.\n\n**For Teachers**\nThe one-word player tends to go passive \u2014 coach them to use loaded, active words.\n\nHigh-count players often pad. Push for specificity over filler.\n\nCommon failure: players focus so hard on counting that the scene goes flat. Redirect to the scene first.\n\nPhysical action can carry meaning when the verbal constraint is tight.",

      "fullMarkdown": "**Skills**\nrapid jokes; character snapshots; brevity\n\n**Rules**\n- Host gets a suggestion from the audience (profession, role, situation) and announces: \"World's worst [suggestion].\"\n- Players step forward one at a time, deliver a short bit or line demonstrating the world's worst version, then step back. Others continue stepping in.\n- Host ends the round when energy dips or a strong button lands, then starts a new round with a fresh suggestion.\n- Examples: \"World's worst doctor: Good news. I watched half a YouTube video.\" / \"World's worst babysitter: Whoever finds the snake first gets dessert.\"\n\n**Success Looks Like**\nPlayers step forward quickly with confident, brief bits; the pace stays high; jokes land and get out cleanly; the host pulls the ripcord at the right moment.\n\n**For Students**\n- Step forward on a good-enough idea. Waiting for the perfect joke kills the game.\n- One clear premise delivered confidently beats a long setup every time.\n- Get out cleanly after the joke lands. Don't extend it.\n\n**For Teachers**\n- Hesitation hurts more than a mediocre line.\n- Initiative is important \u2014 coach everyone to step forward early and often.\n- End each round on a strong laugh or when energy drops \u2014 don't let a weak stretch run long.",

      "fullMarkdown": "**Skills**\nmemory; replay discipline; role coverage; solo clarity\n\n**Rules**\nFive players perform a scene together. It must establish clear who, what, and where \u2014 every player needs at least one memorable contribution.\n\nAfter each replay, the host removes one player (audience may vote). The remaining players replay the scene from the top, covering the missing player's lines and actions.\n\nThe scene resets from the beginning each time. Coverage is flexible \u2014 any remaining player may jump in.\n\nWhen only one player remains, they perform the entire scene solo, covering all characters.\n\nRound 1: 5 players\nRound 2: 4 players \u2192 cover 1 missing role\nRound 3: 3 players \u2192 cover 2 missing roles\nRound 4: 2 players \u2192 cover 3 missing roles\nRound 5: 1 player \u2192 covers all 5 roles solo\n\n**Success Looks Like**\nEach replay is recognizably the same scene but increasingly difficult; missing lines are covered without hesitation; the final solo performance is energetic and readable.\n\n**For Students**\nIn the first scene, give the group something memorable \u2014 a distinctive line, action, or physical position worth replaying.\n\nDon't wait for permission to cover a missing line. If no one else is moving, move.\n\nIn the final solo, physical and vocal separation between characters is everything \u2014 the audience needs to know who you're being.\n\n**For Teachers**\nIf the original scene is too vague to replay, the whole game falls apart. Coach the first scene to have clear landmarks.\n\nCommon failure: remaining players drop missing material rather than covering it. Redirect \u2014 preserving the scene's skeleton is the game.\n\nKeep transitions between replays tight. Let the host keep the pace; dragging kills momentum.",

      "fullMarkdown": "**Skills**\nscene memory; layered structure; reverse returns\n\n**Rules**\nGrowing and Shrinking begins with a true-to-life personal monologue, then grows one player at a time until all players are onstage. It then shrinks back down as players leave in reverse order, returning to earlier scenes.\n\nA simple six-player structure:\n- Player A begins alone with a true-to-life monologue \u2014 a real, personal story told honestly.\n- Player B enters and begins a new scene with Player A.\n- Player C enters and begins a completely new scene with Players A and B.\n- Player D enters and begins a completely new scene with Players A, B, and C.\n- Player E enters and begins a completely new scene with Players A, B, C, and D.\n- Player F enters and begins a completely new scene with all six players.\n\nThen the structure reverses:\n- Player F exits, and the group returns to the previous five-person scene.\n- Player E exits, and the group returns to the previous four-person scene.\n- Player D exits, and the group returns to the previous three-person scene.\n- Player C exits, and the group returns to the previous two-person scene.\n- Player B exits, and Player A returns to the original solo scene or monologue.\n\n**For Students**\n- Each scene needs a strong, memorable label in the players\u2019 minds.\n- Make early scenes simple and specific.\n- The first line of each new scene should strongly establish the new reality.\n- Use different relationships, locations, body positions, and emotional tones for each layer.\n- Physical specificity helps memory.\n- When returning to an earlier scene, restart with the strongest remembered offer.\n- The shrinking half is the payoff, so the growing half must establish clean, memorable scenes.\n\n**For Teachers**\n- Coach players to make their early scenes memorable and distinct.\n- Push for new scenes that are clearly distinct from prior ones in tone, relationship, or energy.\n- Remind players entering that they have to establish the scene for the other players.\n- Watch for the full-stage scene becoming chaotic.\n- Balance the memory load: players who over-focus on remembering stop playing the scene. The goal is both.",

      "fullMarkdown": "**Skills**\nmonologues; thematic listening; editing; two-person scenes\n\n**Structure**\nThree true monologues open the form: the first inspired by the audience suggestion, the second by the first monologue, the third by the second. After the third, the troupe repeats the original suggestion and claps.\n\nA series of two-person scenes follows, inspired by the monologues' themes, images, emotions, or relationships \u2014 not literal reenactments.\n\nAny offstage player may edit. Edits are walk-through edits; new players enter after. Flying Pig prefers longer scenes with deeper relationship development.\n\nScenes are independent \u2014 callbacks are welcome if they arise naturally, but a shared universe is not required.\n\nThe monologues are fuel, not scripts. Use them for emotional tone, relationship dynamics, status patterns, fears, desires, specific behaviors \u2014 not to reenact what was said.\n\n**Success Looks Like**\nScenes feel grounded and specific; edits happen at strong moments; the ensemble supports each other's initiations; the form accumulates meaning without forcing connections.\n\n**For Students**\nStart scenes with clear who, what, and where. Vague premises drift.\n\nEdit on a laugh, strong emotional turn, or moment of completion \u2014 not just when you feel like entering.\n\nIf a scene starts circling the same beat, it's ready to be cut. If it hasn't found its center yet, support it.\n\n**For Teachers**\nMonologues that run too long or become too performative drain the opening. Keep them honest and personal.\n\nCommon failure: players pull only literal details from monologues. Coach them to reach for theme, emotion, and image instead.\n\nDon't force callbacks or shared-universe connections \u2014 the montage doesn't require them, and forcing them makes scenes feel mechanical.",

      "fullMarkdown": "**Skills**\ncharacter POV; audience-planted opening; community world-building\n\n**Structure**\n- The form begins as a public meeting, usually framed as an HOA meeting, town hall, or city council meeting.\n- One player is not undercover and serves as the meeting leader or facilitator.\n- The other players are planted undercover in the audience.\n- The meeting leader brings the meeting to order.\n- The meeting leader asks the real audience for a suggestion.\n- The meeting leader begins calling on the planted players in the audience.\n- Each planted player responds in character, giving their take on the issue and introducing themselves.\n- Once all player-characters have been introduced, the performers move to the stage.\n- The long-form scene sequence begins.\n- Scenes are performed in the characters established during the town hall opening.\n- Scenes usually begin as two-person scenes.\n- Off-scene players may edit scenes when they choose.\n- When the form reaches time, a strong culmination, or a natural endpoint, someone calls the end of the game.\n- After the long-form ends, someone introduces or transitions into the rest of the show.\n\n**Success Looks Like**\nStart a show with immediate audience interaction; Establish characters publicly before scene work begins.\n\n**For Students**\n- Each planted player should enter with a clear character POV, not just a funny complaint.\n- The town hall portion should generate usable scenic material:\n  - relationships,\n  - grudges,\n\n**For Teachers**\n- Undercover players do not commit strongly enough before the reveal.\n- Character introductions become too similar to each other.\n- Players give jokes instead of playable characters.\n- Each planted player should enter with a clear character POV, not just a funny complaint.\n- The town hall portion should generate usable scenic material:",

      "fullMarkdown": "**Skills**\ntransition; repetition; long-form continuity\n\n**Rules**\nTwo players perform a scene. At some point, one player repeats the other's last line \u2014 as a new character, with a clear change in physicality, voice, or context.\n\nThe player whose line was repeated exits. A new player enters and responds to the repeated line as the start of a new scene.\n\nThe form continues as a chain of scenes, each launched by a transformed repeated line.\n\nThe repeated line must be exact and the character shift unmistakable \u2014 otherwise the ensemble can't tell if an edit is happening. Subtle transitions break the form.\n\n**Success Looks Like**\nThe repeated line is recognizable as both a callback and a new scene's first line; exits are clean; entries are immediate; the chain keeps momentum.\n\n**For Students**\nRepeat the line as exactly as possible. Changing even a word creates ambiguity about whether you're editing.\n\nMake the character shift unmistakable \u2014 physicality, voice, and context should all change.\n\nIf you're the player whose line was repeated, trust the edit and leave cleanly. Don't linger.\n\n**For Teachers**\nThe hardest part: players who need to edit most (stalled scenes) are often least aware they should. Practice self-editing as a skill separately.\n\nCommon confusion: players repeat lines during normal dialogue without intending an edit. The character shift is what signals the transition \u2014 drill that distinction.\n\nEntering players must respond immediately. Hesitation after a clean edit kills the momentum the technique is meant to create.",

      "fullMarkdown": "**Skills**\ncharacter chain; relationship transitions; continuity\n\n**Structure**\nA chain of two-person scenes. One player always remains as the same character; a new player enters and begins a new scene with them.\n\nIn the Flying Pig version, an offstage player tags in for one of the active players \u2014 the other stays onstage and continues as the same character.\n\nThe form eventually circles back, revealing different sides of each character through different relationships.\n\nExample:\n- Scene 1: A + B \u2192 C tags out A\n- Scene 2: B + C \u2192 D tags out B\n- Scene 3: C + D \u2192 E tags out C\n- Scene 4: D + E \u2192 \u2026\n\n**Success Looks Like**\nThe continuing character is clearly recognizable across scenes; each new partner reveals a different side of them; transitions are clean and the chain feels intentional.\n\n**For Students**\nIf you're the continuing character, preserve who you are \u2014 don't shift personality to match the new partner.\n\nIf you're entering, establish a new relationship immediately. Don't continue the previous scene's conversation.\n\nAsk yourself: \"Who else knows this person, and what different side of them do I bring out?\"\n\n**For Teachers**\nMost common failure: the remaining player drifts character to match each new partner, and the chain loses its anchor.\n\nTag-ins should happen on strong moments \u2014 not just when a player feels like entering. Early tags cut off scenes before relationships are established.\n\nDistinguish from Repeater: La Ronde edits are triggered from offstage; Repeater edits are triggered from inside the scene by repeating a line.",

      "fullMarkdown": "**Skills**\nscene weaving; callbacks; transition discipline; offstage listening; line repetition\n\n**Rules**\nThree fixed pairs each own a recurring scene strand. Pair A starts; the others wait offstage.\n\nAn offstage pair repeats a line from the active scene \u2014 this triggers a different offstage pair to enter. The active pair exits.\n\nPairs do not trigger their own scene. Pair C repeating a line triggers Pair B, not Pair C.\n\nWhen a pair returns, they resume their own strand and justify the repeated line in their own context. Time jumps are common.\n\nExample cycle:\n- Pair A active \u2192 Pair C repeats a line \u2192 Pair B enters, Pair A exits\n- Pair B active \u2192 Pair A or C repeats a line \u2192 Pair C enters, Pair B exits\n- Pair C active \u2192 cycle continues\u2026\n\n**Success Looks Like**\nThe audience can track all three strands; repeated lines feel satisfying and then surprising when justified in a new context; each return advances the scene rather than replaying it.\n\n**For Students**\nListen from offstage. You need a line worth repeating before you can trigger anything.\n\nWhen you return to your strand, don't just resume \u2014 something should have changed: time, status, stakes, consequence.\n\nThe repeated line isn't just a cue \u2014 justify it so it becomes true in your scene.\n\n**For Teachers**\n- Drill the rule early: you trigger others, not yourself. This is the most common point of confusion.\n- Coach each return to escalate or reveal something new.\n- Push pairs to establish distinct identities from the start.",

      "fullMarkdown": "**Skills**\ntag-outs; character chain; relationship initiation\n\n**Structure**\nTwo players begin a scene. An offstage player physically tags out one of them \u2014 that player exits.\n\nThe entering player starts a new scene with the character who stayed, establishing a new relationship immediately. Time jumps are common.\n\nThe form follows the character who stayed \u2014 each new scene reveals a different side of them through a new relationship.\n\nThe entering player doesn't have to be someone mentioned in the previous scene \u2014 they invent a new relationship with whoever remains.\n\nExample chain: Dentist & patient \u2192 patient stays, wedding planner enters (patient is now a photographer) \u2192 photographer stays, bride enters \u2192 bride stays, bride's sister enters\u2026\n\n**Success Looks Like**\nEach tag-out is clear; the audience knows who stayed; the new relationship is established fast; the staying character remains recognizable while each scene reveals something new.\n\n**For Students**\nIf you're entering, name or imply the relationship right away: \"Dad\u2026\" / \"Officer\u2026\" / \"Professor, the committee rejected your theory.\"\n\nIf you're the staying character, preserve who you are \u2014 let the new relationship reveal a different side, not a different person.\n\nUse time jumps to create development: later that day, years later, after the relationship changed.\n\n**For Teachers**\nMost common failure: the staying player drifts character to match the new partner, and the chain loses its anchor.\n\nEntering players who wait for the staying character to define the relationship stall the scene. The entering player owns the initiation.\n\nThe chain should evolve through relationships and emotional reveals \u2014 not just mechanical tagging from one scene to the next.",

      "fullMarkdown": "**Skills**\nobject transformation; stage picture; two-player scene initiation\n\n**Rules**\n- 4 or more players participate.\n- Two chairs are placed on stage in an unusual configuration by two players from the group.\n- The configuration may include chairs being upside down, tilted, sideways, stacked or partially stacked, facing odd directions, separated at strange distances, or otherwise arranged in a way that suggests an object, location, obstacle, creature, vehicle, machine, or piece of environment.\n- Two different players then begin a two-person scene inspired by the configuration.\n- On a button, the two active players make eye contact, exit the scene, and move the chairs into a new configuration for the next pair.\n- Any two players from the waiting group may jump in for the next scene \u2014 there is no fixed rotation.\n- The game continues until the players (or teacher in class) call the end. Players are generally aware of the clock.\n\n**Success Looks Like**\n- Each chair arrangement inspires a distinct scene.\n- The audience can clearly understand what the chairs have become.\n- Players physically use the chairs in a committed, readable way.\n- The new realities are surprising but coherent.\n- Scenes feel emotionally grounded even when the object interpretation is strange.\n- Edits feel clean because the outgoing players create a strong visual offer for the next scene.\n- The form has variety, momentum, and strong visual play.\n\n**For Students**\n- The props are always chairs, but you can treat them as anything \u2014 a spaceship, a monster, a doorway, a weapon.\n- They can also just be chairs. A mix of literal and transformed interpretations across the set makes for a stronger game.\n\n**For Teachers**\n- Coach players who ignore the chair configuration entirely \u2014 the configuration is the initiation; a generic scene that ignores it is a missed offer.\n- Coach players who identify what the chairs are but don't physically interact with them \u2014 commitment means using the object, not just naming it.\n- Watch for scenes that are too similar to previous ones in how the chairs are interpreted. Encourage range across the set.",

      "introScript": "Thank you all for coming tonight. We've got one more game for you.\n\n[Conductor takes position. Game begins.]",
      "fullMarkdown": "**Also Known As**\nRecapapella (interchangeable \u2014 Flying Pig uses both names). Previously cataloged here under Troy's placeholder name \"Conducted Song / Show-Closing Conducted Song\" before the real name was learned.\n\n**Skills**\nmusical rhythm; conductor control; show closer energy\n\n**Rules**\n- One player serves as the conductor.\n- The conductor is usually the person ending the show.\n- The conductor was also a performer in the show earlier; they are not an outside musical director.\n- The other players stand in a line facing the audience.\n- The conductor stands in front of the line and faces the players.\n\n**Success Looks Like**\n- The audience recognizes lines from earlier in the show.\n- The repeated lines become funny or satisfying in combination.\n- The group finds a shared rhythm.\n- The conductor shapes the piece clearly.\n- Musical players add texture without making non-singers look bad.\n- The closer feels like a final callback to the whole show.\n- The group ends together on a clean cutoff.\n\n---\n\n**For Students**\n- Choose short, repeatable lines.\n- The line does not have to be witty by itself; silliness out of context is often enough.\n- Repetition creates the game.\n- The conductor should be bold and clear, even without formal conducting skills.\n\n**For Teachers**\n- Coach players to choose short, memorable lines.\n- Encourage players to listen and claim something distinct.\n- Remind players the line doesn't need to be witty \u2014 silliness out of context is often enough.",

      "fullMarkdown": "**Skills**\nlistening; vocal commitment; ensemble timing; holding a part; breath support; group cohesion\n\n**Rules**\n- The class is split into two groups.\n- Each group learns a different vocal part \u2014 two compatible melodies sung simultaneously.\n- Both groups sing at the same time, listening to each other while holding their own part.\n\n**Success Looks Like**\nBoth parts stay distinct; players remain committed and audible; the group holds together without one part collapsing into the other.\n\n**For Students**\n- Sing out \u2014 volume and commitment matter more than musical accuracy.\n- Listen to the other group without abandoning your own part.\n- This isn't a singing test. It's an ensemble exercise.\n\n**For Teachers**\n- The useful improv skill here is staying present and committed while something else is happening alongside you.\n- Watch for one group losing its part when the other enters \u2014 coach them to hold before speeding up.\n- Players who are self-conscious about singing need permission to be imperfect out loud.",

      "fullMarkdown": "**Also Known As**\nClose in mechanism to Fast Food Stanislavski (Keith Johnstone lineage) \u2014 both use a hidden interior state to shape behavior without stating it. Secrets is scoped to relational secrets inside a scene (grief, guilt, want); Fast Food Stanislavski uses character-type lists to generate variety. Treated as the same family of exercise for Flying Pig purposes rather than tracked as a separate activity.\n\n**Skills**\nsubtext; character want; emotional point of view; listening; inference; playing need without exposition; partner observation; emotional specificity\n\n**Rules**\n- Do not directly state your secret.\n- Do not turn the scene into interrogation or a guessing game during the scene.\n- Let the secret affect what you want, how you listen, how you react, and what you avoid.\n- The secret should influence the character without replacing the relationship, setting, or scene action.\n- The scene still needs a clear who, what, and where.\n- The secret should create playable subtext, not private mental trivia.\n\n**Success Looks Like**\n- Each character has a clear behavioral tilt from the secret.\n- The scene still has a grounded relationship and situation.\n- The secrets create tension, surprise, emotional specificity, or vulnerability.\n- The players do not directly reveal their secrets.\n- At the end, the guesses are at least directionally connected to what was played.\n- The audience or class can see how the secret influenced the performance.\n- The scene feels deeper because the characters are carrying private wants or wounds.\n\n**For Students**\n- The secret should shape behavior, not become dialogue.\n- A secret can create: need, grief, avoidance, urgency, insecurity, guilt, hope, desperation, emotional guardedness, or status behavior.\n- The scene should remain playable even if nobody guesses the secret correctly.\n- A successful scene does not require a perfect guess.\n\n**For Teachers**\n- A player blurts out their secret.\n- A player hints so obviously that the scene becomes a guessing game.\n- A player hides the secret so completely that it has no effect.\n- The secret should shape behavior, not become dialogue.\n- A secret can create: need, grief, avoidance, urgency, insecurity, guilt, hope, desperation, emotional guardedness, or status behavior.",

      "fullMarkdown": "**Skills**\ncharacter creation; emotional readability; physical embodiment; vocal commitment; point of view; accepting gifts; combining contradictory traits; specificity\n\n**Rules**\n- Prep: each student thinks of three real people they know \u2014 a first name and one personality descriptor.\n- Two players go up. Each receives two describing words and one first name, the coach pointing at a different off-stage student for each get \u2014 misaligned combinations (\"Nervous, Boisterous Henry\") are part of the point.\n- Both players build a character from their gets and play the scene in character; the coach cuts it, typically around one minute.\n- Use the gets to build the character.\n- Do not merely announce the adjectives.\n- Do not ignore difficult or contradictory descriptors.\n- Let the traits affect voice, posture, rhythm, emotional state, status, reactions, and point of view.\n- The scene still needs relationship, location, and present action.\n- The character should remain playable, not just a list of traits.\n\n**Success Looks Like**\n- The character reads quickly from the back of the room.\n- The player uses all or most of the gets.\n- The traits affect behavior throughout the scene.\n- The character has a clear point of view.\n- The scene still has a relationship and present action.\n- The character becomes more playable as the scene continues rather than fading away.\n- The audience or class can recognize how the original gets shaped the performance.\n\n**For Students**\n- The useful question is: \"How does this person behave because they are calm, fiery, excitable, studious, etc.?\"\n- The name can influence voice, age, status, rhythm, social energy, or worldview.\n- Strong players convert adjectives into playable behavior:\n  - Calm might mean stillness, low vocal tempo, grounded reactions.\n\n**For Teachers**\n- Coach players to embody the traits, not state them.\n- Watch for the character going generic despite specific gets.\n- Remind players to keep all the gets in play, not just the strongest one.\n- The useful coaching question is: \"How does this person behave because they are [trait]?\"\n- Remind players the name can influence voice, age, status, rhythm, and social energy \u2014 it's not just a label.",

      "fullMarkdown": "**Skills**\nsolo initiation; overlapping scenes; ensemble awareness; stage picture; commitment under chaos\n\n**Structure**\nBegins with a solo start \u2014 one player alone, making a bold physical/emotional choice, interacting with an invisible character.\n\nPlayers initiate new scenes on top of existing ones (overlap edits), creating stacked simultaneous scenes.\n\nScenes benefit from distinct contrast in energy, tone, or tempo so the audience can separate the threads.\n\nCore techniques:\n- Solo Starts: one player alone; interact with an invisible character as if real\n- Overlap Edits: initiate a new scene on top of an existing one \u2014 previous scene doesn't end\n- Stacked Scenes: multiple scenes active simultaneously; may share the same physical space\n- Bolts: decisively leave a scene; your character stays behind for the remaining player(s)\n- Swinging Gates: use bolts to move between scenes; commit fully to whichever scene you're in\n- Chair Pimps: plant a chair as a scenic offer for later scenes to use\n\nNote: Flying Pig-specific rules for this form still need validation (reviewed 2026-07-06 \u2014 kept as needs-review pending re-observation).\n\n**Success Looks Like**\nThe stage feels alive and chaotic but not randomly broken; players stay emotionally committed; the audience can absorb contrasting threads; bolts and gates create fluid movement.\n\n**For Students**\nEmbrace confusion \u2014 don't try to understand everything happening. Commit to the scene you're in right now.\n\nInvisible characters must be treated as real. Leave space for their lines; react to them.\n\nIn stacked scenes, contrast is how the audience tells threads apart. Different tempo, volume, or emotion makes coexistence readable.\n\n**For Teachers**\nThe form requires strong commitment, not casual randomness. Chaos without emotional investment is just noise.\n\nBolts must be decisive. A vague exit doesn't leave the character behind \u2014 it just looks like the player wandered off.\n\nCommon failure: all stacked scenes have the same energy, and the audience can't separate them. Coach for contrast.",

      "fullMarkdown": "**Skills**\nconcision; listening; clean offers; editing dialogue internally; emotional readability; physical behavior; subtext; specificity; scene economy\n\n**Rules**\n- Every line must be five words or fewer.\n- The scene is set in a cafe.\n- Players should still establish relationship, action, and emotional point of view.\n- The word limit should not become the only interesting thing in the scene.\n- Players should not avoid speaking entirely; the exercise is concise dialogue, not silence.\n- Physical action and emotional reaction become more important because dialogue is restricted.\n\n**Success Looks Like**\n- The scene remains active despite limited dialogue.\n- Players stay under the five-word limit.\n- The cafe setting is used physically.\n- Characters have clear wants or emotional states.\n- The relationship becomes clear through short lines, behavior, and reaction.\n- The constraint creates sharper dialogue rather than dead air.\n- The audience or class can still follow the scene.\n\n**For Students**\n- The word limit should sharpen the scene, not shrink commitment.\n- Short lines still need point of view.\n- Physical action can carry information that dialogue cannot.\n- Players should use the cafe environment: ordering, serving, cleaning, waiting, spilling, paying, avoiding someone, meeting someone, or confronting someone.\n- \"Slow down\" doesn't mean think slower \u2014 fill the space between your five words with space work, object work, and physical reactions. More non-verbal between verbal moments.\n**For Teachers**\n- Coach players who become so focused on counting that they stop acting. The constraint should sharpen the scene, not replace commitment.\n- Push for lines that still carry point of view. Short doesn't mean empty.",

      "fullMarkdown": "**Skills**\ncharacter range; fast commitment; physical transformation; vocal variety; emotional variety; status shifts; point of view; speed; audition readiness; recovery under pressure\n\n**Rules**\n- One player only.\n- 10 characters.\n- 60 seconds.\n- Each character should be distinct.\n- The player should not spend time explaining the character.\n- The character must be demonstrated through performance choices, not described from the outside.\n- The player simply goes while the coach times and counts. Characters are fully player-invented \u2014 no prompts.\n- Only clearly distinct, readable characters count toward the 10; blurred ones aren't credited.\n\n**Success Looks Like**\n- The player reaches 10 characters within 60 seconds.\n- The characters are clearly distinct.\n- The player commits physically and vocally.\n- The player uses a wide emotional and status range.\n- The transitions are fast.\n- The audience or auditors can immediately tell that a new character has appeared.\n- The player does not apologize, explain, or collapse after weak choices.\n\n**For Students**\n- Each character needs an immediate visible difference.\n- Strong changes may come from: posture, face, tempo, voice placement, emotional state, status, age, rhythm, physical center, or point of view.\n- The exercise rewards boldness over nuance.\n- A simple but committed character is better than a subtle underplayed one.\n- You may perform more than 10 \u2014 only the readable ones count. Distinctness beats quantity.\n\n**For Teachers**\n- Watch for characters that blur together.\n- Coach players who change only voice or only body. Both need to shift together with point of view.\n- Remind players that strong changes come from posture, face, tempo, voice placement, emotional state, status, age, rhythm, physical center, or point of view.",

      "fullMarkdown": "**Skills**\nemotional range; emotional readability; solo commitment; heightening; justification; emotional transitions; making mundane material playable; vocal and physical expressiveness; audition readiness\n\n**Rules**\n- The get should be mundane.\n- The player performs alone.\n- The player must demonstrate three big emotions.\n- The emotions should be distinct, not slight variations of the same feeling.\n- The player should not merely name the emotions.\n- The emotional states should be performed through voice, body, face, rhythm, point of view, and behavior.\n- The ordinary get should remain connected to the scene.\n- Exactly three emotions \u2014 the player calls their own ending after the third. The get comes from the coach or the class.\n\n**Success Looks Like**\n- The player creates three clearly different emotional states.\n- Each emotion is physically and vocally readable.\n- The mundane get remains the anchor.\n- The emotional progression feels heightened but playable.\n- The player commits without apology.\n- The scene has momentum rather than feeling like three disconnected demonstrations.\n- The audience or auditors can easily identify the emotional shifts.\n\n**For Students**\n- The point is not realism; the point is emotional availability and readability.\n- Mundane material is useful because it forces the player to supply the stakes.\n- Strong emotional choices might include: panic, joy, grief, shame, awe, rage, desperation, heartbreak, ecstatic confidence, confusion, fear, or overwhelming relief.\n- Each emotional shift should have a playable reason, even if the reason is heightened or absurd.\n- Link each shift to a change in the scene \u2014 don't jump directly from one emotion to the next. Use movement, not just voice.\n- End after three: sneaking in a fourth, or calling it with only two readable, are the classic mistakes.\n- If told to \"slow down,\" it means react physically before speaking and let non-verbal work carry the emotional shifts \u2014 not think slower.\n**For Teachers**\n- The emotions are too small to read.\n- The player changes the words but not the body or voice.\n- The emotions are not distinct enough.\n- The point is not realism; the point is emotional availability and readability.\n- Mundane material is useful because it forces the player to supply the stakes.",

      "fullMarkdown": "**Skills**\ngibberish; mime; guessing; clue-giving; memory drift; physical storytelling\n\n**Rules**\n- Six players are selected.\n- A chair is placed in the middle of the stage.\n- The chair represents a corpse.\n- Five of the six players leave the room or otherwise cannot hear the setup.\n- The one player who remains receives three pieces of information:\n  - the corpse's profession,\n  - the location of the murder,\n  - the method of murder.\n- The audience provides or helps provide these suggestions.\n- The player who remains functions as the host / starting detective.\n- The three items correspond to the letters L (Location), O (Occupation), and W (Weapon). When miming clues, players sign the letter \u2014 L, O, or W \u2014 to tell the receiving player which of the three they are currently describing. This keeps the information organized and tells the guesser what category they are receiving.\n\n**Success Looks Like**\n- The audience can follow the broad intent of the mimed clues.\n- The players commit fully to gibberish as meaningful language.\n- Each exchange feels like a real detective conversation.\n- The information mutates in funny, trackable ways.\n- The stage murders are clear and theatrical.\n- The final reveal produces escalating comic payoff as the guesses differ from the original setup.\n- The game remains fast enough to feel like a show piece rather than a classroom puzzle.\n\n**For Students**\n- The game needs bold, readable physical offers.\n- Gibberish alone is not enough; the mime must carry the information.\n- Players should use the full stage picture, including the chair/corpse.\n- Incoming players should actively investigate through gibberish questions and physical guesses.\n- Clue-givers should respond as if they understand the detective's questions, even though the language is nonsense.\n- The scene should feel like a heightened detective investigation, not like silent charades with noise.\n- The murder transition should be sudden and clear.\n- Wrong guesses are part of the entertainment; players should not overwork the clue transfer until it becomes slow.\n- The final reveal should emphasize the drift from the original information through each relay step.\n\n**Show Format Note**\nThe game can be run with a Host and 5 players. The Host introduces the game, manages the audience, and interviews the detectives at the end of the scene \u2014 asking each detective to recount their version of the murder before revealing what the original setup actually was.\n\n**For Teachers**\n- Push clue-givers to be specific and physical.\n- Coach detectives to ask active, physical questions rather than waiting passively. This should feel like a detective conversation, not a guessing game.\n- Remind players not to spend too long seeking perfect certainty.\n- The stage murder transition should be clear and committed.\n- Remind players the relay is a performance, not just a puzzle.",

      "fullMarkdown": "**Skills**\nreframing; escalation; character POV; status contrast; justification; concise ranting\n\n**Rules**\n- Host gets a pet peeve or minor complaint from the audience. Player 1 rants about it.\n- Another player interrupts with a theatrical \"Luxury!\" \u2014 then explains why Player 1's problem is actually desirable compared to their own worse situation, and begins ranting about that.\n- Repeat: each \"Luxury!\" must reframe the previous complaint as comparatively fortunate, then introduce a new, heightened problem.\n- Players keep the characters they establish. Game ends on a strong button.\n- Core pattern: \"You think that's bad? That would be a luxury compared to my situation\u2026\"\n\n**Success Looks Like**\nEach \"Luxury!\" gets a laugh by flipping the prior complaint; problems escalate in a clear pattern; players maintain distinct characters; the chain builds to a comic peak.\n\n**For Students**\n- The reframe matters as much as the new complaint \u2014 justify why the previous problem sounds good before launching into yours.\n- Specific misery beats generic misery. The audience needs to understand your problem quickly.\n- Keep the character you establish \u2014 your complaints should reveal who you are, not just what's bad.\n\n**For Teachers**\n- Watch for players who yell \"Luxury!\" and then skip the reframe \u2014 that's where the comic reversal lives.\n- New complaints that aren't worse, sharper, or more specific kill the escalation. Coach players to top through specificity, not just extremity.\n- The game needs a button \u2014 coach the last player or the host to recognize and land the peak rather than letting it trail off.",

      "fullMarkdown": "**Skills**\nrhythm; focus; listening; number tracking; vocal commitment; recovery\n\n**Rules**\n- Players stand in a circle. One player is Big Booty; the rest are numbered in order.\n- The group establishes a shared rhythm using thigh slaps and chanting.\n- The group opens with the chant, then Big Booty starts the call sequence. Each player calls their own name/number, then passes to another.\n- If a player misses the rhythm, says the wrong number, or hesitates too long, they move to the end and numbers shift. Reset quickly and keep going.\n\nExample:\n- Everyone: \"Big Booty, Big Booty, Big Booty \u2014 ah Big Booty\"\n- Big Booty: \"Big Booty, Number 4.\"\n- Number 4: \"Number 4, Number 7.\"\n- Number 7: \"Number 7, Big Booty.\"\n\n**Success Looks Like**\nThe group holds a clear rhythm; players respond loudly and quickly; mistakes produce laughter and reset energy rather than embarrassment.\n\n**For Students**\n- Keep the thigh-slap rhythm going \u2014 it supports everyone, not just you.\n- Know your current number after each reset; that's the hardest part.\n- When you mess up, reset fast and loud. Collapsing the energy is worse than the mistake.\n\n**For Teachers**\n- Start slowly enough that the group can succeed, then increase speed once the structure is stable.\n- After each reset, confirm everyone knows their new number before restarting.\n- The point is not perfection \u2014 it's shared rhythm, attention, and recovery. Keep it moving.",

      "fullMarkdown": "**Skills**\nlong-form memory; callbacks; scene continuation; editing; re-entry timing; structural awareness\n\n**Structure**\nMultiple scene strands are created through interruptions and transitions.\n\nEarlier scenes return later and continue from where they left off \u2014 they don't restart.\n\nThe form braids between recurring threads rather than treating each scene as an unrelated montage.\n\nFlying Pig plays it with three strands (Troy-confirmed 2026-07-06). Transition mechanics, opening, and ending still need confirmation.\n\nReturning scenes bring new information, callbacks, heightened relationships, or consequences.\n\n**Success Looks Like**\nThe audience recognizes returning scenes; earlier offers matter later; strands evolve rather than repeat; the form feels intentionally woven.\n\n**For Students**\nReturning scenes should continue, not reset. Pick up with consequence, escalation, or changed emotion.\n\nEach strand needs enough clarity in its first appearance to be recognizable when it returns.\n\nThe structure rewards patience and listening \u2014 resist interrupting before the current scene has produced usable material.\n\n**For Teachers**\nCommon failure: returned scenes restart instead of continuing, and the form collapses into montage.\n\nScene threads need to be distinct enough to track \u2014 if strands are too similar, the braid is invisible.\n\nStrong returns bring payoff: consequence, callback, or emotional shift from what was established before.",

      "fullMarkdown": "**Skills**\nguessing; clue-giving; hosting; reporter characters; audience feedback; press conference framing\n\n**Rules**\n- Six players are selected.\n- One player is the superhero and guesser.\n- The superhero leaves the room or otherwise cannot hear the audience suggestions.\n- One player remains as the press secretary / presenter.\n- The remaining four players are reporters. They embed in the audience before the show begins \u2014 seated among the audience members so the opening feels like a real press conference being interrupted by reporters in the room.\n- The press secretary gets three audience suggestions:\n  - the superhero's name,\n  - the superhero's power,\n  - the disaster the superhero saved the city from.\n- The superhero is called back in.\n- The scene is framed as a press conference where the city is honoring the superhero after the disaster.\n\n**Success Looks Like**\n- The superhero guesses actively throughout the interview.\n- Reporters ask clear, funny, clue-bearing questions.\n- The press secretary keeps the press conference organized.\n- The audience understands the snap/clap feedback system and participates.\n- The three target answers are discovered through escalating clues.\n- The superhero name, power, and disaster feel theatrically justified by the end.\n- The game produces a strong reveal/payoff rather than simply checking off answers.\n\n**For Students**\n- The press secretary should explain the audience feedback before the superhero returns or immediately after the return.\n- The superhero should keep guessing; wrong guesses are useful.\n- Reporters should ask questions that sound like press questions while carrying clues.\n- Strong reporter questions reveal both clue information and reporter character.\n- The press secretary should track which of the three answers have been solved.\n- Once one answer is guessed correctly, shift the clue pressure toward the remaining answers.\n- The game works best when the superhero accepts the premise and behaves as if they really are being honored.\n- The press conference should feel official enough that the absurdity has a strong frame.\n- The audience snapping/clapping gives the guesser a feedback loop, so players should leave space for that feedback to register.\n\n**For Teachers**\n- Coach reporters to ask questions that are specific enough to be useful but not so obvious they give the answer away.\n- The press secretary should actively manage order and pacing.\n- Encourage the superhero to guess out loud often.\n- Remind reporters to arrive with their own identity or attitude.\n- Remind players they are reporters, not just question-askers.",

      "fullMarkdown": "**Skills**\nenergy matching; partner listening; emotional synchronization; physical/vocal alignment; contrast; shared worldview\n\n**Rules**\n- Two players begin the scene.\n- The coach gives them a simple word suggestion.\n- The first two players use the word to initiate a scene.\n- The scene runs primarily as a two-person scene.\n- The two players should play distinct characters while matching each other's emotional, physical, and vocal energy.\n- A third player enters near the end with opposing energy.\n\n**Success Looks Like**\n- The first two players feel strongly connected.\n- Their shared energy is readable quickly.\n- The audience can tell why these two characters belong together.\n- The characters remain distinct while sharing emotional/physical/vocal tone.\n- The third player's entrance creates immediate contrast.\n- The contrast reveals something about the first two players.\n- The scene ends soon after the disruption lands.\n- The exercise sharpens partner awareness and energy matching.\n\n**For Students**\n- The first two players should quickly identify and heighten a shared energy.\n- Matching means emotional, physical, and vocal alignment, not identical behavior.\n- Distinct characters can still share the same rhythm, intensity, attitude, and worldview.\n- The third player should make a clean, contrasting offer.\n\n**For Teachers**\n- The first two players do not match energy clearly.\n- The players copy each other mechanically instead of sharing a playable energy.\n- The players become identical rather than distinct aligned characters.\n- The first two players should quickly identify and heighten a shared energy.\n- Matching means emotional, physical, and vocal alignment, not identical behavior.",

      "fullMarkdown": "**Skills**\nactive listening; agreement; quick thinking; language precision; scene work\n\n**Setup**\nTwo players take the stage. Remaining players wait on the sides, divided into two groups (left/right). Players self-manage \u2014 no host required.\n\n**Rules**\n- Players may only speak in questions. Any statement ends your turn immediately.\n- A statement followed by a question is not a valid response. For example, \u201cIt\u2019s hot in here, are you sweating?\u201d is a violation. (Note: this rule may be refined in future Flying Pig practice as experience accumulates.)\n- Each question must respond meaningfully to the previous question. Non-sequitur questions are not allowed. For example, if asked \u201cWould you like a hot dog or a hamburger?\u201d you cannot reply \u201cWho is your favorite singer?\u201d\n- You cannot repeat a question already asked in the scene.\n- When a player is buzzed out, a new player from the waiting group steps up and a new scene begins.\n\n**Success Looks Like**\nPlayers sustain genuine scene work \u2014 establishing location, relationship, and stakes \u2014 entirely through questions, with the constraint creating pressure rather than collapsing the scene.\n\n**For Students**\n- The hardest part is not the question format itself \u2014 it\u2019s maintaining scene logic while under format pressure. Stay in the scene; the constraint will take care of itself.\n- A question that \u201cresponds\u201d means you accept what the other player established. You can\u2019t just fire off an unrelated question.\n- Sentences that start with a question word but trail into a statement are still statements. Monitor your phrasing.\n\n**For Teachers**\n- Buzz clearly and without hesitation \u2014 ambiguous calls slow the game and reduce the pressure that makes it work.\n- The \u201cstatement + question\u201d rule (e.g., \u201cIt\u2019s hot in here, are you sweating?\u201d) is the most common gray area. Flying Pig rules treat this as a violation.\n- Watch for players who coast by asking vague, scene-neutral questions. The game is more interesting when questions have offers embedded in them.\n- New scenes reset each time someone steps up \u2014 don\u2019t let players try to continue a prior scene.\n\n---",
